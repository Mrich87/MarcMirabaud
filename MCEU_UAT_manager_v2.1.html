<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCEU — UAT Campaign Manager</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --ok:#22c55e; --fail:#ef4444; --block:#f59e0b; --na:#64748b; --prog:#a855f7;
    --chip:#0b1220;
    --headfrom:#0b1220; --headto:#16233b; --navbg:#0b1220; --oncolor:#06283b;
  }
  body.light{
    --bg:#eef2f7; --panel:#ffffff; --panel2:#e7edf4; --line:#cbd5e1;
    --txt:#0f172a; --muted:#5b6b80; --accent:#0284c7; --accent2:#0ea5e9;
    --na:#94a3b8; --chip:#f4f7fb;
    --headfrom:#ffffff; --headto:#eaf2fb; --navbg:#ffffff; --oncolor:#ffffff;
  }
  body.light header h1{color:#0f172a}
  body.light .pbar{background:#e2e8f0}
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  header{background:linear-gradient(90deg,var(--headfrom),var(--headto));border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .brand{color:var(--accent)}
  .iter-pill{margin-left:auto;display:flex;align-items:center;gap:8px}
  .iterdd{position:relative}
  .iterdd-btn{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;cursor:pointer;min-width:180px;text-align:left}
  .iterdd-menu{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:80;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.35);min-width:300px;max-height:60vh;overflow:auto;padding:4px}
  .iterdd-head{font-size:11px;color:var(--muted);padding:6px 8px 7px;border-bottom:1px solid var(--line);margin-bottom:2px}
  .iterdd-row{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:6px;cursor:pointer}
  .iterdd-row:hover{background:var(--panel2)}
  .iterdd-row.active{background:rgba(56,189,248,.12)}
  .iterdd-radio{flex:none;color:var(--accent);font-size:12px;width:12px;text-align:center}
  .iterdd-name{flex:1;font-size:13px}
  .iterdd-chk{flex:none;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted);cursor:pointer;padding:2px 6px;border:1px solid var(--line);border-radius:5px}
  .iterdd-chk input{margin:0}
  .iterdd-cnt{flex:none;font-size:11px;min-width:22px;text-align:right}
  select,input,textarea{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
  textarea{width:100%;min-height:50px;resize:vertical}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:var(--oncolor);font-weight:600}
  button.primary:hover{background:var(--accent)}
  button.danger{border-color:var(--fail);color:#fca5a5}
  button.sm{padding:3px 8px;font-size:12px}
  nav{display:flex;gap:4px;background:var(--navbg);padding:6px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:9px 18px;color:var(--muted);font-size:14px}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
  main{padding:18px;max-width:1600px;margin:0 auto}
  .view{display:none}
  .view.active{display:block}
  h2{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  .grid{display:grid;gap:12px}
  .cards{display:flex;gap:12px;flex-wrap:wrap}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:120px;flex:1}
  .kpi .n{font-size:26px;font-weight:700}
  .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);z-index:1}
  tr:hover td{background:rgba(255,255,255,.02)}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar .spacer{flex:1}
  .pbar{height:10px;background:#0b1220;border-radius:6px;overflow:hidden;display:flex;min-width:120px}
  .pbar span{display:block;height:100%}
  .muted{color:var(--muted)}
  .tag{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;margin:1px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted)}
  .matrix td,.matrix th{text-align:center}
  .matrix td.proc{text-align:left}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:680px;width:92%;max-height:88vh;overflow:auto}
  .pill{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
  code{background:var(--chip);padding:1px 5px;border-radius:4px}
  .ord{display:flex;align-items:center;gap:3px}
  .ord button{padding:0 6px;line-height:1.5;font-size:11px}
  .ord input{width:52px;text-align:center;padding:3px}
  details.sec>summary{cursor:pointer;font-weight:600;font-size:15px;padding:6px 0;list-style:none}
  details.sec>summary::before{content:"▸ ";color:var(--accent)}
  details.sec[open]>summary::before{content:"▾ "}
  .stickyhead{position:sticky;top:88px;background:var(--bg);padding:6px 0;z-index:2}
  .combo{position:relative;display:inline-block;vertical-align:top}
  .combo .combo-in{width:100%}
  .combo-list{position:absolute;z-index:60;left:0;right:0;top:100%;margin-top:2px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;max-height:240px;overflow:auto;display:none;box-shadow:0 10px 26px rgba(0,0,0,.45);min-width:170px}
  .combo-opt{padding:6px 9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .combo-opt:hover{background:var(--accent2);color:#06283b}
  .steptoggle{color:var(--accent);cursor:pointer;font-size:12px;user-select:none;white-space:nowrap}
  .steplist{margin:4px 0 2px;padding-left:20px}
  .steplist li{margin:2px 0}
  .steprow>td{background:var(--chip)}
  .reftag{display:inline-block;background:#a855f733;color:#c4b5fd;border:1px solid #a855f7;border-radius:10px;padding:0 6px;font-size:10px;font-weight:600;margin-left:6px;vertical-align:middle}
  .steptag{display:inline-block;background:#0ea5e933;color:#7dd3fc;border:1px solid #0ea5e9;border-radius:10px;padding:0 7px;font-size:10px;font-weight:600;margin-left:6px;vertical-align:middle}
  .steptag.app{background:#f59e0b22;color:#fcd34d;border-color:#f59e0b}
  .tpick{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:4px;cursor:pointer}
  .tpick:hover{background:rgba(255,255,255,.04)}
  .tlist{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;margin-top:4px}
  .calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
  .caldow{text-align:center;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:2px 0}
  .calcell{min-height:84px;border:1px solid var(--line);border-radius:8px;padding:5px 6px;background:var(--card);display:flex;flex-direction:column;gap:4px}
  .calcell.empty{background:transparent;border-color:transparent}
  .calcell.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
  .calcell.has{cursor:pointer}
  .calcell.has:hover{background:var(--accent2);color:var(--oncolor)}
  .caldate{font-size:12px;font-weight:600;color:var(--muted)}
  .calcell.today .caldate{color:var(--accent)}
  .calcnt{font-size:10px;font-weight:700;color:var(--muted)}
  .calpf{font-size:10px;display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
  .calpf b{font-weight:700}
  .calprocs{display:flex;flex-direction:column;gap:2px;margin:1px 0}
  .calproc{font-size:10px;line-height:1.25;background:var(--chip);border-radius:4px;padding:2px 5px;display:flex;flex-direction:column;gap:2px}
  .calprocrow{display:flex;align-items:center;gap:4px}
  .calproc[draggable=true]{cursor:grab}
  .calproc[draggable=true]:active{cursor:grabbing}
  .calcell.dragover{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent2);color:var(--oncolor)}
  .calproc .calprocn{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .calprocbar .pbar{height:4px;border-radius:3px;min-width:30px}
  .calmore{font-size:10px;font-weight:600;color:var(--accent);cursor:pointer;padding:1px 5px;border-radius:4px;align-self:flex-start}
  .calmore:hover{background:rgba(56,189,248,.14)}
  .caldaybar{margin-top:3px;opacity:.85}
  .calhalf{border-radius:6px;padding:2px 4px 3px;margin-top:3px;display:flex;flex-direction:column;gap:2px}
  .calhalf[data-half="AM"]{background:rgba(245,158,11,.08)}
  .calhalf[data-half="PM"]{background:rgba(56,189,248,.08)}
  .calhalf[data-half=""]{background:rgba(148,163,184,.07)}
  .calhalf.has[data-half="AM"]{background:rgba(245,158,11,.15)}
  .calhalf.has[data-half="PM"]{background:rgba(56,189,248,.15)}
  .calhalflbl{display:inline-block;align-self:flex-start;font-size:9px;font-weight:800;letter-spacing:.08em;cursor:pointer;text-transform:uppercase;padding:0 5px;border-radius:4px}
  .calhalf[data-half="AM"] .calhalflbl{background:rgba(245,158,11,.28);color:#f59e0b}
  .calhalf[data-half="PM"] .calhalflbl{background:rgba(56,189,248,.28);color:#38bdf8}
  .calhalf[data-half=""] .calhalflbl{background:rgba(148,163,184,.22);color:var(--muted)}
  .calhalflbl:hover{filter:brightness(1.18)}
  .calhalfn{color:var(--txt)}
  .calhalf.dragover{outline:2px dashed var(--accent);outline-offset:-1px;background:var(--accent2);color:var(--oncolor)}
  .calcnt{display:inline-block}
  .calgrid.calall .calcell{min-height:auto}
  .calgrid.calall .calprocrow{align-items:flex-start}
  .calgrid.calall .calproc .calprocn{overflow:visible;white-space:normal;word-break:break-word}
  .calproc .calsteps{flex:none;font-weight:700;color:var(--accent);font-size:9px}
  .calcell.has:hover .calproc{background:rgba(6,40,59,.12)}
</style>
</head>
<body>
<header>
  <h1><span class="brand">MCEU</span> · UAT Campaign Manager</h1>
  <span class="muted" id="saveStamp" style="font-size:11px;margin-left:6px"></span>
  <div class="iter-pill">
    <button id="themeBtn" class="sm" onclick="toggleTheme()" title="Toggle dark / light theme">🌙 Dark</button>
    <span class="muted" style="font-size:12px">Iteration(s)</span>
    <div class="iterdd" id="iterDD">
      <button class="iterdd-btn" id="iterDDbtn" onclick="toggleIterDD(event)">—</button>
      <div class="iterdd-menu" id="iterDDmenu"></div>
    </div>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <div id="view-dashboard" class="view"></div>
  <div id="view-library" class="view"></div>
  <div id="view-campaign" class="view"></div>
  <div id="view-calendar" class="view"></div>
  <div id="view-testerview" class="view"></div>
  <div id="view-admin" class="view"></div>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script>
/* =========================================================================
   MCEU UAT MANAGER v2 — local single-file web app · 4 screens
   Library (reusable PRC x Scenario definitions) -> Campaign (iterations,
   testers w/ country, dispatch on entities, execution tracking, per-tester
   standalone HTML) -> Dashboard + Admin (config + import/export).
   Persistence: localStorage + xlsx/JSON.
   ========================================================================= */

const LS_KEY = "mceu_uat_state_v2";
const APP_VERSION = "v2.0";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function defaultState(){
  const it1 = {id:uid(), name:"UAT 1", startDate:"", endDate:""};
  return {
    version:3,
    config:{
      campaignName:"MCEU UAT Campaign",
      entities:[
        {code:"LU", label:"Luxembourg",     color:"#38bdf8"},
        {code:"FR", label:"France",         color:"#a855f7"},
        {code:"SP", label:"Spain",          color:"#f59e0b"},
        {code:"UK", label:"United Kingdom",  color:"#22c55e"},
      ],
      departments:["Wealth Management","Operations","Compliance","Finance","Investment","Risk"],
      statuses:[
        {value:"Not started", color:"#64748b", requiresComment:false},
        {value:"In progress", color:"#a855f7", requiresComment:false},
        {value:"Passed",      color:"#22c55e", requiresComment:false},
        {value:"Failed",      color:"#ef4444", requiresComment:true},
        {value:"Blocked",     color:"#f59e0b", requiresComment:true},
        {value:"N/A",         color:"#475569", requiresComment:false},
      ],
      recurrences:["Often","Rarely","Exceptionally"],
      links:[],
      columnMapping:{ process:"TitleLevel3", scenario:"TitleLevel4", domain:"TitleLevel2", tester:"TesterName" }
    },
    testers:[],
    library:[],
    iterations:[it1],
    activeIterationId:it1.id,
    executions:[]
  };
}

let S = load();
function load(){ try{ const r=localStorage.getItem(LS_KEY); if(r) return migrate(JSON.parse(r)); }catch(e){} return defaultState(); }
function migrate(s){ const d=defaultState();
  const cfg=Object.assign(d.config,s.config||{});
  cfg.columnMapping=Object.assign(d.config.columnMapping,(s.config||{}).columnMapping||{});
  return Object.assign(d,s,{config:cfg}); }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); stampSaved(); }
  catch(e){ const el=document.getElementById("saveStamp"); if(el){ el.style.color="#f59e0b"; el.textContent=APP_VERSION+" · ⚠ browser storage full — export a backup"; }
    if(!save._warned){ save._warned=true; alert("Browser storage is full (screenshots/large data). Use Admin → “Full backup (JSON)” to avoid losing data, then consider trimming evidence."); } } }
function stampSaved(){ const el=document.getElementById("saveStamp"); if(!el)return; el.style.color="";
  const lb=(S.meta&&S.meta.lastBackup)?(" · last backup "+new Date(S.meta.lastBackup).toLocaleDateString()):" · ⚠ no backup yet";
  el.textContent=APP_VERSION+" · saved "+new Date().toLocaleTimeString()+lb; }
function persist(){ save(); renderTab(currentTab); }

/* helpers */
const $ = sel => document.querySelector(sel);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
/* Steps may be plain strings OR structured objects {text, stream, app}. These helpers
   read either form so the structure (stream/app) is preserved and displayed. */
function stepText(s){ return typeof s==="string" ? s : ((s&&s.text)||""); }
function stepTags(s){ if(!s||typeof s==="string") return []; return [s.stream,s.app].filter(Boolean); }
function stepTagsHTML(s){ if(!s||typeof s==="string") return ""; return (s.stream?' <span class="steptag">'+esc(s.stream)+'</span>':'')+(s.app?' <span class="steptag app">'+esc(s.app)+'</span>':''); }
function normSteps(arr){ return (arr||[]).map(s=>({t:stepText(s),stream:(s&&typeof s==="object"&&s.stream)||"",app:(s&&typeof s==="object"&&s.app)||""})); }
const statusMeta = v => S.config.statuses.find(x=>x.value===v) || {value:v,color:"#64748b",requiresComment:false};
const entityMeta = c => S.config.entities.find(x=>x.code===c) || {code:c,label:c,color:"#64748b"};
const tester = id => S.testers.find(x=>x.id===id);
const testerName = id => { const t=tester(id); return t?t.name:"—"; };
const libTesterIds = c => (c&&c.defaultTesterIds&&c.defaultTesterIds.length)?c.defaultTesterIds:(c&&c.defaultTesterId?[c.defaultTesterId]:[]);
const testerNames = ids => (ids||[]).map(id=>{const t=tester(id);return t?t.name:null;}).filter(Boolean).join(", ");
const activeIter = () => S.iterations.find(i=>i.id===S.activeIterationId) || S.iterations[0];
const libById = id => S.library.find(c=>String(c.id)===String(id));
const naturalKey = s => String(s||"").toLowerCase().replace(/\d+/g, m=>m.padStart(10,"0"));
const iterExecs = (iterId) => S.executions.filter(e=>e.iterationId===(iterId||S.activeIterationId));
/* cumulative view: one or more iterations selected for the progress views (Dashboard, Calendar) */
function ensureView(){ if(!Array.isArray(S.viewIterIds)||!S.viewIterIds.length)S.viewIterIds=[S.activeIterationId];
  if(S.viewIterIds.indexOf(S.activeIterationId)<0)S.viewIterIds.unshift(S.activeIterationId); }
function viewArr(){ let ids=(Array.isArray(S.viewIterIds)&&S.viewIterIds.length?S.viewIterIds:[S.activeIterationId]).filter(id=>S.iterations.some(i=>i.id===id));
  if(ids.indexOf(S.activeIterationId)<0)ids.unshift(S.activeIterationId); return ids; }
function viewSet(){ return new Set(viewArr()); }
function viewExecs(){ const s=viewSet(); return S.executions.filter(e=>s.has(e.iterationId)); }
function iterName(id){ const i=S.iterations.find(x=>x.id===id); return i?i.name:"—"; }
function viewLabel(){ const a=viewArr(); const act=activeIter(); if(a.length<=1)return act?act.name:"—"; return (act?act.name:"")+" +"+(a.length-1)+" (cumulative)"; }
function badge(text,color){ return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}66">${esc(text)}</span>`; }

/* =========================================================================
   SEARCHABLE TESTER COMBOBOX — sorted by name + type-to-filter.
   Drop-in replacement for the old unsorted <select> tester dropdowns.
   tCombo(key,value,onpick,opts) returns HTML. onpick is a JS snippet run on
   pick with the chosen id available as `v`. opts: {allowEmpty,emptyLabel,
   placeholder,width,hidden}. When `hidden` is set, the picked id is mirrored
   into a hidden <input id=hidden> so existing $("#id").value reads keep working.
   ========================================================================= */
const _combos={};
const jsq = s => String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
function tCombo(key,value,onpick,o){
  o=o||{};
  const list=S.testers.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const items=[];
  if(o.allowEmpty!==false) items.push({v:"",l:o.emptyLabel||"—"});
  list.forEach(t=>items.push({v:t.id,l:t.name+(t.country?" ("+t.country+")":"")}));
  _combos[key]={items,onpick:onpick||"",value:String(value||"")};
  const sel=items.find(it=>String(it.v)===String(value||""));
  const w=o.width||"200px";
  const hid=o.hidden?`<input type="hidden" id="${o.hidden}" value="${esc(value||"")}"/>`:"";
  return `<span class="combo" style="width:${w}" data-key="${esc(key)}">${hid}`+
    `<input class="combo-in" autocomplete="off" placeholder="${esc(o.placeholder||"🔍 search tester…")}" value="${esc(sel?sel.l:"")}" `+
    `onfocus="comboOpen('${jsq(key)}',this)" oninput="comboFilter('${jsq(key)}',this)" onkeydown="comboKey('${jsq(key)}',this,event)" onblur="comboBlur('${jsq(key)}')"/>`+
    `<div class="combo-list" id="cl_${esc(key)}"></div></span>`;
}
function comboItems(key,q){ const c=_combos[key]; if(!c)return [];
  q=(q||"").toLowerCase().trim();
  return c.items.filter(it=> q ? (it.v!=="" && it.l.toLowerCase().includes(q)) : true); }
function comboPaint(key,q){ const c=_combos[key],box=document.getElementById("cl_"+key); if(!c||!box)return;
  const list=comboItems(key,q);
  box.innerHTML=list.map(it=>`<div class="combo-opt" onmousedown="comboPick('${jsq(key)}','${jsq(it.v)}')">${esc(it.l)}</div>`).join("")||'<div class="combo-opt muted">no match</div>';
  box.style.display="block"; }
function comboOpen(key,inp){ comboPaint(key,""); if(inp.select)inp.select(); }
function comboFilter(key,inp){ comboPaint(key,inp.value); }
function comboBlur(key){ setTimeout(()=>{
  const b=document.getElementById("cl_"+key); if(b)b.style.display="none";
  const c=_combos[key],wrap=document.querySelector('.combo[data-key="'+key+'"]');
  if(c&&wrap){ const it=c.items.find(x=>String(x.v)===String(c.value))||{l:""}; const inp=wrap.querySelector(".combo-in");
    if(inp&&document.activeElement!==inp) inp.value=it.l; }
},150); }
function comboKey(key,inp,ev){ if(ev.key==="Enter"){ ev.preventDefault(); const l=comboItems(key,inp.value); if(l.length)comboPick(key,l[0].v); }
  else if(ev.key==="Escape"){ const b=document.getElementById("cl_"+key); if(b)b.style.display="none"; } }
function comboPick(key,v){ const c=_combos[key]; if(!c)return; c.value=String(v||"");
  const it=c.items.find(x=>String(x.v)===String(v))||{v:"",l:""};
  const wrap=document.querySelector('.combo[data-key="'+key+'"]');
  if(wrap){ wrap.querySelector(".combo-in").value=it.l; const h=wrap.querySelector('input[type=hidden]'); if(h)h.value=v; }
  const box=document.getElementById("cl_"+key); if(box)box.style.display="none";
  if(c.onpick){ try{ new Function("v",c.onpick)(v); }catch(e){ console.error("combo onpick",e); } } }

/* aggregation */
function aggregate(execs){
  const a={total:execs.length,byStatus:{},done:0,passed:0,failed:0,blocked:0,notrun:0};
  execs.forEach(e=>{ a.byStatus[e.status]=(a.byStatus[e.status]||0)+1;
    if(e.status==="Passed"){a.passed++;a.done++;} else if(e.status==="Failed"){a.failed++;a.done++;}
    else if(e.status==="Blocked"){a.blocked++;a.done++;} else if(e.status==="N/A"){a.done++;} else a.notrun++; });
  return a;
}
function progressBar(execs){ const a=aggregate(execs); if(!a.total) return '<div class="pbar"></div>';
  const seg=(n,c)=> n? `<span style="width:${n/a.total*100}%;background:${c}"></span>`:"";
  return `<div class="pbar">${seg(a.passed,'#22c55e')}${seg(a.failed,'#ef4444')}${seg(a.blocked,'#f59e0b')}${seg(a.byStatus['N/A']||0,'#475569')}${seg(a.byStatus['In progress']||0,'#a855f7')}</div>`; }

const DONE_STATUSES=["Passed","Failed","Blocked","N/A"];
function execMatch(e,key){
  if(key==="all") return true;
  if(key==="done") return DONE_STATUSES.includes(e.status);
  if(key==="todo") return !DONE_STATUSES.includes(e.status);
  return e.status===key;
}
function showExecModal(title,ex){
  ex=ex.slice().sort((a,b)=>naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario)));
  const rows=ex.map(e=>{const sm=statusMeta(e.status);return `<tr><td><b>${esc(e.process)}</b>${e.adhoc?' '+badge('ad-hoc','#a855f7'):''}</td><td>${esc(e.scenario)}</td><td>${badge(e.entity,entityMeta(e.entity).color)}</td><td>${esc(testerName(e.testerId))}</td><td>${badge(e.status,sm.color)}</td></tr>`;}).join("")||'<tr><td colspan="5" class="muted">No test case.</td></tr>';
  modal(`<h2>${title} <span class="muted" style="font-size:13px">(${ex.length})</span></h2>
    <div style="max-height:62vh;overflow:auto;margin-top:8px"><table><thead><tr><th>PRC</th><th>Scenario</th><th>Entity</th><th>Tester</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="toolbar" style="margin-top:12px"><div class="spacer"></div><button onclick="closeModal()">Close</button></div>`);
}
function openExecList(key){ const titleMap={all:"All assigned",done:"Executed",todo:"To do",Passed:"Passed",Failed:"Failed",Blocked:"Blocked"};
  showExecModal((titleMap[key]||key)+" — "+esc(viewLabel()), viewExecs().filter(e=>execMatch(e,key))); }
function openProcList(proc){ showExecModal(esc(proc)+" — "+esc(viewLabel()), viewExecs().filter(e=>(e.process||"(none)")===proc)); }
/* ---- SPOC assignment sheets: export a (blank) list, re-import their tester assignments ---- */
function trkFiltered(){ return iterExecs().filter(e=>
  (!trkFilter.entity||e.entity===trkFilter.entity)&&(!trkFilter.tester||e.testerId===trkFilter.tester)&&
  (!trkFilter.status||e.status===trkFilter.status)&&(!trkFilter.process||e.process===trkFilter.process)&&
  (!trkFilter.date||(e.testDate||"")===trkFilter.date)&&
  (!trkFilter.q||((e.process||"")+" "+(e.scenario||"")).toLowerCase().includes(trkFilter.q.toLowerCase()))); }
function exportAssignments(){
  const iter=activeIter();
  const ex=trkFiltered().sort((a,b)=>naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario)));
  if(!ex.length){ alert("No execution to export (check the tracking filters)."); return; }
  const data=ex.map(e=>({ExecId:e.id,Entity:e.entity,PRC:e.process||"",Scenario:e.scenario||"",Domain:e.domain||"",Tester:(tester(e.testerId)||{}).name||"",DueDate:e.testDate||""}));
  const ws=XLSX.utils.json_to_sheet(data); const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Assignments");
  const scope=trkFilter.entity||"all";
  XLSX.writeFile(wb,`MCEU_assignments_${slug(iter.name)}_${scope}_${new Date().toISOString().slice(0,10)}.xlsx`);
}
function genSpocPage(){
  const iter=activeIter();
  const ex=trkFiltered().sort((a,b)=>naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario)));
  if(!ex.length){ alert("No execution to export (check the tracking filters)."); return; }
  const scope=trkFilter.entity||"all";
  const payload={campaign:S.config.campaignName,iteration:iter.name,iterationId:iter.id,scope,
    entities:S.config.entities.map(en=>en.code),
    testerNames:S.testers.map(t=>t.name).filter(Boolean).sort((a,b)=>a.localeCompare(b)),
    rows:ex.map(e=>({id:e.id,process:e.process||"",scenario:e.scenario||"",entity:e.entity||"",domain:e.domain||"",tester:(tester(e.testerId)||{}).name||"",due:e.testDate||"",
      steps:normSteps(e.steps&&e.steps.length?e.steps:((libById(e.libraryItemId)||{}).steps||[]))}))};
  download(`MCEU_SPOC_${slug(iter.name)}_${scope}.html`, buildSpocHTML(payload), "text/html");
}
function buildSpocHTML(payload){
  const dataJson=JSON.stringify(payload).replace(/</g,"\\u003c").replace(/\u2028/g,"\\u2028").replace(/\u2029/g,"\\u2029");
  return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SPOC — ${esc(payload.scope)} — ${esc(payload.iteration)}</title>

<script>
const DATA=${dataJson};
const LSK="mceu_spoc_"+DATA.iterationId+"_"+DATA.scope;
let lang=(function(){try{return localStorage.getItem("mceu_spoc_lang")||"fr";}catch(e){return "fr";}})();
const I18N={fr:{title:"Feuille d'assignation SPOC",intro:"Choisis ton entité (en haut) : elle est appliquée automatiquement à TOUS les scénarios. Affecte ensuite un ou plusieurs testeurs (séparés par ;) à chaque test — tu peux déplier un test (▸) pour voir les étapes, utile pour choisir le bon testeur. Tu peux dupliquer un test (⧉) pour le rejouer/l'assigner à plusieurs, et retirer un scénario non pertinent (✕). Clique Enregistrer puis renvoie le .json au coordinateur.",hP:"PRC",hS:"Scénario",hE:"Entité",hT:"Testeur(s)",hD:"Date d'échéance",testerPh:"nom(s), séparés par ;",duePh:"ex. 2026-07-01",save:"⬇ Enregistrer (JSON)",saved:"enregistré ✓",assigned:"assignés",dup:"Dupliquer (rejouer / autre testeur)",delCopy:"Retirer cette copie",remove:"Marquer non pertinent (sera retiré)",restore:"Rétablir",copyTag:"copie",removedTag:"retiré",stepsN:"étapes ({n})",stepsFollow:"Étapes à suivre :",myEnt:"Mon entité :",workloadLbl:"Charge par testeur"},en:{title:"SPOC assignment sheet",intro:"Pick your entity (top): it is applied automatically to ALL scenarios. Then assign one or more testers (separated by ;) to each test — expand a test (▸) to view the steps, handy to pick the right tester. You can duplicate a test (⧉) to replay/assign it to several people, and remove a non-relevant scenario (✕). Click Save and send the .json back to the coordinator.",hP:"PRC",hS:"Scenario",hE:"Entity",hT:"Tester(s)",hD:"Due date",testerPh:"name(s), separated by ;",duePh:"e.g. 2026-07-01",save:"⬇ Save (JSON)",saved:"saved ✓",assigned:"assigned",dup:"Duplicate (replay / another tester)",delCopy:"Remove this copy",remove:"Mark not relevant (will be removed)",restore:"Restore",copyTag:"copy",removedTag:"removed",stepsN:"steps ({n})",stepsFollow:"Steps to follow:",myEnt:"My entity:",workloadLbl:"Tester workload"}};
function T(k,n){var v=(I18N[lang]||I18N.fr)[k]||k;return n==null?v:v.replace("{n}",n);}
function setLang(l){lang=l;try{localStorage.setItem("mceu_spoc_lang",l);}catch(e){}applyLang();render();}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function stepTagsHtml(s){var h="";if(s&&s.stream)h+=' <span class="steptag">'+esc(s.stream)+'</span>';if(s&&s.app)h+=' <span class="steptag app">'+esc(s.app)+'</span>';return h;}
function stepTxt(s){return typeof s==="string"?s:((s&&s.t)||"");}
let rows=[], expanded={}, myEnt="", sortDir=0;
function setMyEnt(v){myEnt=v;try{localStorage.setItem("mceu_spoc_ent_"+DATA.iterationId,v);}catch(e){}rows.forEach(function(r){r.entity=v;});autosave();render();}
function sortDue(){ sortDir = sortDir===1?-1:(sortDir===-1?0:1); render(); }
function applyLang(){["ttl|title","intro|intro","hP|hP","hS|hS","hE|hE","hT|hT","btnSave|save","btnSaveTop|save","lblEnt|myEnt"].forEach(function(p){var a=p.split("|");document.getElementById(a[0]).textContent=T(a[1]);});document.getElementById("hD").innerHTML=T("hD")+' <span id="arD"></span>';document.getElementById("langSel").value=lang;}
function render(){
  var tb=document.getElementById("tb"); tb.innerHTML="";
  var q=(document.getElementById("q").value||"").toLowerCase().trim(); var shown=0;
  var list=rows.map(function(r,i){return {r:r,i:i};});
  if(sortDir){ list.sort(function(a,b){var da=(a.r.due||""),db=(b.r.due||"");if(!da&&!db)return 0;if(!da)return 1;if(!db)return -1;return da<db?-sortDir:da>db?sortDir:0;}); }
  list.forEach(function(o){ var r=o.r,i=o.i; if(q&&!((r.process+" "+r.scenario+" "+r.entity).toLowerCase().indexOf(q)>=0)) return; shown++;
    var tr=document.createElement("tr"); if(r.removed) tr.className="removed";
    var nSteps=(r.steps&&r.steps.length)||0;
    var badges=(r.isDup?' <span class="badge" style="background:#a855f733;color:#c4b5fd">'+esc(T("copyTag"))+'</span>':'')+(r.removed?' <span class="badge" style="background:#ef444433;color:#fca5a5">'+esc(T("removedTag"))+'</span>':'');
    var stepTog=nSteps?' <span class="steptoggle">'+(expanded[r.id]?'▾':'▸')+' '+esc(T("stepsN",nSteps))+'</span>':'';
    var entOpts=DATA.entities.slice(); if(r.entity&&entOpts.indexOf(r.entity)<0)entOpts.push(r.entity);
    var entSel='<select class="ein">'+entOpts.map(function(c){return '<option'+(c===r.entity?' selected':'')+'>'+esc(c)+'</option>';}).join("")+'</select>';
    tr.innerHTML='<td class="pcell"><b>'+esc(r.process)+'</b>'+badges+stepTog+'</td><td class="pcell scen"'+(nSteps?' style="cursor:pointer" title="'+esc(T("stepsFollow"))+'"':'')+'>'+esc(r.scenario)+(nSteps?' <span class="steptoggle">'+(expanded[r.id]?'▾':'▸')+'</span>':'')+'</td><td>'+entSel+'</td>'+
      '<td><input class="tin" list="dl" value="'+esc(r.tester)+'" placeholder="'+esc(T("testerPh"))+'"'+(r.removed?' disabled':'')+'/></td>'+
      '<td class="duecell muted">'+esc(r.due||"—")+'</td>'+
      '<td style="white-space:nowrap"><button class="dupb" title="'+esc(T("dup"))+'" style="padding:4px 9px">⧉</button> <button class="remb" title="'+esc(r.isDup?T("delCopy"):(r.removed?T("restore"):T("remove")))+'" style="padding:4px 9px;background:'+(r.removed?'#22c55e':'#ef4444')+';color:#fff">'+(r.removed?'↺':'✕')+'</button></td>';
    var tin=tr.querySelector(".tin"); if(tin) tin.addEventListener("input",function(){rows[i].tester=this.value;autosave();updateProg();updateWorkload();});
    tr.querySelector(".ein").addEventListener("change",function(){rows[i].entity=this.value;autosave();});
    if(nSteps){ var togFn=function(){expanded[r.id]=!expanded[r.id];render();};
      var st=tr.querySelector(".pcell .steptoggle"); if(st) st.addEventListener("click",togFn);
      var sc=tr.querySelector(".scen"); if(sc) sc.addEventListener("click",togFn); }
    tr.querySelector(".dupb").addEventListener("click",function(){dupRow(i);});
    tr.querySelector(".remb").addEventListener("click",function(){removeRow(i);});
    tb.appendChild(tr);
    if(nSteps&&expanded[r.id]){ var sr2=document.createElement("tr"); sr2.className="steprow";
      sr2.innerHTML='<td></td><td colspan="5"><div class="muted" style="font-size:12px;margin-bottom:2px">'+esc(T("stepsFollow"))+'</div><ol class="steps">'+r.steps.map(function(s){return '<li>'+esc(stepTxt(s))+stepTagsHtml(s)+'</li>';}).join("")+'</ol></td>';
      tb.appendChild(sr2); }
  });
  var ar=document.getElementById("arD"); if(ar) ar.textContent=sortDir===1?"▲":sortDir===-1?"▼":"";
  document.getElementById("cnt").textContent=q?(shown+" / "+rows.length):""; updateProg(); updateWorkload();
}
function updateWorkload(){ var el=document.getElementById("wl"); if(!el)return; var counts={};
  rows.forEach(function(r){ if(r.removed)return; (r.tester||"").split(";").map(function(x){return x.trim();}).filter(Boolean).forEach(function(nm){ counts[nm]=(counts[nm]||0)+1; }); });
  var names=Object.keys(counts).sort(function(a,b){return counts[b]-counts[a]||a.localeCompare(b);});
  if(!names.length){ el.style.display="none"; el.innerHTML=""; return; } el.style.display="flex";
  el.innerHTML='<span class="muted" style="align-self:center">'+esc(T("workloadLbl"))+' :</span> '+names.map(function(nm){ var n=counts[nm]; var c=n>25?'#ef4444':(n>15?'#f59e0b':'#0ea5e9'); return '<span class="badge" style="background:'+c+'22;color:'+c+';border:1px solid '+c+'">'+esc(nm)+' <b>'+n+'</b></span>'; }).join(' '); }
function updateProg(){var act=rows.filter(function(r){return !r.removed;});var done=act.filter(function(r){return (r.tester||"").trim();}).length;document.getElementById("prog").textContent=done+" / "+act.length+" "+T("assigned");var pf=document.getElementById("pfill");if(pf)pf.style.width=(act.length?Math.round(done/act.length*100):0)+"%";}

function applyAssignments(rows){
  // Per-(process, scenario, entity, tester) merge within the active iteration. Each tester on a
  // process/scenario is its own execution, so: several SPOC files (one per entity) build a
  // cross-entity view; multiple testers on the same scenario coexist; and testers can be ADDED
  // afterward without touching the others. New testers are created and tagged with their entity
  // (country). Re-importing the same file just updates (idempotent, never blocking).
  let upd=0,newT=0,miss=0,cloned=0,created=0,removedN=0;
  const iter=activeIter();
  const findTester=(nm,ent)=>{ let t=S.testers.find(x=>x.name===nm);
    if(!t){ t={id:uid(),name:nm,email:"",country:ent||"",dept:""}; S.testers.push(t); newT++; }
    else if(ent&&!t.country){ t.country=ent; }   /* attach entity to an existing untagged tester */
    return t.id; };
  const isRem=r=>r.Remove===true||r.Remove==="true"||r.Remove==="yes";
  const sameSP=(x,proc,scen)=>x.iterationId===iter.id&&String(x.process||"").trim()===proc&&String(x.scenario||"").trim()===scen;
  rows.slice().sort((a,b)=>(isRem(a)?1:0)-(isRem(b)?1:0)).forEach(r=>{
    const id=String(r.ExecId||"").trim();
    // a source execution (by ExecId / srcId / proc+scen) lets us inherit library link, steps, txnRef
    let src = id?S.executions.find(x=>x.id===id):null;
    if(!src&&r.srcId) src=S.executions.find(x=>x.id===String(r.srcId));
    const proc=String(r.process||r.PRC||(src&&src.process)||"").trim();
    const scen=String(r.scenario||r.Scenario||(src&&src.scenario)||"").trim();
    if(!src&&(proc||scen)) src=S.executions.find(x=>x.process===proc&&x.scenario===scen);
    const ent=String(r.entity||r.Entity||(src&&src.entity)||"").trim();
    const dom=String(r.domain||r.Domain||(src&&src.domain)||"").trim();
    const due=("DueDate" in r)?String(r.DueDate||"").trim():null;
    if(isRem(r)){ const gone=S.executions.filter(x=>sameSP(x,proc,scen)&&(x.entity||"")===ent);
      if(gone.length){ const ids=new Set(gone.map(x=>x.id)); S.executions=S.executions.filter(x=>!ids.has(x.id)); removedN+=gone.length; } return; }
    if(!proc&&!scen){ miss++; return; }
    const mkExec=tid=>{ const base=src||{};
      const e=Object.assign({},base,{id:uid(),iterationId:iter.id,process:proc,scenario:scen,domain:dom,
        libraryItemId:base.libraryItemId||null,steps:Array.isArray(base.steps)?base.steps.slice():[],
        txnRef:!!base.txnRef,txnRefValue:"",recurrence:base.recurrence||"",adhoc:base.adhoc||false,
        entity:ent,testerId:tid||"",status:"Not started",comment:"",failedSteps:{},screens:[],testDate:"",
        updatedAt:new Date().toISOString()});
      S.executions.push(e); created++; return e; };
    // a first assignment can reuse an unassigned placeholder (blank-entity, or already this entity)
    const claimPh=tid=>{ const ph=S.executions.find(x=>sameSP(x,proc,scen)&&!x.testerId&&(!(x.entity||"").trim()||(x.entity||"")===ent));
      if(ph){ ph.entity=ent; ph.testerId=tid||""; return ph; } return null; };
    const ids = ("Tester" in r) ? String(r.Tester||"").split(/[;\n]/).map(x=>x.trim()).filter(Boolean).map(nm=>findTester(nm,ent)) : null;
    if(ids===null || ids.length===0){ // no tester provided -> keep/create one unassigned row so it still shows
      let e=S.executions.find(x=>sameSP(x,proc,scen)&&(x.entity||"")===ent&&!x.testerId)||claimPh("")||mkExec("");
      if(due!=null) e.testDate=due; e.updatedAt=new Date().toISOString(); upd++; return; }
    ids.forEach((tid,idx)=>{
      let e=S.executions.find(x=>sameSP(x,proc,scen)&&(x.entity||"")===ent&&x.testerId===tid);
      if(!e) e=claimPh(tid);            // reuse an empty placeholder for the first tester
      if(!e){ e=mkExec(tid); if(idx>0) cloned++; }
      if(due!=null) e.testDate=due; e.updatedAt=new Date().toISOString(); upd++;
    });
  });
  return {upd,newT,miss,cloned,created,removedN};
}
function importAssignmentsAny(input){ const f=input.files[0]; if(!f)return; if(/\.json$/i.test(f.name)) importSpocJSON(input); else importAssignments(input); }
function importAssignments(input){

    alert(`Assignments imported: ${res.upd} updated, ${res.created} new (duplicated), ${res.cloned} multi-tester, ${res.newT} new tester(s), ${res.removedN} removed`+(res.miss?`, ${res.miss} skipped`:``)+`.`);

const spocAmbEnt=v=>{ const s=String(v||"").trim().toUpperCase(); return !s||s==="ALL"; };
function importSpocJSON(input){
  const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=e=>{ try{ const p=JSON.parse(e.target.result); if(p._type!=="MCEU_SPOC_ASSIGNMENTS"){ alert("Not a SPOC assignment file."); return; }
    const rows=p.rows||[];
    const need=rows.some(x=>spocAmbEnt(x.entity||x.Entity));          // some lines carry no usable entity
    const scope=String(p.scope||"").trim();
    const scopeOk=scope&&S.config.entities.some(en=>en.code===scope); // file generated for a single real entity
    if(need&&scopeOk){ finishSpocImport(rows,scope); return; }        // safety net: auto-fall back to the file scope
    if(need){ promptSpocEntity(p,rows); return; }                     // still ambiguous -> ask (with a do-nothing way out)
    finishSpocImport(rows,"");                                        // every line already has an entity
  }catch(err){ alert("Invalid file."); } };
  r.readAsText(f);
}

}

/* import xlsx -> upsert library on (process,scenario); reads optional Steps / TxnRef columns */
function importDevops(input){
  const file=input.files[0]; if(!file)return;
  const sheetName=($("#impSheet")&&$("#impSheet").value)||"Tester_View";
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array"});
    const sn=wb.SheetNames.includes(sheetName)?sheetName:(wb.SheetNames.includes("Tester_View")?"Tester_View":wb.SheetNames[0]);
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:""});
    if(rows.length && ("Step / Action Required" in rows[0]) && ("Application" in rows[0])){ return importStepLevel(wb,rows,sn); }
    const m=S.config.columnMapping;
    const hasSteps=rows.length&&("Steps" in rows[0]);
    const hasTxn=rows.length&&("TxnRef" in rows[0]);
    const byKey=new Map(S.library.map(c=>[c.process+"||"+c.scenario,c]));
    let maxO=S.library.reduce((mm,c)=>Math.max(mm,c.order||0),0);
    let added=0,updated=0,newTesters=0,stepsSet=0; const seen=new Set();
    rows.forEach(r=>{
      const process=(r[m.process]||"").toString().trim();
      const scenario=(r[m.scenario]||"").toString().trim();
      if(!process&&!scenario) return;
      const key=process+"||"+scenario;
      const tnames=String(r[m.tester]||"").split(/[;\n]/).map(x=>x.trim()).filter(Boolean);
      const tIds=tnames.map(nm=>{ let t=S.testers.find(x=>x.name===nm); if(!t){t={id:uid(),name:nm,email:"",country:"",dept:""};S.testers.push(t);newTesters++;} return t.id; });
      const steps=hasSteps?String(r.Steps||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean):null;
      const txn=hasTxn?/^(y|yes|true|1|x|oui)$/i.test(String(r.TxnRef||"").trim()):null;
      const domain=(r[m.domain]||"").toString().trim();
      let c=byKey.get(key);
      if(c){
        if(!seen.has(key)){ updated++; seen.add(key); }
        if(domain) c.domain=domain;
        c.defaultTesterIds=c.defaultTesterIds||[]; tIds.forEach(id=>{ if(!c.defaultTesterIds.includes(id)) c.defaultTesterIds.push(id); });
        if(steps&&steps.length){ c.steps=steps; stepsSet++; }   /* never wipe steps from an empty/absent Steps column */
        if(txn!==null) c.txnRef=txn;
      } else {
        c={id:uid(),order:++maxO,domain,process,scenario,defaultTesterIds:tIds,notes:"",prereq:"",steps:steps||[],txnRef:txn||false};
        S.library.push(c); byKey.set(key,c); seen.add(key); added++; if(steps&&steps.length)stepsSet++;
      }
    });
    let n=0; sortedLib(S.library).forEach(c=>c.order=++n);
    save(); go("library");
    alert(`Import (sheet "${sn}"): ${added} new, ${updated} updated`+(hasSteps?`, steps set on ${stepsSet}`:``)+`, ${newTesters} tester(s) created. Library total: ${S.library.length}.`);
  };
  reader.readAsArrayBuffer(file);
}
/* Step-level import (UAT5 Tester_View): 1 row = 1 step -> grouped into one library
   item per (Process Ref, Scenario), structured steps {text,stream,app} + DevOps ids
   (manager-only) joined from Technical_Mapping for later Azure DevOps return. */
function importStepLevel(wb,rows,sn){
  const S2=wb.SheetNames.includes("Technical_Mapping")?XLSX.utils.sheet_to_json(wb.Sheets["Technical_Mapping"],{defval:""}):[];
  const idmap=new Map(), scmap=new Map(); const T=s=>String(s==null?"":s).trim();
  S2.forEach(r=>{ const pr=T(r["Process Ref"]),sr=T(r["Scenario Ref"]),st=T(r["Step Ref"]);
    idmap.set(pr+"|"+sr+"|"+st,{tcId:T(r["OriginalTestCaseId"]),tpId:T(r["OriginalTestPointId"])});
    if(!scmap.has(pr+"|"+sr)) scmap.set(pr+"|"+sr,{scenarioPath:T(r["ScenarioPath"]),internalScenarioKey:T(r["InternalScenarioKey"]),suiteId:T(r["OriginalMaxTestSuiteId"]),scenarioRef:sr}); });
  const groups=new Map();
  rows.forEach(r=>{ const pr=T(r["Process Ref"]),pn=T(r["Process Name"]),sr=T(r["Scenario Ref"]),sc=T(r["Scenario"]),dom=T(r["Domain"]); if(!pr&&!sc) return;
    const gk=pr+"|"+sr; let o=groups.get(gk); if(!o){o={pr,pn,sr,sc,dom,tester:T(r["Assigned Tester"]),steps:[]}; groups.set(gk,o);}
    const ids=idmap.get(pr+"|"+sr+"|"+T(r["Step Ref"]))||{};
    o.steps.push({order:parseInt(T(r["Step Ref"]),10)||(o.steps.length+1),text:T(r["Step / Action Required"]),stream:T(r["Step Implicated Stream"]),app:T(r["Application"]),tcId:ids.tcId||"",tpId:ids.tpId||""}); });
  const byKey=new Map(S.library.map(c=>[c.process+"||"+c.scenario,c]));
  let maxO=S.library.reduce((mm,c)=>Math.max(mm,c.order||0),0); let added=0,updated=0,newTesters=0;
  groups.forEach(o=>{ o.steps.sort((a,b)=>a.order-b.order);
    const steps=o.steps.map(s=>({text:s.text,stream:s.stream,app:s.app,tcId:s.tcId,tpId:s.tpId}));
    const process=(o.pr+" "+o.pn).trim(), scenario=o.sc, key=process+"||"+scenario;
    const devops=scmap.get(o.pr+"|"+o.sr)||{scenarioRef:o.sr};
    const tIds=(o.tester?o.tester.split(/[;\n]/):[]).map(x=>x.trim()).filter(Boolean).map(nm=>{let t=S.testers.find(x=>x.name===nm);if(!t){t={id:uid(),name:nm,email:"",country:"",dept:""};S.testers.push(t);newTesters++;}return t.id;});
    let c=byKey.get(key);
    if(c){ updated++; if(o.dom)c.domain=o.dom; if(steps.length)c.steps=steps; c.devops=devops; c.defaultTesterIds=c.defaultTesterIds||[]; tIds.forEach(id=>{if(!c.defaultTesterIds.includes(id))c.defaultTesterIds.push(id);}); }
    else { S.library.push({id:uid(),order:++maxO,domain:o.dom,process,scenario,defaultTesterIds:tIds,notes:"",prereq:"",steps,txnRef:false,devops}); byKey.set(key,1); added++; } });
  let n=0; sortedLib(S.library).forEach(c=>c.order=++n);
  save(); go("library");
  alert(`Import step-level (sheet "${sn}"): ${added} new, ${updated} updated · ${groups.size} scénario(s), ${newTesters} tester(s) créé(s). Library total: ${S.library.length}.`);
}

/* =========================================================================
   CALENDAR — monthly grid of executions by due date (testDate)
   ========================================================================= */
let calYM=null; // {y, m} — m is 0-based; null => derive from data

const CAL_MONTHS=["January","February","March","April","May","June","July","August","September","October","November","December"];
/* Parse a free-text testDate into {y,m,d} or null. Handles DD/MM/YYYY, ISO YYYY-MM-DD,
   optional AM/PM/time suffix. Non-dates (W24, TBD, …) return null -> Unscheduled bucket. */
function parseTestDate(s){
  s=String(s==null?"":s).trim(); if(!s) return null;
  let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); // ISO
  if(m){ const y=+m[1],mo=+m[2]-1,d=+m[3]; if(mo>=0&&mo<12&&d>=1&&d<=31) return {y,m:mo,d}; return null; }
  m=s.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/); // DD/MM/YYYY or DD.MM.YYYY
  if(m){ let d=+m[1],mo=+m[2]-1,y=+m[3]; if(y<100)y+=2000; if(mo>=0&&mo<12&&d>=1&&d<=31) return {y,m:mo,d}; return null; }
  return null;

function calKey(p){ return p.y+"-"+String(p.m+1).padStart(2,"0")+"-"+String(p.d).padStart(2,"0"); }
/* AM / PM half of a free-text testDate: explicit AM/PM token, else inferred from a HH:MM time, else "" */
function dateHalf(s){ s=String(s||"");
  if(/\bPM\b/i.test(s)||/après|aprem|afternoon|tarde/i.test(s)) return "PM";
  if(/\bAM\b/i.test(s)||/matin|morning|mañana/i.test(s)) return "AM";
  const t=s.match(/\b([01]?\d|2[0-3]):([0-5]\d)\b/); if(t) return (+t[1])<12?"AM":"PM";
  return ""; }
function calBuckets(){
  // returns {byDay:{ "YYYY-MM-DD": [execs] }, unscheduled:[{label,execs}], months:Set("y-m") }
  const byDay={}, uns={}, months={};
  viewExecs().forEach(e=>{ const p=parseTestDate(e.testDate);
    if(p){ const k=calKey(p); (byDay[k]=byDay[k]||[]).push(e); months[p.y+"-"+p.m]=true; }
    else { const lbl=(e.testDate||"").trim()||"(no date)"; (uns[lbl]=uns[lbl]||[]).push(e); } });
  return {byDay,uns,months};
}

    const pm={}; zex.forEach(e=>{ const p=e.process||"(none)"; const o=pm[p]||(pm[p]={steps:0,ex:[]}); o.steps+=(e.steps||[]).length; o.ex.push(e); });
    const procs=Object.keys(pm).sort((x,y)=>naturalKey(x).localeCompare(naturalKey(y)));

      +`<div class="calhalflbl" onclick="event.stopPropagation();openCalDayHalf('${k}','${half}')">${label}${zex.length?` <span class="calhalfn">${zex.length}</span>`:''}</div>`
      +chipsFor(zex,k,half)+`</div>`; };
  for(let d=1;d<=daysIn;d++){
    const k=calKey({y,m,d}); const ex=b.byDay[k]||[];
    const cls="calcell"+(ex.length?" has":"")+(k===todayK?" today":"");
    const byHalf={AM:[],PM:[],"":[]}; ex.forEach(e=>{ (byHalf[dateHalf(e.testDate)]=byHalf[dateHalf(e.testDate)]||[]).push(e); });
    cells+=`<div class="${cls}" data-k="${k}">`
      +`<div class="caldate"${ex.length?` onclick="openCalDay('${k}')" title="Open the whole day"`:''}>${d}${ex.length?` <span class="calcnt">${ex.length}</span>`:""}</div>`
      +(ex.length?`${zone(k,byHalf,"AM","AM")}${zone(k,byHalf,"PM","PM")}${byHalf[""].length?zone(k,byHalf,"","—"):""}<div class="calprocbar caldaybar">${progressBar(ex)}</div>`:"")
      +`</div>`;
  }

/* iterations */
function newIter(){ const name=prompt("Iteration name:","UAT "+(S.iterations.length+1)); if(!name)return;
  const it={id:uid(),name,startDate:"",endDate:""}; S.iterations.push(it); S.activeIterationId=it.id; S.viewIterIds=[it.id]; renderAll(); save(); }
function editIter(id){ const it=S.iterations.find(x=>x.id===id);
  modal(`<h2>Edit iteration</h2><div class="field"><label>Name</label><input id="it_name" value="${esc(it.name)}"/></div>

    <div class="toolbar" style="margin-top:14px"><div class="spacer"></div><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveIter('${id}')">Save</button></div>`); }
function saveIter(id){ const it=S.iterations.find(x=>x.id===id); it.name=$("#it_name").value;it.startDate=$("#it_start").value;it.endDate=$("#it_end").value; closeModal(); renderAll(); save(); }
function delIter(id){ if(!confirm("Delete this iteration and its executions?"))return; S.iterations=S.iterations.filter(x=>x.id!==id); S.executions=S.executions.filter(e=>e.iterationId!==id); if(S.activeIterationId===id)S.activeIterationId=S.iterations[0].id; S.viewIterIds=(S.viewIterIds||[]).filter(x=>x!==id&&S.iterations.some(i=>i.id===x)); if(!S.viewIterIds.length)S.viewIterIds=[S.activeIterationId]; renderAll(); save(); }
function carryOver(){ const from=activeIter(); const name=prompt("New iteration name:","UAT "+(S.iterations.length+1)); if(!name)return;
  const it={id:uid(),name,startDate:"",endDate:""}; S.iterations.push(it);
  const src=S.executions.filter(e=>e.iterationId===from.id&&["Failed","Blocked","Not started"].includes(e.status));
  src.forEach(e=>S.executions.push({...e,id:uid(),iterationId:it.id,status:"Not started",comment:"",testDate:"",txnRefValue:"",failedSteps:{},screens:[],updatedAt:new Date().toISOString()}));
  S.activeIterationId=it.id; S.viewIterIds=[it.id]; renderAll(); save(); alert(src.length+" test(s) carried over to "+name+"."); }

function exportTxnRefs(){

    return {PRC:e.process||"",Scenario:e.scenario||"",Entity:e.entity||"",Tester:t.name||"",Status:e.status||"",TransactionRef:e.txnRefValue||"",DueDate:e.testDate||"",UpdatedAt:e.updatedAt||""};});

/* Export the iteration's tests grouped by process (summary sheet + detail sheet) */
function exportByProcess(){
  const ex=trkFiltered();
  if(!ex.length){ alert("No execution to export (check the tracking filters)."); return; }
  const sorted=ex.slice().sort((a,b)=>naturalKey((a.process||"")+" "+(a.scenario||"")).localeCompare(naturalKey((b.process||"")+" "+(b.scenario||""))));
  const detail=sorted.map(e=>{const t=tester(e.testerId)||{};
    return {PRC:e.process||"",Scenario:e.scenario||"",Domain:e.domain||"",Entity:e.entity||"",Tester:t.name||"",Status:e.status||"",DueDate:e.testDate||"",BusinessComment:e.comment||"",Recurrence:e.recurrence||""};});
  const byP={}; ex.forEach(e=>{ const p=e.process||"(none)"; (byP[p]=byP[p]||[]).push(e); });
  const summary=Object.keys(byP).sort((a,b)=>naturalKey(a).localeCompare(naturalKey(b))).map(p=>{ const list=byP[p]; const a=aggregate(list);
    return {PRC:p, Scenarios:new Set(list.map(e=>e.scenario)).size, Executions:list.length, Assigned:list.filter(e=>e.testerId).length,
      Passed:a.passed, Failed:a.failed, Blocked:a.blocked, NA:a.byStatus["N/A"]||0, ToDo:a.notrun, PctDone:(a.total?Math.round(a.done/a.total*100):0)+"%",
      Entities:[...new Set(list.map(e=>e.entity).filter(Boolean))].sort().join(", "),
      Testers:[...new Set(list.map(e=>testerName(e.testerId)).filter(Boolean))].sort().join(", "),
      Dates:[...new Set(list.map(e=>e.testDate).filter(Boolean))].sort().join(", ")};});
  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(summary.length?summary:[{Info:"No execution"}]),"By process");
  XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(detail.length?detail:[{Info:"No execution"}]),"Detail");
  const scope=trkFilter.entity||"all"; const dt=new Date().toISOString().slice(0,10);
  XLSX.writeFile(wb,`MCEU_tests_by_process_${slug(activeIter().name)}_${scope}_${dt}.xlsx`);
}

  txnRef:(e.txnRef!=null?!!e.txnRef:!!((libById(e.libraryItemId)||{}).txnRef)),txnRefValue:e.txnRefValue||"",
  failedSteps:e.failedSteps||{},screens:e.screens||[],

    .sort((a,b)=>naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario))).map(execToTest);
  if(!tests.length){ alert("No test assigned to this tester for this iteration/entity."); return; }
  download(`UAT_${slug(iter.name)}_${slug(t.name)}.html`, buildTesterHTML(basePayload(iter,[{id:testerId,name:t.name,tests}])), "text/html");

</style></head><body>
<header><h1 id="sheetTitle">UAT Test Sheet</h1><span class="muted" id="hdr"></span><select id="langSel" onchange="setLang(this.value)" style="margin-left:auto;width:auto"><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option></select><button id="btnSaveTop" onclick="saveJSON()" style="padding:6px 12px"></button></header>
<main>
  <div class="whoami" id="whoamiBar"><label class="muted" id="lblWho" for="whoami"></label><div class="wcombo"><input id="whoami" autocomplete="off"/><div class="wlist" id="whoamiList"></div></div></div>

  <table id="tbl"><thead><tr><th id="thPRC" class="sortable" onclick="sortBy('process')"></th><th id="thScn"></th><th id="thEnt"></th><th id="thSt" style="width:140px"></th><th id="thDue" class="sortable" style="width:160px" onclick="sortBy('testDate')"></th><th id="thCom"></th></tr></thead><tbody id="tb"></tbody></table>

    <div class="tcalgrid" id="tcalGrid"></div>

</main>
<div class="bar"><button id="btnSave" onclick="saveJSON()"></button><span class="saved" id="savedMsg"></span><span class="muted" style="margin-left:auto" id="prog"></span></div>
<script>
const DATA=${dataJson};
let curId="", rows=[], adhoc=[], expanded=new Set(), sortField="", sortDir=0;
let tcalYM=null, tcalOn=false;
const I18N={

   cNoCom:"{n} prueba(s) Failed/Blocked sin comentario. ¿Guardar de todos modos?",cNoTxn:"{n} prueba(s) ejecutada(s) requieren una referencia de transacción aún vacía. ¿Guardar de todos modos?",

};
let lang=(function(){try{return localStorage.getItem("mceu_tester_lang")||"fr";}catch(e){return "fr";}})();
function T(k,n){let v=(I18N[lang]||I18N.fr)[k]||k; return n==null?v:v.replace("{n}",n);}
function setLang(l){ lang=l; try{localStorage.setItem("mceu_tester_lang",l);}catch(e){} applyLang(); buildLinks(); buildProcFilter(); render(); if(tcalOn)tcalRender(); }
function applyLang(){
  document.getElementById("sheetTitle").textContent=T("title");
  document.getElementById("lblWho").textContent=T("selectName");
  const wi=document.getElementById("whoami"); if(wi) wi.placeholder=T("namePh");
  document.getElementById("intro").innerHTML=T("intro");
  document.getElementById("lblProc").textContent=T("proc");
  document.getElementById("btnAdhoc").textContent=T("addAdhoc");
  document.getElementById("btnSave").textContent=T("save");
  document.getElementById("btnSaveTop").textContent=T("save");
  document.getElementById("thPRC").innerHTML=T("hPRC")+' <span id="arP"></span>';
  document.getElementById("thScn").textContent=T("hScn");
  document.getElementById("thEnt").textContent=T("hEnt");
  document.getElementById("thSt").textContent=T("hSt");
  document.getElementById("thDue").innerHTML=T("hDue")+' <span id="arD"></span>';
  document.getElementById("thCom").textContent=T("hCom");
  const ls=document.getElementById("langSel"); if(ls) ls.value=lang;
  var bl=document.getElementById("btnViewList"); if(bl) bl.textContent=T("vList");
  var bc=document.getElementById("btnViewCal"); if(bc) bc.textContent=T("vCal");
  var bt=document.getElementById("tcalToday"); if(bt) bt.textContent=T("calToday");
}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function stepTxt(s){return typeof s==="string"?s:((s&&s.t)||"");}
function stepTagsHtml(s){var h="";if(s&&s.stream)h+=' <span class="steptag">'+esc(s.stream)+'</span>';if(s&&s.app)h+=' <span class="steptag app">'+esc(s.app)+'</span>';return h;}
function nat(s){return String(s||"").toLowerCase().replace(/\\d+/g,m=>m.padStart(10,"0"));}
function lsk(id){return "mceu_tester_"+DATA.iterationId+"_"+id;}
function reqComment(st){const m=DATA.statuses.find(s=>s.value===st);return m&&m.requiresComment;}
function buildLinks(){const L=(DATA.links||[]).filter(x=>x&&(x.label||x.url));const el=document.getElementById("links");
  if(!L.length){el.style.display="none";return;}
  el.innerHTML="<b>"+esc(T("links"))+"</b> "+L.map(x=>x.url?('<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.label||x.url)+'</a>'):esc(x.label||"")).filter(Boolean).join(" &nbsp;·&nbsp; ");}
function buildWho(){ if(DATA.testers.length<=1){ document.getElementById("whoamiBar").style.display="none"; return; }
  const inp=document.getElementById("whoami");
  inp.addEventListener("focus",()=>paintWho(""));
  inp.addEventListener("input",()=>paintWho(inp.value));
  inp.addEventListener("blur",()=>setTimeout(()=>{document.getElementById("whoamiList").style.display="none";},150));}
function paintWho(q){ q=(q||"").toLowerCase().trim();
  const box=document.getElementById("whoamiList");
  const list=DATA.testers.filter(t=>!q||t.name.toLowerCase().includes(q));
  box.innerHTML=list.map(x=>'<div class="wopt" data-id="'+esc(x.id)+'">'+esc(x.name)+' <span class="muted">('+x.tests.length+')</span></div>').join("")||'<div class="wopt muted">'+esc(T("noRes"))+'</div>';
  box.style.display="block";
  box.querySelectorAll(".wopt[data-id]").forEach(el=>el.addEventListener("mousedown",()=>{ const id=el.dataset.id; const t=DATA.testers.find(x=>x.id===id); document.getElementById("whoami").value=t?t.name:""; box.style.display="none"; loadTester(id); }));}
function buildProcFilter(){const procs=[...new Set(rows.map(t=>t.process).filter(Boolean))].sort();
  const fb=document.getElementById("filterBar"), pf=document.getElementById("procFilter");
  if(procs.length>1){ pf.innerHTML='<option value="">'+esc(T("allProc",procs.length))+'</option>'+procs.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join(""); fb.style.display="flex"; }
  else { pf.innerHTML='<option value="">'+esc(T("allShort"))+'</option>'; fb.style.display="none"; }}
function loadTester(id){ curId=id; const tt=DATA.testers.find(x=>x.id===id); const hdr=document.getElementById("hdr");
  if(!tt){ rows=[];adhoc=[]; hdr.textContent=DATA.campaign+" · "+DATA.iteration; buildProcFilter(); render(); return; }
  hdr.textContent=DATA.campaign+" · "+DATA.iteration+" · "+tt.name;
  const saved=JSON.parse(localStorage.getItem(lsk(id))||"null");
  rows=tt.tests.map(t=>{const s=saved&&saved.results&&saved.results.find(r=>r.id===t.id);
    return Object.assign({},t,{status:s?s.status:t.status,comment:s?s.comment:t.comment,txnRefValue:(s&&s.txnRefValue)||t.txnRefValue||"",failedSteps:(s&&s.failedSteps)||t.failedSteps||{},screens:(s&&s.screens)||t.screens||[]});});
  adhoc=(saved&&saved.adhoc)||[];
  buildProcFilter(); render(); if(tcalOn)tcalRender(); }
function sk(t){ return sortField==="process"?nat((t.process||"")+" "+(t.scenario||"")):(t.testDate||""); }
function sortBy(f){ if(sortField===f){ sortDir=sortDir===1?-1:0; if(!sortDir)sortField=""; } else { sortField=f; sortDir=1; } render(); }
function toggleSteps(id){ if(expanded.has(id))expanded.delete(id); else expanded.add(id); render(); }
function render(){
  const tb=document.getElementById("tb"); tb.innerHTML="";
  const pf=document.getElementById("procFilter"); const f=pf?pf.value:"";
  let shown=0; const list=[];
  rows.forEach((t,i)=>{ if(!f||t.process===f){ list.push({t,i,isAd:false}); shown++; } });
  adhoc.forEach((t,i)=>list.push({t,i,isAd:true}));
  if(sortField){ const df=sortField==="testDate"; list.sort((a,b)=>{ let ka=sk(a.t),kb=sk(b.t);
    if(df){ if(!ka&&!kb)return 0; if(!ka)return 1; if(!kb)return -1; }
    return ka<kb?-sortDir:ka>kb?sortDir:0; }); }
  list.forEach(it=>{ tb.appendChild(rowEl(it.t,it.i,it.isAd));
    if(!it.isAd && it.t.steps && it.t.steps.length && expanded.has(it.t.id)) tb.appendChild(stepRowEl(it.t));
    if(reqComment(it.t.status)) tb.appendChild(issueRowEl(it.t,it.isAd)); });
  document.getElementById("arP").textContent=sortField==="process"?(sortDir===1?"▲":"▼"):"";
  document.getElementById("arD").textContent=sortField==="testDate"?(sortDir===1?"▲":"▼"):"";
  const sc=document.getElementById("shownCount"); if(sc) sc.textContent=f?(shown+" / "+rows.length+" "+T("shown")):"";
  updateProg();
}
function rowEl(t,i,isAd){
  const tr=document.createElement("tr");
  const opts=DATA.statuses.map(s=>'<option '+(s.value===t.status?'selected':'')+'>'+s.value+'</option>').join("");
  const entOpts=DATA.entities.map(e=>'<option '+(e===t.entity?'selected':'')+'>'+e+'</option>').join("");
  const nSteps=(!isAd && t.steps)?t.steps.length:0;
  const stepTog=nSteps?' <span class="stepToggle">'+(expanded.has(t.id)?'▾':'▸')+' '+T("stepsN",nSteps)+'</span>':'';
  const needTxn=(!isAd && t.txnRef && t.status && t.status!=="Not started" && !((t.txnRefValue||"").trim()));
  const txnBlock=(!isAd && t.txnRef)?'<div class="txnlbl">'+esc(T("txnRef"))+' <span class="reftag">'+esc(T("required"))+'</span></div><input data-k="txnRefValue" class="txnin'+(needTxn?' req':'')+'" value="'+esc(t.txnRefValue||"")+'" placeholder="'+esc(T("txnPh"))+'"/>':'';
  tr.innerHTML='<td>'+(isAd?'<input value="'+esc(t.process||"")+'" data-k="process" style="width:120px"/> <span class="badge">ad-hoc</span>':esc(t.process))+'</td>'+
    '<td>'+(isAd?'<input value="'+esc(t.scenario||"")+'" data-k="scenario" style="width:100%"/>':(esc(t.scenario)+stepTog+txnBlock+((!isAd&&t.prereq)?'<div class="prereqbox">🧪 '+esc(T("prereqLabel"))+' : '+esc(t.prereq)+'</div>':'')))+'</td>'+
    '<td>'+(isAd?'<select data-k="entity">'+entOpts+'</select>':('<span class="badge">'+esc(t.entity||"")+'</span>'))+'</td>'+
    '<td><select data-k="status">'+opts+'</select></td>'+
    '<td class="duedate">'+(t.testDate?esc(t.testDate):'<span class="muted">—</span>')+'</td>'+
    '<td><textarea data-k="comment" placeholder="'+(reqComment(t.status)?esc(T("cReq")):esc(T("cOpt")))+'">'+esc(t.comment||"")+'</textarea></td>';
  const arr=isAd?adhoc:rows;
  const tgl=tr.querySelector(".stepToggle"); if(tgl) tgl.addEventListener("click",()=>toggleSteps(t.id));
  tr.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("input",()=>{ arr[i][el.dataset.k]=el.value;
    if(el.dataset.k==="status"){ autosave(); render(); return; }
    autosave(); updateProg(); }));
  return tr;
}
function stepRowEl(t){ const tr=document.createElement("tr"); tr.className="steprow";
  tr.innerHTML='<td></td><td colspan="5"><div class="muted" style="font-size:12px;margin-bottom:2px">'+esc(T("stepsFollow"))+'</div><ol class="steps">'+t.steps.map(s=>'<li>'+esc(stepTxt(s))+stepTagsHtml(s)+'</li>').join("")+'</ol></td>';
  return tr; }
function issueRowEl(t,isAd){ const tr=document.createElement("tr"); tr.className="steprow";
  t.failedSteps=t.failedSteps||{}; t.screens=t.screens||[];
  const steps=(!isAd && t.steps)?t.steps:[];
  const stepsHtml=steps.length?('<div class="muted" style="font-size:12px;margin:2px 0">'+esc(T("tickSteps"))+'</div>'+steps.map((s,si)=>'<label class="tpick2"><input type="checkbox" class="fchk" data-si="'+si+'" '+(t.failedSteps[si]?'checked':'')+'/> '+esc(stepTxt(s))+stepTagsHtml(s)+'</label>').join("")):'<div class="muted" style="font-size:12px">'+esc(T("noSteps"))+'</div>';
  const shots=t.screens.map((sc,si)=>'<span class="shot"><img src="'+sc.data+'" alt=""/><button class="rmshot" data-si="'+si+'" title="'+esc(T("remove"))+'">✕</button></span>').join("");
  tr.innerHTML='<td></td><td colspan="5"><div class="issuebox">'+stepsHtml+
    '<div class="muted" style="font-size:12px;margin:8px 0 2px">'+esc(T("evidence"))+'</div>'+
    '<div class="dropz">'+esc(T("dropHere"))+'</div>'+
    '<input type="file" accept="image/*" multiple class="shotin" style="display:none"/>'+
    '<div class="shots">'+shots+'</div></div></td>';
  tr.querySelectorAll(".fchk").forEach(el=>el.addEventListener("change",()=>{ if(el.checked)t.failedSteps[el.dataset.si]=true; else delete t.failedSteps[el.dataset.si]; autosave(); }));
  const dz=tr.querySelector(".dropz"), fin=tr.querySelector(".shotin");
  dz.addEventListener("click",()=>fin.click());
  dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
  dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
  dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");addShots(t,e.dataTransfer.files);});
  fin.addEventListener("change",()=>addShots(t,fin.files));
  tr.querySelectorAll(".rmshot").forEach(el=>el.addEventListener("click",()=>{ t.screens.splice(parseInt(el.dataset.si),1); autosave(); render(); }));
  return tr;
}
function addShots(t,files){ t.screens=t.screens||[];
  [].slice.call(files).filter(f=>f.type&&f.type.indexOf("image/")===0).forEach(f=>{ const r=new FileReader();
    r.onload=function(){ const img=new Image();
      img.onload=function(){ const max=1280; let w=img.width,h=img.height;
        if(w>max||h>max){ const k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k); }
        let data; try{ const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); data=cv.toDataURL("image/jpeg",0.7); }catch(e){ data=r.result; }
        t.screens.push({name:f.name,data:data}); autosave(); render(); };
      img.onerror=function(){ t.screens.push({name:f.name,data:r.result}); autosave(); render(); };
      img.src=r.result; };
    r.readAsDataURL(f); }); }
function addAdhoc(){ if(!curId){alert("Sélectionne d'abord ton nom.");return;} adhoc.push({process:"",scenario:"",entity:DATA.entities[0]||"",status:DATA.statuses[0].value,comment:"",testDate:""}); render(); }
function updateProg(){ const done=rows.filter(r=>r.status&&r.status!=="Not started").length; document.getElementById("prog").textContent=curId?(done+" / "+rows.length+" faits"):""; }
function payloadOut(){ const tt=DATA.testers.find(x=>x.id===curId)||{};
  return {_type:"MCEU_TESTER_RESULTS",iterationId:DATA.iterationId,testerId:curId,testerName:tt.name||"",
    results:rows.map(r=>({id:r.id,status:r.status,comment:r.comment,testDate:r.testDate,txnRefValue:r.txnRefValue||"",failedSteps:r.failedSteps||{},screens:r.screens||[]})),
    adhoc:adhoc.filter(a=>a.process||a.scenario).map(a=>({process:a.process,scenario:a.scenario,entity:a.entity,status:a.status,comment:a.comment,testDate:a.testDate||""}))};}
function autosave(){ if(!curId)return; try{ localStorage.setItem(lsk(curId),JSON.stringify(payloadOut())); const m=document.getElementById("savedMsg"); m.textContent=T("saved"); setTimeout(()=>{m.textContent="";},1500);}catch(e){ const m=document.getElementById("savedMsg"); m.textContent=T("full"); } }
function saveJSON(){ if(!curId){alert(T("pickFirst"));return;}
  const bad=rows.concat(adhoc).filter(r=>reqComment(r.status)&&!(r.comment||"").trim());
  if(bad.length && !confirm(T("cNoCom",bad.length)))return;
  const miss=rows.filter(r=>r.txnRef&&r.status&&r.status!=="Not started"&&!((r.txnRefValue||"").trim())).length;
  if(miss && !confirm(T("cNoTxn",miss)))return;
  const tt=DATA.testers.find(x=>x.id===curId)||{name:"tester"};
  const b=new Blob([JSON.stringify(payloadOut(),null,2)],{type:"application/json"});

/* ---- read-only calendar view (tester) ---- */
var TCAL_M=["January","February","March","April","May","June","July","August","September","October","November","December"];
function tparse(s){ s=String(s==null?"":s).trim(); if(!s)return null;
  var m=s.match(/^(\\d{4})-(\\d{1,2})-(\\d{1,2})/); if(m){var y=+m[1],mo=+m[2]-1,d=+m[3]; if(mo>=0&&mo<12&&d>=1&&d<=31)return{y:y,m:mo,d:d}; return null;}
  m=s.match(/^(\\d{1,2})[\\/.](\\d{1,2})[\\/.](\\d{2,4})/); if(m){var d=+m[1],mo=+m[2]-1,y=+m[3]; if(y<100)y+=2000; if(mo>=0&&mo<12&&d>=1&&d<=31)return{y:y,m:mo,d:d}; return null;} return null;}
function tkey(p){ return p.y+"-"+String(p.m+1).padStart(2,"0")+"-"+String(p.d).padStart(2,"0"); }
function tstColor(st){ var m={Passed:"#22c55e",Failed:"#ef4444",Blocked:"#f59e0b","In progress":"#a855f7","N/A":"#64748b"}; return m[st]||"#475569"; }
function thalf(s){ s=String(s||"");
  if(/\\bPM\\b/i.test(s)||/après|aprem|afternoon|tarde/i.test(s))return "PM";
  if(/\\bAM\\b/i.test(s)||/matin|morning|mañana/i.test(s))return "AM";
  var t=s.match(/\\b([01]?\\d|2[0-3]):([0-5]\\d)\\b/); if(t)return (+t[1])<12?"AM":"PM";
  return ""; }
function tcalBuckets(){ var byDay={},uns={},months={}; var all=rows.concat(adhoc||[]);
  all.forEach(function(t){ var p=tparse(t.testDate);
    if(p){ var k=tkey(p); (byDay[k]=byDay[k]||[]).push(t); months[p.y+"-"+p.m]=true; }
    else { var lbl=(t.testDate||"").trim()||"—"; (uns[lbl]=uns[lbl]||[]).push(t); } });
  return {byDay:byDay,uns:uns,months:months}; }
function tcalRender(){ var b=tcalBuckets();
  if(!tcalYM){ var ms=Object.keys(b.months).map(function(k){return k.split("-").map(Number);}).sort(function(a,x){return a[0]-x[0]||a[1]-x[1];});
    if(ms.length)tcalYM={y:ms[0][0],m:ms[0][1]}; else { var n=new Date(); tcalYM={y:n.getFullYear(),m:n.getMonth()}; } }
  var y=tcalYM.y,m=tcalYM.m;
  var first=new Date(y,m,1); var startDow=(first.getDay()+6)%7; var daysIn=new Date(y,m+1,0).getDate();
  var nn=new Date(); var todayK=tkey({y:nn.getFullYear(),m:nn.getMonth(),d:nn.getDate()});
  var dows=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  var cells=dows.map(function(d){return '<div class="tcaldow">'+d+'</div>';}).join("");
  var i; for(i=0;i<startDow;i++) cells+='<div class="tcalcell empty"></div>';
  var d; for(d=1;d<=daysIn;d++){ var k=tkey({y:y,m:m,d:d}); var ex=b.byDay[k]||[];
    var inner='<div class="tcaldate">'+d+'</div>';
    if(ex.length){ inner+='<div class="tcalcnt">'+ex.length+' test'+(ex.length>1?'s':'')+'</div>';
      var bh={AM:[],PM:[],"":[]}; ex.forEach(function(t){ (bh[thalf(t.testDate)]=bh[thalf(t.testDate)]||[]).push(t); });
      ["AM","PM",""].forEach(function(hf){ var arr=bh[hf]||[]; if(!arr.length)return;
        var hc=hf==="AM"?" am":hf==="PM"?" pm":" none";
        inner+='<div class="tcalhalf'+hc+'"><span class="tcalhalflbl">'+(hf||"—")+'</span>'
          + arr.map(function(t){ return '<div class="tcalitem" title="'+esc((t.process||"")+" — "+(t.scenario||""))+'"><span class="tdot" style="background:'+tstColor(t.status)+'"></span>'+esc(t.process||t.scenario||"")+'</div>'; }).join("")
          + '</div>'; }); }
    cells+='<div class="tcalcell'+(ex.length?" has":"")+(k===todayK?" today":"")+'">'+inner+'</div>'; }
  document.getElementById("tcalGrid").innerHTML=cells;
  document.getElementById("tcalMonth").textContent=TCAL_M[m]+" "+y;
  var unsKeys=Object.keys(b.uns).sort();
  document.getElementById("tcalUns").innerHTML=unsKeys.length?('<div class="tcaluns"><b>'+esc(T("calUns"))+'</b> '+unsKeys.map(function(l){return esc(l)+" ("+b.uns[l].length+")";}).join(" · ")+'</div>'):''; }
function tcalNav(delta){ if(!tcalYM)tcalRender(); var m=tcalYM.m+delta,y=tcalYM.y; while(m<0){m+=12;y--;} while(m>11){m-=12;y++;} tcalYM={y:y,m:m}; tcalRender(); }
function tcalToday(){ var n=new Date(); tcalYM={y:n.getFullYear(),m:n.getMonth()}; tcalRender(); }
function setView(v){ tcalOn=(v==="cal");
  document.getElementById("tblWrap").style.display=tcalOn?"none":"block";
  document.getElementById("calWrap").style.display=tcalOn?"block":"none";
  document.getElementById("btnViewList").className=tcalOn?"sec":"";
  document.getElementById("btnViewCal").className=tcalOn?"":"sec";
  if(tcalOn)tcalRender(); }
function init(){ applyLang(); buildLinks(); buildWho();
  if(DATA.testers.length===1){ const inp=document.getElementById("whoami"); if(inp)inp.value=DATA.testers[0].name; loadTester(DATA.testers[0].id); }
  else { render(); }

init();
<\/script></body></html>`;

function importTesterResults(input){
  const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=e=>{ try{ const p=JSON.parse(e.target.result); if(p._type!=="MCEU_TESTER_RESULTS"){alert("Not a tester results file.");return;}
    let upd=0,add=0;
    (p.results||[]).forEach(res=>{ const ex=S.executions.find(x=>x.id===res.id);
      if(ex){ ex.status=res.status; ex.comment=res.comment||""; ex.testDate=res.testDate||ex.testDate; if(res.txnRefValue!=null)ex.txnRefValue=res.txnRefValue; if(res.failedSteps)ex.failedSteps=res.failedSteps; if(res.screens)ex.screens=res.screens; delete ex.resultBy; delete ex.resultAt; ex.updatedAt=new Date().toISOString(); upd++; } });
    (p.adhoc||[]).forEach(a=>{ S.executions.push({id:uid(),iterationId:p.iterationId,libraryItemId:null,process:a.process||"(ad-hoc)",scenario:a.scenario||"",domain:"",
      entity:a.entity||"",testerId:p.testerId,status:a.status||"Not started",comment:a.comment||"",recurrence:"",testDate:a.testDate||"",adhoc:true,updatedAt:new Date().toISOString()}); add++; });
    renderAll(); save(); alert(`Results merged for ${esc(p.testerName||"tester")}: ${upd} updated, ${add} ad-hoc added.`);
  }catch(err){ alert("Invalid file."); } };
  r.readAsText(f);
}

/* =========================================================================
   IMPORT / EXPORT
   ========================================================================= */
function download(name,content,type){ const b=new Blob([content],{type:type||"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportJSON(){ S.meta=S.meta||{}; S.meta.lastBackup=new Date().toISOString(); save();
  download(`MCEU_UAT_backup_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,2)); }
function importJSON(input){ const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=e=>{ try{ S=migrate(JSON.parse(e.target.result)); renderAll(); save(); alert("Backup restored."); }catch(err){ alert("Invalid file."); } }; r.readAsText(f); }
function exportReport(){
  const data=S.executions.map(e=>{const it=S.iterations.find(i=>i.id===e.iterationId)||{};const t=tester(e.testerId)||{};
    const fs=e.failedSteps||{};const steps=e.steps||[];
    const failed=Object.keys(fs).filter(k=>fs[k]).map(k=>steps[k]||("step "+(parseInt(k)+1))).join(" ; ");
    return {Iteration:it.name||"",PRC:e.process||"",Scenario:e.scenario||"",Domain:e.domain||"",Entity:e.entity,
      Tester:t.name||"",TesterCountry:t.country||"",Status:e.status,Recurrence:e.recurrence||"",TestDate:e.testDate||"",
      BusinessComment:e.comment||"",TransactionRef:e.txnRefValue||"",Prereq:e.prereq||(libById(e.libraryItemId)||{}).prereq||"",FailedSteps:failed,Screenshots:(e.screens||[]).length||"",AdHoc:e.adhoc?"yes":""};});
  const ws=XLSX.utils.json_to_sheet(data.length?data:[{Info:"No execution"}]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"UAT Report");
  XLSX.writeFile(wb,`MCEU_UAT_report_${new Date().toISOString().slice(0,10)}.xlsx`);
}
/* Export the Library (PRC × Scenario definitions) to .xlsx using the same
   column headers as the DevOps import — so added PRCs round-trip back in. */
function exportLibrary(){
  const m=S.config.columnMapping;
  const rows=S.library.slice().sort((a,b)=>(a.order||0)-(b.order||0)||naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario))).map(c=>{
    const r={};
    r[m.domain]=c.domain||""; r[m.process]=c.process||""; r[m.scenario]=c.scenario||"";
    r[m.tester]=libTesterIds(c).map(id=>{const t=tester(id);return t?t.name:null;}).filter(Boolean).join("; ");
    r.Steps=(c.steps||[]).map(stepText).join("\n"); r.TxnRef=c.txnRef?"yes":""; r.Order=c.order||0; r.Notes=c.notes||""; r.Prereq=c.prereq||"";
    return r; });
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{[m.process]:"",[m.scenario]:""}]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"LUX");
  XLSX.writeFile(wb,`MCEU_UAT_library_${new Date().toISOString().slice(0,10)}.xlsx`);
}
