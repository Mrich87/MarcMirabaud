<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCEU — UAT Campaign Manager</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --ok:#22c55e; --fail:#ef4444; --block:#f59e0b; --na:#64748b; --prog:#a855f7;
    --chip:#0b1220;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  header{background:linear-gradient(90deg,#0b1220,#16233b);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .brand{color:var(--accent)}
  .iter-pill{margin-left:auto;display:flex;align-items:center;gap:8px}
  select,input,textarea{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
  textarea{width:100%;min-height:60px;resize:vertical}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:#06283b;font-weight:600}
  button.primary:hover{background:var(--accent)}
  button.danger{border-color:var(--fail);color:#fca5a5}
  button.sm{padding:3px 8px;font-size:12px}
  nav{display:flex;gap:4px;background:#0b1220;padding:6px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 14px;color:var(--muted)}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
  main{padding:18px;max-width:1500px;margin:0 auto}
  .view{display:none}
  .view.active{display:block}
  h2{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  .grid{display:grid;gap:12px}
  .cards{display:flex;gap:12px;flex-wrap:wrap}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:130px;flex:1}
  .kpi .n{font-size:26px;font-weight:700}
  .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);cursor:pointer;user-select:none}
  tr:hover td{background:rgba(255,255,255,.02)}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar .spacer{flex:1}
  .pbar{height:10px;background:#0b1220;border-radius:6px;overflow:hidden;display:flex;min-width:120px}
  .pbar span{display:block;height:100%}
  .muted{color:var(--muted)}
  .tag{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;margin:1px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted)}
  .scrollbox{max-height:600px;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .matrix td,.matrix th{text-align:center}
  .matrix td.proc{text-align:left}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:680px;width:92%;max-height:88vh;overflow:auto}
  .pill{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px}
  .req::after{content:" *";color:var(--fail)}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  details summary{cursor:pointer;color:var(--accent);font-size:12px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
  code{background:var(--chip);padding:1px 5px;border-radius:4px}
  .banner{background:#422006;border:1px solid var(--block);color:#fde68a;padding:10px 14px;border-radius:8px;margin-bottom:14px;display:none}
  .banner.show{display:block}
  .ord{display:flex;flex-direction:column;align-items:center;gap:2px}
  .ord button{padding:0 6px;line-height:1.4;font-size:11px}
  .ord input{width:48px;text-align:center;padding:2px}
  tr.tc-exec td{background:rgba(56,189,248,.04);border-bottom:1px dashed var(--line)}
  .exline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .exline .grow{flex:1;min-width:160px}
</style>
</head>
<body>
<header>
  <h1><span class="brand">MCEU</span> · UAT Campaign Manager <span id="appVer" class="muted" style="font-size:11px;font-weight:400"></span></h1>
  <div class="iter-pill">
    <span class="muted" style="font-size:12px">Active&nbsp;iteration</span>
    <select id="iterSelect" onchange="setActiveIteration(this.value)"></select>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <div id="packetBanner" class="banner"></div>
  <div id="view-dashboard" class="view"></div>
  <div id="view-tests" class="view"></div>
  <div id="view-assigned" class="view"></div>
  <div id="view-tracking" class="view"></div>
  <div id="view-iterations" class="view"></div>
  <div id="view-admin" class="view"></div>
  <div id="view-data" class="view"></div>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script>
/* =========================================================================
   MCEU UAT MANAGER — local single-file web app
   Model: Catalog (deduplicated test cases) + Executions (test case x entity
   x tester x iteration). The Tests tab merges catalog management and
   execution capture. Persistence: localStorage + xlsx/JSON import-export.
   ========================================================================= */

const LS_KEY = "mceu_uat_state_v1";
/* App version — bump APP_BUILD on every released change. Shown in the header and
   embedded in tester packets so a stale app can be detected. */
const APP_BUILD = 14;
const APP_VERSION = "2026-06-03 · build " + APP_BUILD;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

/* ---------- default state ---------- */
function defaultState(){
  const it1 = {id:uid(), name:"UAT 1", startDate:"", endDate:"", active:true, locked:false};
  return {
    version:2,
    config:{
      campaignName:"MCEU UAT Campaign",
      entities:[
        {code:"Lu", label:"Luxembourg",     color:"#38bdf8"},
        {code:"FR", label:"France",         color:"#a855f7"},
        {code:"SP", label:"Spain",          color:"#f59e0b"},
        {code:"UK", label:"United Kingdom",  color:"#22c55e"},
      ],
      departments:["Wealth Management","Operations","Compliance","Finance","Investment","Risk"],
      testers:[],
      statuses:[
        {value:"Not started", color:"#64748b", requiresComment:false},
        {value:"In progress", color:"#a855f7", requiresComment:false},
        {value:"Passed",      color:"#22c55e", requiresComment:false},
        {value:"Failed",      color:"#ef4444", requiresComment:true},
        {value:"Blocked",     color:"#f59e0b", requiresComment:true},
        {value:"N/A",         color:"#475569", requiresComment:false},
      ],
      recurrences:["Often","Rarely","Exceptionally"],
      // Business streams = the team that performs a step. The stream name is
      // usually written inside the test case text (e.g. "RM - Central File -
      // BRM - Compliance"), so each stream is matched by keyword(s).
      streamDetectField:"all",   // where to look for the stream: title | subProcess | variant | subVariant | bankArea | all
      businessStreams:[
        {name:"RM",           keywords:"RM, Relationship Manager", color:"#38bdf8"},
        {name:"Central File", keywords:"Central File, CF",         color:"#a855f7"},
        {name:"BRM",          keywords:"BRM",                      color:"#f59e0b"},
        {name:"Compliance",   keywords:"Compliance, AML, KYC",     color:"#22c55e"},
      ],
      // Simplified test plan rule — "standard" (implicit, can be dropped/absorbed)
      // vs "differentiating" (a business case / risk / stream / control worth keeping).
      // Differentiating always wins when both match. One keyword per line.
      standardKeywords:["fill KYC","fill mandatory information","mandatory information","create case","create a case","upload document","upload documents","complete mailing instruction","mailing instruction","attach document"],
      differentiatingKeywords:["trust","legal entity","natural person","individual","low risk","medium risk","high risk","PEP","true hit","false hit","world-check","world check","approval route","scoring","SICAM","SIX","Transact","TAP","FCM","US person","wet signature"],
      columnMapping:{
        testCaseId:"TestCaseId", title:"TitleLevel6", domain:"TitleLevel2",
        process:"TitleLevel3", subProcess:"TitleLevel4", variant:"TitleLevel5",
        subVariant:"TitleTC", application:"ProductApplication",
        bankArea:"Custom_BankArea", tester:"TesterName",
        devopsLink:"TestSuiteLink"
      }
    },
    iterations:[it1],
    activeIterationId:it1.id,
    catalog:[],
    executions:[],
    packet:null   // {scope:{testerId,entity,iterationId}} in tester mode
  };
}

let S = load();
function load(){
  try{ const r = localStorage.getItem(LS_KEY); if(r) return migrate(JSON.parse(r)); }catch(e){}
  return defaultState();
}
function migrate(s){ const d=defaultState();
  const cfg=Object.assign(d.config,s.config||{});
  cfg.columnMapping=Object.assign(d.config.columnMapping,(s.config||{}).columnMapping||{});
  return Object.assign(d,s,{config:cfg}); }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
function persist(){ save(); renderTab(currentTab); }

/* ---------- helpers ---------- */
const $ = sel => document.querySelector(sel);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const statusMeta = v => S.config.statuses.find(x=>x.value===v) || {value:v,color:"#64748b",requiresComment:false};
const entityMeta = c => S.config.entities.find(x=>x.code===c) || {code:c,label:c,color:"#64748b"};
const testerName = id => { const t=S.config.testers.find(x=>x.id===id); return t?t.name:"—"; };
const activeIter = () => S.iterations.find(i=>i.id===S.activeIterationId) || S.iterations[0];
const isPacket = () => !!S.packet;
const catById = id => S.catalog.find(c=>String(c.id)===String(id));

/* ---------- business stream detection ----------
   The responsible business stream is written inside the test case text.
   We scan the configured field and match each stream's keyword list. */
function streamText(c){
  const f=S.config.streamDetectField||"title";
  if(f==="all") return [c.title,c.subProcess,c.variant,c.subVariant,c.bankArea].filter(Boolean).join(" · ");
  return c[f]||"";
}
function streamKeywords(s){ return String(s.keywords||s.name||"").split(",").map(k=>k.trim().toLowerCase()).filter(Boolean); }
function detectStreams(c){
  const text=streamText(c).toLowerCase();
  return (S.config.businessStreams||[]).filter(s=>streamKeywords(s).some(k=>text.includes(k)));
}
function streamMeta(name){ return (S.config.businessStreams||[]).find(s=>s.name===name)||{name,color:"#64748b"}; }
/* effective stream(s): a manual override (array on the catalog item) wins over auto-detection */
function effectiveStreams(c){
  if(Array.isArray(c.streamOverride)) return c.streamOverride.map(n=>streamMeta(n));
  return detectStreams(c);
}

/* ---------- standard vs differentiating classification ----------
   "Standard" = implicit step (fill KYC, create case, upload documents…) that can be
   dropped/absorbed. "Differentiating" = a business case, risk, stream or control worth
   keeping (trust vs natural person, low/high/PEP, true/false hit, scoring, Transact…).
   Differentiating wins when both match. A manual c.simplify override beats the keywords. */
function classText(c){ return [c.title,c.process,c.subProcess,c.variant,c.subVariant].filter(Boolean).join(" · ").toLowerCase(); }
function autoClass(c){
  const t=classText(c);
  const norm=l=>(l||[]).map(k=>String(k).trim().toLowerCase()).filter(Boolean);
  if(norm(S.config.differentiatingKeywords).some(k=>t.includes(k))) return "differentiating";
  if(norm(S.config.standardKeywords).some(k=>t.includes(k))) return "standard";
  return "";
}
function classOf(c){ return (c.simplify==="standard"||c.simplify==="differentiating")?c.simplify:autoClass(c); }
function classBadge(c){
  const k=classOf(c); if(!k) return "";
  const man=(c.simplify==="standard"||c.simplify==="differentiating");
  return k==="differentiating" ? badge((man?"★ ":"")+"differentiating","#22c55e")
                               : badge((man?"★ ":"")+"standard","#64748b");
}
/* Sub-process enriched with the main differentiating metadata (variant, sub-variant,
   application, bank area) — shown as the "↳ …" line so differentiation reads at a glance. */
function subMeta(c){
  const parts=[c.subProcess, c.variant];
  if(c.subVariant && c.subVariant!==c.title) parts.push(c.subVariant);
  if(c.application) parts.push(c.application);
  if(c.bankArea) parts.push(c.bankArea);
  return parts.map(x=>String(x||"").trim()).filter(Boolean).join("  ·  ");
}

/* Natural sort key so PRC-001-01-02 comes before PRC-001-01-10 */
const naturalKey = s => String(s||"").toLowerCase().replace(/\d+/g, m=>m.padStart(10,"0"));

function badge(text,color){ return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}66">${esc(text)}</span>`; }

/* Executions of an iteration (scoped to packet when in tester mode) */
function iterExecs(iterId){
  iterId = iterId || S.activeIterationId;
  let ex = S.executions.filter(e=>e.iterationId===iterId);
  if(isPacket()){
    const sc=S.packet.scope;
    ex = ex.filter(e=> (!sc.testerId || e.testerId===sc.testerId) && (!sc.entity || e.entity===sc.entity));
  }
  return ex;
}
function execsFor(testCaseId, iterId){
  iterId = iterId || S.activeIterationId;
  let ex = S.executions.filter(e=>e.iterationId===iterId && String(e.testCaseId)===String(testCaseId));
  if(isPacket()){ const sc=S.packet.scope;
    ex = ex.filter(e=> (!sc.testerId||e.testerId===sc.testerId) && (!sc.entity||e.entity===sc.entity)); }
  return ex;
}

/* =========================================================================
   NAVIGATION
   ========================================================================= */
const TABS = [
  ["dashboard","Dashboard"],
  ["tests","Library"],
  ["assigned","Assigned"],
  ["tracking","Tracking"],
  ["iterations","Iterations"],
  ["admin","Admin"],
  ["data","Import / Export"],
];
let currentTab = "dashboard";
function buildNav(){
  const tabs = isPacket() ? TABS.filter(t=>["tests","dashboard"].includes(t[0])) : TABS;
  $("#nav").innerHTML = tabs.map(([id,label])=>
    `<button class="${id===currentTab?'active':''}" onclick="go('${id}')">${label}</button>`).join("");
}
function go(tab){ currentTab=tab; document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("#view-"+tab).classList.add("active"); buildNav(); renderTab(tab); }

function renderAll(){ buildIterSelect(); buildNav(); renderTab(currentTab); renderPacketBanner(); }
function renderTab(tab){
  buildIterSelect(); renderPacketBanner();
  ({dashboard:renderDashboard,tests:renderTests,assigned:renderAssigned,
    tracking:renderTracking,iterations:renderIterations,admin:renderAdmin,data:renderData}[tab]||(()=>{}))();
}
function renderPacketBanner(){
  const b=$("#packetBanner");
  if(isPacket()){
    const sc=S.packet.scope;
    b.className="banner show";
    b.innerHTML=`📦 <b>Tester packet mode</b> — scope limited to
      ${sc.testerId?("tester <b>"+esc(testerName(sc.testerId))+"</b>"):""}
      ${sc.entity?(" · entity <b>"+esc(sc.entity)+"</b>"):""}.
      Enter your results, then export them. <button class="sm" onclick="exitPacket()">Exit packet mode</button>`;
  } else b.className="banner";
}

/* ---------- iteration selector ---------- */
function buildIterSelect(){
  $("#iterSelect").innerHTML = S.iterations.map(i=>
    `<option value="${i.id}" ${i.id===S.activeIterationId?'selected':''}>${esc(i.name)}${i.locked?' 🔒':''}</option>`).join("");
}
function setActiveIteration(id){ S.activeIterationId=id; renderAll(); }

/* =========================================================================
   MODAL
   ========================================================================= */
function modal(html){ $("#modalBox").innerHTML=html; $("#modalBg").classList.add("open"); }
function closeModal(){ $("#modalBg").classList.remove("open"); }
$("#modalBg").addEventListener("click",e=>{ if(e.target.id==="modalBg") closeModal(); });

/* ---------- searchable picker (type-to-filter single select) ---------- */
let _picker={items:[],filtered:[],cb:null,title:"",q:""};
function pickerOpen(title,items,cb){ _picker={items,filtered:items.slice(),cb,title:title||"Select",q:""}; pickerRender(); }
function pickerRender(){
  const q=(_picker.q||"").toLowerCase();
  _picker.filtered=_picker.items.filter(it=>((it.label||"")+" "+(it.sub||"")).toLowerCase().includes(q));
  modal(`<h2>${esc(_picker.title)}</h2>
    <input id="pickerQ" autocomplete="off" placeholder="🔍 type to search…" value="${esc(_picker.q||"")}" oninput="_picker.q=this.value;pickerRender()" style="width:100%"/>
    <div class="scrollbox" style="max-height:340px;margin-top:10px">
      ${_picker.filtered.map((it,i)=>`<div onclick="pickerChoose(${i})" style="padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer" onmouseover="this.style.background='rgba(255,255,255,.05)'" onmouseout="this.style.background=''">${esc(it.label)}${it.sub?`<div class="muted" style="font-size:11px">${esc(it.sub)}</div>`:''}</div>`).join("")||'<div class="empty">No match</div>'}
    </div>`);
  const inp=document.getElementById("pickerQ"); if(inp){ inp.focus(); }
}
function pickerChoose(i){ const it=_picker.filtered[i]; const cb=_picker.cb; closeModal(); if(cb&&it) cb(it.value); }
/* tester options for the picker */
function testerItems(allowNone){
  const arr=allowNone?[{value:"",label:"— none —"}]:[];
  return arr.concat(S.config.testers.map(t=>({value:t.id,label:t.name,sub:[t.entity,t.dept,t.email].filter(Boolean).join(" · ")})));
}
/* set a hidden input + its button label from a tester pick (used in modals/forms) */
function pickTesterInto(inputId,btnId,allowNone,title){
  pickerOpen(title||"Choose tester", testerItems(allowNone), v=>{
    const inp=document.getElementById(inputId); if(inp) inp.value=v;
    const b=document.getElementById(btnId); if(b) b.textContent = v?testerName(v):"—";
  });
}
/* live-filter the labels inside a checkbox chip container */
function filterPills(input,wrapId){ const q=input.value.toLowerCase(); const w=document.getElementById(wrapId);
  if(w) w.querySelectorAll("label").forEach(l=>{ l.style.display = l.textContent.toLowerCase().includes(q)?"":"none"; }); }

/* =========================================================================
   DASHBOARD
   ========================================================================= */
function aggregate(execs){
  const a={total:execs.length,byStatus:{},done:0,passed:0,failed:0,blocked:0,notrun:0};
  execs.forEach(e=>{ a.byStatus[e.status]=(a.byStatus[e.status]||0)+1;
    if(e.status==="Passed"){a.passed++;a.done++;}
    else if(e.status==="Failed"){a.failed++;a.done++;}
    else if(e.status==="Blocked"){a.blocked++;a.done++;}
    else if(e.status==="N/A"){a.done++;}
    else a.notrun++;
  });
  return a;
}
function progressBar(execs){
  const a=aggregate(execs); if(!a.total) return '<div class="pbar"></div>';
  const seg=(n,c)=> n? `<span style="width:${n/a.total*100}%;background:${c}"></span>`:"";
  return `<div class="pbar">${seg(a.passed,'#22c55e')}${seg(a.failed,'#ef4444')}${seg(a.blocked,'#f59e0b')}${seg(a.byStatus['N/A']||0,'#475569')}${seg(a.byStatus['In progress']||0,'#a855f7')}</div>`;
}
function renderDashboard(){
  const iter=activeIter(); const ex=iterExecs();
  const a=aggregate(ex);
  const pct = n => a.total? Math.round(n/a.total*100):0;
  const kpi=(n,l,c)=>`<div class="kpi"><div class="n" style="color:${c||'inherit'}">${n}</div><div class="l">${l}</div></div>`;

  const byEntity = S.config.entities.map(en=>{
    const sub=ex.filter(e=>e.entity===en.code); return {en, a:aggregate(sub), bar:progressBar(sub)};
  });
  const domains={};
  ex.forEach(e=>{ const c=catById(e.testCaseId); const d=c?c.domain:"(unknown)"; (domains[d]=domains[d]||[]).push(e); });
  const testers={};
  ex.forEach(e=>{ (testers[e.testerId]=testers[e.testerId]||[]).push(e); });

  $("#view-dashboard").innerHTML = `
    <h2>Dashboard — ${esc(iter?iter.name:"—")}</h2>
    <p class="sub">${esc(S.config.campaignName)} · live progress for the active iteration.</p>
    <div class="cards">
      ${kpi(a.total,"Assigned")}
      ${kpi(a.done+" ("+pct(a.done)+"%)","Executed",'#38bdf8')}
      ${kpi(a.passed,"Passed",'#22c55e')}
      ${kpi(a.failed,"Failed",'#ef4444')}
      ${kpi(a.blocked,"Blocked",'#f59e0b')}
      ${kpi(a.notrun,"To do",'#94a3b8')}
    </div>
    <div class="card">
      <b>Overall progress</b>
      ${progressBar(ex)}
      <div class="legend">
        <span><i style="background:#22c55e"></i>Passed</span><span><i style="background:#ef4444"></i>Failed</span>
        <span><i style="background:#f59e0b"></i>Blocked</span><span><i style="background:#a855f7"></i>In progress</span>
        <span><i style="background:#475569"></i>N/A</span>
      </div>
    </div>
    <div class="split">
      <div class="card">
        <b>By entity</b>
        <table><thead><tr><th>Entity</th><th>Assigned</th><th>Progress</th><th>Pass/Fail/Block</th></tr></thead><tbody>

/* =========================================================================
   TESTS — merged Catalog + Execution
   ========================================================================= */
let testsFilter={q:"",domain:"",process:"",app:"",stream:"",simplify:"",scope:"all",hideDupTitles:true};
/* A catalog test case is "in scope" when it is assigned at least once in the active iteration. */
function isAssignedInIter(catId,iterId){ iterId=iterId||S.activeIterationId;
  return S.executions.some(e=>e.iterationId===iterId && String(e.testCaseId)===String(catId)); }
/* process options for the searchable picker (respects the domain filter) */
function processItems(){
  return [{value:"",label:"All processes"}].concat(
    [...new Set(S.catalog.filter(c=>!testsFilter.domain||c.domain===testsFilter.domain).map(c=>c.process).filter(Boolean))]
      .sort().map(p=>({value:p,label:p})));
}
/* Catalog rows matching the Library content filters (domain/process/app/stream/search) — ignores assigned-state and dedup. */
function libContentMatch(c){
  return (!testsFilter.domain||c.domain===testsFilter.domain) &&
    (!testsFilter.process||c.process===testsFilter.process) &&
    (!testsFilter.app||c.application===testsFilter.app) &&
    (!testsFilter.stream || (testsFilter.stream==="__none__" ? effectiveStreams(c).length===0 : effectiveStreams(c).some(s=>s.name===testsFilter.stream))) &&
    (!testsFilter.simplify || (testsFilter.simplify==="unclassified" ? classOf(c)==="" : classOf(c)===testsFilter.simplify)) &&
    (!testsFilter.q || (c.title+" "+c.id+" "+c.process).toLowerCase().includes(testsFilter.q.toLowerCase()));
}
/* Title key with the "PRC-<serial>" reference stripped, so titles that differ
   only by their PRC serial number count as the same. */
function normTitle(t){
  return String(t||"")
    .replace(/\bPRC[-_\s]?\d+(?:[-_.]\d+)*/gi,"")   // remove PRC- serial numbers
    .replace(/\s+/g," ")
    .replace(/^[\s\-_:–•.]+|[\s\-_:–•.]+$/g,"")     // trim leftover separators
    .trim().toLowerCase();
}
let displayedTC=[];   // ids of currently displayed catalog rows (for reorder)

function sortedCatalog(list){
  return list.slice().sort((a,b)=> (a.order||0)-(b.order||0)
    || naturalKey(a.title).localeCompare(naturalKey(b.title)));
}
function renderTests(){

    (testsFilter.scope==="all" || (testsFilter.scope==="assigned"? isAssignedInIter(c.id) : !isAssignedInIter(c.id)))
  );
  rows=sortedCatalog(rows);
  // collapse rows whose title is identical once the PRC- serial number is ignored

  rows.forEach(c=>{const k=normTitle(c.title); dupCount[k]=(dupCount[k]||0)+1;});

/* bulk assignment from the Library — targets the catalog rows matching the current filters */
function libBulkAssign(){
  const ents=[...document.querySelectorAll(".libEnt:checked")].map(x=>x.value);
  if(!ents.length){ alert("Select at least one target entity."); return; }
  const formTesters=[...document.querySelectorAll(".libTester:checked")].map(x=>x.value);
  const rec=$("#libRec")?$("#libRec").value:"";
  const cats=S.catalog.filter(libContentMatch);
  if(!cats.length){ alert("No test case matches the current filters."); return; }
  const iterId=S.activeIterationId; let created=0, skipped=0;
  cats.forEach(c=>ents.forEach(ent=>{
    const testerIds = formTesters.length ? formTesters : [c.defaultTesterId||""];
    testerIds.forEach(testerId=>{
      if(S.executions.some(e=>e.iterationId===iterId&&String(e.testCaseId)===String(c.id)&&e.entity===ent&&e.testerId===testerId)){ skipped++; return; }
      const t=S.config.testers.find(x=>x.id===testerId);
      S.executions.push({id:uid(),iterationId:iterId,testCaseId:c.id,entity:ent,testerId,
        dept:t?t.dept||"":"",status:"Not started",businessComment:"",recurrence:rec||"",testDate:"",defectLink:"",updatedAt:new Date().toISOString()});
      created++;
    });
  }));
  persist(); alert(created+" assignment(s) created"+(skipped?", "+skipped+" duplicate(s) skipped":"")+".");
}
/* ordering */
function setOrder(id,v){ const c=catById(id); if(c){c.order=parseInt(v)||0; persist();} }
function moveOrder(id,dir){
  const idx=displayedTC.indexOf(String(id)); const j=idx+dir;
  if(idx<0||j<0||j>=displayedTC.length) return;
  const a=catById(displayedTC[idx]), b=catById(displayedTC[j]);
  const t=a.order; a.order=b.order; b.order=t; persist();
}
function resetOrder(){
  let maxO=0; const sorted=S.catalog.slice().sort((a,b)=>naturalKey(a.title).localeCompare(naturalKey(b.title)));
  sorted.forEach(c=>c.order=++maxO); persist();
}

function saveTC(id){ const c=catById(id); if(!c)return;
  const newId=$("#tc_id").value.trim()||c.id;
  if(newId!==c.id){ S.executions.forEach(e=>{ if(String(e.testCaseId)===String(c.id)) e.testCaseId=newId; }); c.id=newId; }

  { const cl=$("#tc_class").value; if(cl) c.simplify=cl; else delete c.simplify; }

}
function delTestCase(id){ if(!confirm("Delete this test case and its executions (all iterations)?"))return;
  S.catalog=S.catalog.filter(c=>String(c.id)!==String(id));
  S.executions=S.executions.filter(e=>String(e.testCaseId)!==String(id));

/* quick assign one entity in active iteration */
function quickAssign(catId,ent){
  const c=catById(catId); const iterId=S.activeIterationId;
  if(S.executions.some(e=>e.iterationId===iterId&&String(e.testCaseId)===String(catId)&&e.entity===ent&&e.testerId===(c.defaultTesterId||""))) return;
  const tester=S.config.testers.find(t=>t.id===c.defaultTesterId);
  S.executions.push({id:uid(),iterationId:iterId,testCaseId:catId,entity:ent,testerId:c.defaultTesterId||"",
    dept:tester?tester.dept||"":"",status:"Not started",businessComment:"",recurrence:"",testDate:"",defectLink:"",updatedAt:new Date().toISOString()});

}
/* execution edits */
function setStatus(id,v){ const e=S.executions.find(x=>x.id===id); if(!e)return;
  e.status=v; e.updatedAt=new Date().toISOString(); if(v!=="Not started"&&!e.testDate) e.testDate=new Date().toISOString().slice(0,10);
  save(); renderTab(currentTab); }
function setComment(id,v){ const e=S.executions.find(x=>x.id===id); if(!e)return; e.businessComment=v; e.updatedAt=new Date().toISOString(); save(); }
function setExecTester(id,v){ const e=S.executions.find(x=>x.id===id); if(!e)return; e.testerId=v; const t=S.config.testers.find(x=>x.id===v); e.dept=t?t.dept||"":""; e.updatedAt=new Date().toISOString(); save(); }
function setExecRecurrence(id,v){ const e=S.executions.find(x=>x.id===id); if(!e)return; e.recurrence=v; e.updatedAt=new Date().toISOString(); save(); }
/* effective title for an execution: a per-assignment scenario override wins over the Library title */
function execTitle(e){ const c=catById(e.testCaseId); return (e.scenarioTitle&&e.scenarioTitle.trim()) || (c&&c.title) || ("#"+e.testCaseId); }
/* set a per-assignment scenario title; clearing it (or matching the Library title) reverts to the base title */
function setExecTitle(id,v){ const e=S.executions.find(x=>x.id===id); if(!e)return;
  v=(v||"").trim(); const c=catById(e.testCaseId);
  if(v && !(c&&v===c.title)) e.scenarioTitle=v; else delete e.scenarioTitle;
  e.updatedAt=new Date().toISOString(); save(); }
function delExec(id){ S.executions=S.executions.filter(x=>x.id!==id); persist(); }

/* =========================================================================
   ASSIGNED — every assigned test (execution) for the active iteration,
   still editable. The Library (Tests) tab holds the catalog; this tab is
   the working list of what has actually been assigned.
   ========================================================================= */
let assignedFilter={q:"",entity:"",tester:"",status:"",stream:""};
function renderAssigned(){
  const iter=activeIter();
  let ex=iterExecs();
  ex=ex.filter(e=>{
    const c=catById(e.testCaseId)||{};
    if(assignedFilter.entity && e.entity!==assignedFilter.entity) return false;
    if(assignedFilter.tester && (e.testerId||"")!==assignedFilter.tester) return false;
    if(assignedFilter.status && e.status!==assignedFilter.status) return false;
    if(assignedFilter.stream){ const ok = assignedFilter.stream==="__none__" ? effectiveStreams(c).length===0 : effectiveStreams(c).some(s=>s.name===assignedFilter.stream); if(!ok) return false; }
    if(assignedFilter.q){ const t=(execTitle(e)+" "+e.testCaseId+" "+(c.process||"")).toLowerCase(); if(!t.includes(assignedFilter.q.toLowerCase())) return false; }
    return true;
  });
  ex=ex.slice().sort((a,b)=>{const ca=catById(a.testCaseId)||{},cb=catById(b.testCaseId)||{};
    return (ca.order||0)-(cb.order||0)||naturalKey(ca.title).localeCompare(naturalKey(cb.title))||String(a.entity).localeCompare(String(b.entity));});
  const a=aggregate(ex);
  const totalAssigned=iterExecs().length;

  $("#view-assigned").innerHTML=`
    <h2>Assigned tests — ${esc(iter?iter.name:"—")}</h2>
    <p class="sub">${totalAssigned} test(s) assigned in this iteration. This is your working list — update status, tester, recurrence or comment here at any time. Create assignments from the <b>Assignment</b> tab; manage the catalog in <b>Library</b>.</p>
    ${totalAssigned===0?`<div class="card empty">Nothing assigned yet in ${esc(iter?iter.name:"")}. Put tests in scope in <b>Library</b>, then assign them in the <b>Assignment</b> tab.</div>`:`
    <div class="cards" style="margin-bottom:12px">
      <div class="kpi"><div class="n">${a.total}</div><div class="l">Shown</div></div>
      <div class="kpi"><div class="n" style="color:#38bdf8">${a.done}</div><div class="l">Executed</div></div>
      <div class="kpi"><div class="n" style="color:#22c55e">${a.passed}</div><div class="l">Passed</div></div>
      <div class="kpi"><div class="n" style="color:#ef4444">${a.failed}</div><div class="l">Failed</div></div>
      <div class="kpi"><div class="n" style="color:#f59e0b">${a.blocked}</div><div class="l">Blocked</div></div>
      <div class="kpi"><div class="n" style="color:#94a3b8">${a.notrun}</div><div class="l">To do</div></div>
    </div>
    <div class="card" style="padding:10px 12px">${progressBar(ex)}</div>
    <div class="toolbar">
      <input placeholder="🔍 search…" value="${esc(assignedFilter.q)}" oninput="assignedFilter.q=this.value;renderAssigned()" style="min-width:200px"/>
      <select onchange="assignedFilter.entity=this.value;renderAssigned()"><option value="">All entities</option>${S.config.entities.map(en=>`<option value="${esc(en.code)}" ${assignedFilter.entity===en.code?'selected':''}>${esc(en.code)} — ${esc(en.label)}</option>`).join("")}</select>
      <button class="sm" title="filter by tester (searchable)" onclick="pickerOpen('Filter by tester', [{value:'',label:'All testers'}].concat(testerItems(false)), v=>{assignedFilter.tester=v;renderAssigned();})">${assignedFilter.tester?'👤 '+esc(testerName(assignedFilter.tester)):'All testers ▾'}</button>
      <select onchange="assignedFilter.status=this.value;renderAssigned()"><option value="">All statuses</option>${S.config.statuses.map(s=>`<option ${assignedFilter.status===s.value?'selected':''}>${esc(s.value)}</option>`).join("")}</select>
      <select onchange="assignedFilter.stream=this.value;renderAssigned()" title="business stream"><option value="">All streams</option>${(S.config.businessStreams||[]).map(s=>`<option value="${esc(s.name)}" ${assignedFilter.stream===s.name?'selected':''}>${esc(s.name)}</option>`).join("")}<option value="__none__" ${assignedFilter.stream==='__none__'?'selected':''}>— no stream —</option></select>
      <button class="sm" onclick="assignedFilter={q:'',entity:'',tester:'',status:'',stream:''};renderAssigned()">Clear</button>
      <div class="spacer"></div>
      <span class="muted">${ex.length} shown</span>
    </div>
    <div class="scrollbox">
    <table><thead><tr><th>Test Case</th><th>Entity</th><th style="min-width:150px">Tester</th><th style="width:140px">Status</th><th style="width:120px">Recurrence</th><th>Business comment</th><th style="width:90px">Date</th><th style="width:40px"></th></tr></thead><tbody>
    ${ex.slice(0,1000).map(e=>{const c=catById(e.testCaseId);const cm=c||{};const sm=statusMeta(e.status);const need=sm.requiresComment&&!e.businessComment;const st=effectiveStreams(cm);
      return `<tr>
      <td><input style="width:100%;font-weight:600${e.scenarioTitle?';border-color:#38bdf8':''}" value="${esc(execTitle(e))}" title="Scenario for this assignment only — edit to specialise it (e.g. ‘Onboarding of a physical person – low risk’). Does not change the Library or the other testers' rows. Clear it to revert to the base title." onchange="setExecTitle('${e.id}',this.value);renderAssigned()"/><div class="muted" style="font-size:11px">#${esc(e.testCaseId)}${cm.title&&e.scenarioTitle?` · base: ${esc(cm.title)}`:''}${cm.process?' · '+esc(cm.process):''}${cm.application?' · '+esc(cm.application):''}</div>${(()=>{const sm=subMeta(cm);return sm?`<div style="font-size:11px;color:var(--accent)" title="sub-process + differentiating metadata">↳ ${esc(sm)}</div>`:'';})()}${st.length?`<div class="chiprow" style="margin-top:2px">${st.map(s=>badge(s.name,s.color)).join("")}</div>`:''}</td>
      <td>${badge(e.entity,entityMeta(e.entity).color)}</td>
      <td><button class="sm" style="width:100%;text-align:left" onclick="pickerOpen('Choose tester for this assignment', testerItems(true), v=>{setExecTester('${e.id}',v);renderAssigned();})">${e.testerId?esc(testerName(e.testerId)):'<span class="muted">— set tester —</span>'}</button></td>
      <td><select onchange="setStatus('${e.id}',this.value)" style="border-color:${sm.color}66;color:${sm.color}">${S.config.statuses.map(s=>`<option ${s.value===e.status?'selected':''}>${esc(s.value)}</option>`).join("")}</select></td>
      <td><select onchange="setExecRecurrence('${e.id}',this.value)"><option value="">—</option>${S.config.recurrences.map(r=>`<option ${e.recurrence===r?'selected':''}>${esc(r)}</option>`).join("")}</select></td>
      <td><input style="width:100%;${need?'border-color:#ef4444':''}" placeholder="${sm.requiresComment?'required…':'optional'}" value="${esc(e.businessComment)}" oninput="setComment('${e.id}',this.value)"/>${need?'<div class="hint" style="color:#ef4444">Comment required</div>':''}</td>
      <td class="muted">${esc(e.testDate||"")}</td>
      <td><button class="sm danger" onclick="delExec('${e.id}')" title="remove assignment">✕</button></td>
    </tr>`;}).join("") || '<tr><td colspan="8" class="empty">No assignment matches the filters.</td></tr>'}
    </tbody></table></div>
    ${ex.length>1000?'<p class="hint">Showing first 1000 — refine the filters.</p>':''}`}`;
}

/* =========================================================================
   COVERAGE MATRIX (Process × Entity) — rendered on the Dashboard
   ========================================================================= */
function coverageMatrixCard(){
  const iter=activeIter(); const ex=iterExecs();
  const procOf=e=>{const c=catById(e.testCaseId);return c&&c.process?c.process:"(unknown)";};
  const procList=[...new Set(ex.map(procOf))].sort();
  if(!procList.length) return "";
  const cnt=(proc,ent)=>ex.filter(e=>procOf(e)===proc&&e.entity===ent).length;
  return `<div class="card">
    <b>Coverage — Process × Entity</b> <span class="muted">(assignments in ${esc(iter?iter.name:"")})</span>
    <div class="scrollbox" style="margin-top:8px">
    <table class="matrix"><thead><tr><th class="proc">Process</th>${S.config.entities.map(en=>`<th>${badge(en.code,en.color)}</th>`).join("")}<th>Total</th></tr></thead><tbody>
    ${procList.map(p=>{let tot=0;const cells=S.config.entities.map(en=>{const n=cnt(p,en.code);tot+=n;return `<td>${n||'<span class="muted">·</span>'}</td>`;}).join("");return `<tr><td class="proc">${esc(p)}</td>${cells}<td><b>${tot}</b></td></tr>`;}).join("")}
    </tbody></table></div></div>`;
}

function carryOverAll(){
  const from=activeIter(); const name=prompt("New iteration name (replays ALL assignments):","UAT "+(S.iterations.length+1)); if(!name)return;
  const it={id:uid(),name,startDate:"",endDate:"",active:true,locked:false}; S.iterations.push(it);
  const src=S.executions.filter(e=>e.iterationId===from.id);
  src.forEach(e=>S.executions.push({...e,id:uid(),iterationId:it.id,status:"Not started",businessComment:"",testDate:"",defectLink:"",updatedAt:new Date().toISOString()}));
  S.activeIterationId=it.id; renderAll(); save(); alert(src.length+" assignment(s) replayed in "+name+".");
}
function newIter(){ const name=prompt("Iteration name:","UAT "+(S.iterations.length+1)); if(!name)return;
  const it={id:uid(),name,startDate:"",endDate:"",active:true,locked:false}; S.iterations.push(it); S.activeIterationId=it.id; renderAll(); save(); }
function editIter(id){ const it=S.iterations.find(x=>x.id===id);
  modal(`<h2>Edit iteration</h2>
    <div class="field"><label>Name</label><input id="it_name" value="${esc(it.name)}"/></div>
    <div class="row" style="margin-top:10px">
      <div class="field"><label>Start</label><input type="date" id="it_start" value="${esc(it.startDate)}"/></div>
      <div class="field"><label>End</label><input type="date" id="it_end" value="${esc(it.endDate)}"/></div>
    </div>
    <div class="toolbar" style="margin-top:14px"><div class="spacer"></div><button onclick="closeModal()">Cancel</button>
    <button class="primary" onclick="saveIter('${id}')">Save</button></div>`); }
function saveIter(id){ const it=S.iterations.find(x=>x.id===id); it.name=$("#it_name").value; it.startDate=$("#it_start").value; it.endDate=$("#it_end").value; closeModal(); renderAll(); save(); }
function delIter(id){ if(!confirm("Delete this iteration and its executions?"))return;
  S.iterations=S.iterations.filter(x=>x.id!==id); S.executions=S.executions.filter(e=>e.iterationId!==id);
  if(S.activeIterationId===id) S.activeIterationId=S.iterations[0].id; renderAll(); save(); }
function carryOver(){
  const from=activeIter(); const name=prompt("New iteration name:","UAT "+(S.iterations.length+1)); if(!name)return;
  const it={id:uid(),name,startDate:"",endDate:"",active:true,locked:false}; S.iterations.push(it);
  const src=S.executions.filter(e=>e.iterationId===from.id && ["Failed","Blocked","Not started"].includes(e.status));
  src.forEach(e=>S.executions.push({...e,id:uid(),iterationId:it.id,status:"Not started",businessComment:"",testDate:"",defectLink:"",updatedAt:new Date().toISOString()}));
  S.activeIterationId=it.id; renderAll(); save(); alert(src.length+" test(s) carried over to "+name+".");
}

        <td style="text-align:center"><b>${cnt}</b></td>
        <td><button class="sm danger" onclick="S.config.businessStreams.splice(${i},1);persist()">✕</button></td></tr>`;}).join("")
        || '<tr><td colspan="5" class="muted">No stream defined.</td></tr>'}
      </tbody></table>
      <div class="toolbar" style="margin-top:8px">
        <button class="sm" onclick="S.config.businessStreams.push({name:'New stream',keywords:'',color:'#38bdf8'});persist()">+ Stream</button>
        <div class="spacer"></div>
        <span class="muted">${S.catalog.length?`${S.catalog.filter(c=>detectStreams(c).length===0).length} of ${S.catalog.length} step(s) have no stream detected`:'Import the catalog to see match counts.'}</span>
      </div>
      <p class="hint">Tip: open the <b>Library</b> tab — each step now shows a coloured stream chip, and you can filter by stream. Check the chips are right before we build the scenario grouping on top.</p>
    </div>

    <div class="card"><b>Simplified test plan — standard vs differentiating</b>
      <p class="hint" style="margin-top:6px">Rule: for each test, ask <i>"if I remove this line, do I lose a business case, a risk, a stream or a control?"</i> — if <b>no</b> it's <b>standard</b> (implicit, can be dropped/absorbed); if <b>yes</b> it's <b>differentiating</b> (keep). Keywords are matched in the test title + process/levels; <b>differentiating wins</b> when both match. One keyword per line. (A per-test manual choice in the ✎ editor overrides these.)</p>
      ${(()=>{const d=S.catalog.filter(c=>classOf(c)==='differentiating').length,s=S.catalog.filter(c=>classOf(c)==='standard').length,u=S.catalog.length-d-s;
        return `<div class="cards" style="margin:6px 0 10px"><div class="kpi"><div class="n" style="color:#22c55e">${d}</div><div class="l">Differentiating</div></div><div class="kpi"><div class="n" style="color:#94a3b8">${s}</div><div class="l">Standard</div></div><div class="kpi"><div class="n">${u}</div><div class="l">Unclassified</div></div></div>`;})()}
      <div class="split">
        <div class="field"><label>Differentiating keywords <span class="muted">(keep)</span></label><textarea onchange="S.config.differentiatingKeywords=this.value.split('\\n').map(x=>x.trim()).filter(Boolean);persist()">${esc((S.config.differentiatingKeywords||[]).join("\n"))}</textarea></div>
        <div class="field"><label>Standard keywords <span class="muted">(drop / absorb)</span></label><textarea onchange="S.config.standardKeywords=this.value.split('\\n').map(x=>x.trim()).filter(Boolean);persist()">${esc((S.config.standardKeywords||[]).join("\n"))}</textarea></div>
      </div>
      <p class="hint">In the <b>Library</b>, filter to <b>Differentiating only</b> and bulk-assign — that becomes your simplified plan. Each row shows a coloured <b>standard</b>/<b>differentiating</b> chip (★ = set manually).</p>
    </div>

    <div class="card"><b>DevOps import column mapping</b>
      <p class="hint">Map each model field to the column header of your .xlsx export.</p>
      <div class="grid" style="grid-template-columns:repeat(3,1fr)">
      ${Object.keys(m).map(k=>`<div class="field"><label>${esc(k)}</label><input value="${esc(m[k])}" onchange="S.config.columnMapping['${k}']=this.value;persist()"/></div>`).join("")}
      </div>
    </div>`;
}
function delTester(i){ const t=S.config.testers[i];
  const used=S.executions.some(e=>e.testerId===t.id)||S.catalog.some(c=>c.defaultTesterId===t.id);
  if(used && !confirm("This tester is referenced by some tests. Remove anyway?")) return;
  S.config.testers.splice(i,1); persist(); }

/* =========================================================================
   IMPORT / EXPORT
   ========================================================================= */
function renderData(){
  $("#view-data").innerHTML=`
    <h2>Import / Export</h2>
    <p class="sub">Import the DevOps export, back up your work, and run the tester round-trip.</p>

    <div class="card"><b>1. Import DevOps catalog (.xlsx)</b>
      <p class="hint">Test cases are deduplicated by identifier. The Admin column mapping is applied. Testers found in the TesterName column are auto-created and set as each test case's default tester.</p>
      <input type="file" id="impDevops" accept=".xlsx,.xls" onchange="importDevops(this)"/>
      <div class="field" style="margin-top:8px;max-width:260px"><label>Sheet</label><input id="impSheet" value="LUX" placeholder="sheet name"/></div>
    </div>

    <div class="card"><b>2. Full backup (JSON)</b>
      <p class="hint">All data (config, catalog, iterations, executions). This is your coordinator working file.</p>
      <div class="cards"><button class="primary" onclick="exportJSON()">⬇ Export backup</button>
        <label class="pill" style="cursor:pointer">⬆ Restore<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"/></label></div>
    </div>

    <div class="card"><b>3. Tester round-trip</b>
      <p class="hint">The coordinator exports a packet per tester/entity (active iteration). The tester opens this same <code>index.html</code>, imports the packet, enters results, then exports results. The coordinator merges them back.</p>
      <div class="row">
        <div class="field"><label>Tester</label><input type="hidden" id="pkTester" value=""/><button type="button" id="pkTester_btn" onclick="pickTesterInto('pkTester','pkTester_btn',true,'Choose tester')">— all —</button></div>
        <div class="field"><label>Entity</label><select id="pkEntity"><option value="">— all —</option>${S.config.entities.map(en=>`<option value="${en.code}">${esc(en.code)}</option>`).join("")}</select></div>
        <button onclick="exportPacket()">⬇ Export tester packet</button>
      </div>
      <div class="cards" style="margin-top:12px">
        <label class="pill" style="cursor:pointer">📦 Import packet (tester side)<input type="file" accept=".json" style="display:none" onchange="importPacket(this)"/></label>
        <button onclick="exportResults()">⬆ Export my results (tester side)</button>
        <label class="pill" style="cursor:pointer">↩ Merge results (coordinator side)<input type="file" accept=".json" style="display:none" onchange="mergeResults(this)"/></label>
      </div>
    </div>

    <div class="card"><b>4. Consolidated report (.xlsx)</b>
      <p class="hint">Excel export of every execution (all iterations) for sharing / reporting.</p>
      <button class="primary" onclick="exportReport()">⬇ Export Excel report</button>
    </div>

    <div class="card"><b>Reset</b>
      <button class="danger" onclick="if(confirm('Erase everything and start over?')){localStorage.removeItem(LS_KEY);location.reload();}">Reset application</button>
    </div>`;
}

/* ---------- import DevOps xlsx ---------- */
function importDevops(input){
  const file=input.files[0]; if(!file)return;
  const sheetName=$("#impSheet").value||null;
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array"});
    const sn = sheetName && wb.SheetNames.includes(sheetName) ? sheetName : wb.SheetNames[0];
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:""});
    const m=S.config.columnMapping;
    const seen={}; let added=0,merged=0,newTesters=0;
    rows.forEach(r=>{
      const id=r[m.testCaseId]; if(id===""||id==null)return;
      // tester from column E (TesterName)
      let testerId="";
      const tname=(r[m.tester]||"").toString().trim();
      if(tname){ let t=S.config.testers.find(x=>x.name===tname);
        if(!t){ t={id:uid(),name:tname,email:"",entity:"",dept:""}; S.config.testers.push(t); newTesters++; }
        testerId=t.id; }
      const obj={
        id, title:r[m.title]||("#"+id), domain:r[m.domain]||"", process:r[m.process]||"",
        subProcess:r[m.subProcess]||"", variant:r[m.variant]||"", subVariant:r[m.subVariant]||"",
        application:r[m.application]||"", bankArea:r[m.bankArea]||"", devopsLink:r[m.devopsLink]||"",
        defaultTesterId:testerId
      };
      if(seen[id])return; seen[id]=true;
      const ex=catById(id);
      if(ex){ Object.assign(ex,obj,{inScope:ex.inScope,tags:ex.tags,order:ex.order,defaultTesterId:testerId||ex.defaultTesterId}); merged++; }
      else { S.catalog.push({...obj,inScope:false,tags:[],order:0}); added++; }
    });
    // assign natural order to items without one
    let maxO=S.catalog.reduce((mm,c)=>Math.max(mm,c.order||0),0);
    const noOrder=S.catalog.filter(c=>!c.order);
    noOrder.sort((a,b)=>naturalKey(a.title).localeCompare(naturalKey(b.title)));
    noOrder.forEach(c=>c.order=++maxO);
    save(); go("tests");
    alert(`Import done (sheet "${sn}"): ${added} new, ${merged} updated, ${newTesters} tester(s) created. Catalog total: ${S.catalog.length}.`);
  };
  reader.readAsArrayBuffer(file);
}

/* ---------- JSON backup ---------- */
function download(name,content,type){ const b=new Blob([content],{type:type||"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportJSON(){ download(`MCEU_UAT_backup_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,2)); }
function importJSON(input){ const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=e=>{ try{ S=migrate(JSON.parse(e.target.result)); renderAll(); save(); alert("Backup restored."); }catch(err){ alert("Invalid file."); } };
  r.readAsText(f); }

/* ---------- round-trip ---------- */
function exportPacket(){
  const testerId=$("#pkTester").value, entity=$("#pkEntity").value, iterId=S.activeIterationId;
  let ex=S.executions.filter(e=>e.iterationId===iterId && (!testerId||e.testerId===testerId) && (!entity||e.entity===entity));
  if(!ex.length){ alert("No execution for this scope in the active iteration."); return; }
  const ids=[...new Set(ex.map(e=>String(e.testCaseId)))];
  const packet={
    _type:"MCEU_UAT_PACKET",
    appBuild:APP_BUILD, appVersion:APP_VERSION,
    config:{campaignName:S.config.campaignName,entities:S.config.entities,statuses:S.config.statuses,recurrences:S.config.recurrences,testers:S.config.testers},
    iterations:S.iterations.filter(i=>i.id===iterId),
    catalog:S.catalog.filter(c=>ids.includes(String(c.id))),
    executions:ex,
    activeIterationId:iterId,
    packet:{scope:{testerId,entity,iterationId:iterId}}
  };
  const who=testerId?testerName(testerId):"all";
  download(`packet_${who.replace(/\W+/g,'_')}_${entity||'all'}.json`, JSON.stringify(packet,null,2));
}
function importPacket(input){ const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=e=>{ try{ const p=JSON.parse(e.target.result); if(p._type!=="MCEU_UAT_PACKET"){alert("This is not a tester packet.");return;}
    if(p.appBuild && p.appBuild>APP_BUILD && !confirm("⚠ This packet was created with a NEWER version of the app (build "+p.appBuild+") than the one you're using (build "+APP_BUILD+").\n\nSome details — like scenario titles — may not display correctly. Please ask for the latest MCEU_UAT_manager.html file.\n\nLoad anyway?")) return;
    const d=defaultState();
    S={...d, config:{...d.config,...p.config,columnMapping:d.config.columnMapping},
       iterations:p.iterations, activeIterationId:p.activeIterationId,
       catalog:p.catalog, executions:p.executions, packet:p.packet};
    save(); currentTab="tests"; renderAll(); go("tests");
    alert("Packet loaded. You are in tester mode — enter your results then export them.");
  }catch(err){ alert("Invalid packet."); } };
  r.readAsText(f); }
function exitPacket(){ if(!confirm("Exit packet mode? (your entries stay in this file — remember to export them)"))return;
  S.packet=null; save(); currentTab="dashboard"; renderAll(); go("dashboard"); }
function exportResults(){
  const ex = S.packet ? iterExecs() : S.executions.filter(e=>e.iterationId===S.activeIterationId);
  download(`results_${new Date().toISOString().slice(0,10)}.json`,
    JSON.stringify({_type:"MCEU_UAT_RESULTS",executions:ex},null,2)); }
function mergeResults(input){ const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=e=>{ try{ const p=JSON.parse(e.target.result); if(p._type!=="MCEU_UAT_RESULTS"){alert("This is not a results file.");return;}
    let upd=0,add=0;
    p.executions.forEach(inc=>{ const cur=S.executions.find(x=>x.id===inc.id);
      if(cur){ if(!cur.updatedAt || (inc.updatedAt||"")>=cur.updatedAt){ Object.assign(cur,inc); upd++; } }
      else { S.executions.push(inc); add++; } });
    renderAll(); save(); alert(`Results merged: ${upd} updated, ${add} added.`);
  }catch(err){ alert("Invalid file."); } };
  r.readAsText(f); }

/* ---------- xlsx report ---------- */
function exportReport(){
  const data=S.executions.map(e=>{ const c=catById(e.testCaseId)||{}; const it=S.iterations.find(i=>i.id===e.iterationId)||{};
    return {Iteration:it.name||"",TestCaseId:e.testCaseId,Title:execTitle(e),BaseTitle:c.title||"",Type:classOf(c)||"",Domain:c.domain||"",Process:c.process||"",
      SubProcess:c.subProcess||"",Application:c.application||"",Entity:e.entity,Tester:testerName(e.testerId),
      Status:e.status,Recurrence:e.recurrence||"",TestDate:e.testDate||"",BusinessComment:e.businessComment||"",
      DefectLink:e.defectLink||"",DevOpsLink:c.devopsLink||""}; });
  const ws=XLSX.utils.json_to_sheet(data.length?data:[{Info:"No execution"}]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"UAT Report");
  XLSX.writeFile(wb,`MCEU_UAT_report_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* ---------- startup ---------- */
const _vEl=document.getElementById("appVer"); if(_vEl) _vEl.textContent="("+APP_VERSION+")";
renderAll(); go("dashboard");
</script>
