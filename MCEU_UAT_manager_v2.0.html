<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCEU — UAT Campaign Manager</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --ok:#22c55e; --fail:#ef4444; --block:#f59e0b; --na:#64748b; --prog:#a855f7;
    --chip:#0b1220;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  header{background:linear-gradient(90deg,#0b1220,#16233b);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .brand{color:var(--accent)}
  .iter-pill{margin-left:auto;display:flex;align-items:center;gap:8px}
  select,input,textarea{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
  textarea{width:100%;min-height:50px;resize:vertical}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:#06283b;font-weight:600}
  button.primary:hover{background:var(--accent)}
  button.danger{border-color:var(--fail);color:#fca5a5}
  button.sm{padding:3px 8px;font-size:12px}
  nav{display:flex;gap:4px;background:#0b1220;padding:6px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:9px 18px;color:var(--muted);font-size:14px}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
  main{padding:18px;max-width:1600px;margin:0 auto}
  .view{display:none}
  .view.active{display:block}
  h2{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  .grid{display:grid;gap:12px}
  .cards{display:flex;gap:12px;flex-wrap:wrap}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:120px;flex:1}
  .kpi .n{font-size:26px;font-weight:700}
  .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);z-index:1}
  tr:hover td{background:rgba(255,255,255,.02)}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar .spacer{flex:1}
  .pbar{height:10px;background:#0b1220;border-radius:6px;overflow:hidden;display:flex;min-width:120px}
  .pbar span{display:block;height:100%}
  .muted{color:var(--muted)}
  .tag{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;margin:1px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted)}
  .matrix td,.matrix th{text-align:center}
  .matrix td.proc{text-align:left}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:680px;width:92%;max-height:88vh;overflow:auto}
  .pill{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
  code{background:var(--chip);padding:1px 5px;border-radius:4px}
  .ord{display:flex;align-items:center;gap:3px}
  .ord button{padding:0 6px;line-height:1.5;font-size:11px}
  .ord input{width:52px;text-align:center;padding:3px}
  details.sec>summary{cursor:pointer;font-weight:600;font-size:15px;padding:6px 0;list-style:none}
  details.sec>summary::before{content:"▸ ";color:var(--accent)}
  details.sec[open]>summary::before{content:"▾ "}
  .stickyhead{position:sticky;top:88px;background:var(--bg);padding:6px 0;z-index:2}
  .combo{position:relative;display:inline-block;vertical-align:top}
  .combo .combo-in{width:100%}
  .combo-list{position:absolute;z-index:60;left:0;right:0;top:100%;margin-top:2px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;max-height:240px;overflow:auto;display:none;box-shadow:0 10px 26px rgba(0,0,0,.45);min-width:170px}
  .combo-opt{padding:6px 9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .combo-opt:hover{background:var(--accent2);color:#06283b}
  .steptoggle{color:var(--accent);cursor:pointer;font-size:12px;user-select:none;white-space:nowrap}
  .steplist{margin:4px 0 2px;padding-left:20px}
  .steplist li{margin:2px 0}
  .steprow>td{background:var(--chip)}
  .reftag{display:inline-block;background:#a855f733;color:#c4b5fd;border:1px solid #a855f7;border-radius:10px;padding:0 6px;font-size:10px;font-weight:600;margin-left:6px;vertical-align:middle}
  .tpick{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:4px;cursor:pointer}
  .tpick:hover{background:rgba(255,255,255,.04)}
  .tlist{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1><span class="brand">MCEU</span> · UAT Campaign Manager</h1>
  <span class="muted" id="saveStamp" style="font-size:11px;margin-left:6px"></span>
  <div class="iter-pill">
    <span class="muted" style="font-size:12px">Active&nbsp;iteration</span>
    <select id="iterSelect" onchange="setActiveIteration(this.value)"></select>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <div id="view-dashboard" class="view"></div>
  <div id="view-library" class="view"></div>
  <div id="view-campaign" class="view"></div>
  <div id="view-admin" class="view"></div>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script>
/* =========================================================================
   MCEU UAT MANAGER v2 — local single-file web app · 4 screens
   Library (reusable PRC x Scenario definitions) -> Campaign (iterations,
   testers w/ country, dispatch on entities, execution tracking, per-tester
   standalone HTML) -> Dashboard + Admin (config + import/export).
   Persistence: localStorage + xlsx/JSON.
   ========================================================================= */

const LS_KEY = "mceu_uat_state_v2";
const APP_VERSION = "v2.0";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function defaultState(){
  const it1 = {id:uid(), name:"UAT 1", startDate:"", endDate:""};
  return {
    version:3,
    config:{
      campaignName:"MCEU UAT Campaign",
      entities:[
        {code:"LU", label:"Luxembourg",     color:"#38bdf8"},
        {code:"FR", label:"France",         color:"#a855f7"},
        {code:"SP", label:"Spain",          color:"#f59e0b"},
        {code:"UK", label:"United Kingdom",  color:"#22c55e"},
      ],
      departments:["Wealth Management","Operations","Compliance","Finance","Investment","Risk"],
      statuses:[
        {value:"Not started", color:"#64748b", requiresComment:false},
        {value:"In progress", color:"#a855f7", requiresComment:false},
        {value:"Passed",      color:"#22c55e", requiresComment:false},
        {value:"Failed",      color:"#ef4444", requiresComment:true},
        {value:"Blocked",     color:"#f59e0b", requiresComment:true},
        {value:"N/A",         color:"#475569", requiresComment:false},
      ],
      recurrences:["Often","Rarely","Exceptionally"],
      links:[],
      columnMapping:{ process:"TitleLevel3", scenario:"TitleLevel4", domain:"TitleLevel2", tester:"TesterName" }
    },
    testers:[],
    library:[],
    iterations:[it1],
    activeIterationId:it1.id,
    executions:[]
  };
}

let S = load();
function load(){ try{ const r=localStorage.getItem(LS_KEY); if(r) return migrate(JSON.parse(r)); }catch(e){} return defaultState(); }
function migrate(s){ const d=defaultState();
  const cfg=Object.assign(d.config,s.config||{});
  cfg.columnMapping=Object.assign(d.config.columnMapping,(s.config||{}).columnMapping||{});
  return Object.assign(d,s,{config:cfg}); }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); stampSaved(); }
  catch(e){ const el=document.getElementById("saveStamp"); if(el){ el.style.color="#f59e0b"; el.textContent=APP_VERSION+" · ⚠ browser storage full — export a backup"; }
    if(!save._warned){ save._warned=true; alert("Browser storage is full (screenshots/large data). Use Admin → “Full backup (JSON)” to avoid losing data, then consider trimming evidence."); } } }
function stampSaved(){ const el=document.getElementById("saveStamp"); if(!el)return; el.style.color="";
  const lb=(S.meta&&S.meta.lastBackup)?(" · last backup "+new Date(S.meta.lastBackup).toLocaleDateString()):" · ⚠ no backup yet";
  el.textContent=APP_VERSION+" · saved "+new Date().toLocaleTimeString()+lb; }
function persist(){ save(); renderTab(currentTab); }

/* helpers */
const $ = sel => document.querySelector(sel);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const statusMeta = v => S.config.statuses.find(x=>x.value===v) || {value:v,color:"#64748b",requiresComment:false};
const entityMeta = c => S.config.entities.find(x=>x.code===c) || {code:c,label:c,color:"#64748b"};
const tester = id => S.testers.find(x=>x.id===id);
const testerName = id => { const t=tester(id); return t?t.name:"—"; };
const libTesterIds = c => (c&&c.defaultTesterIds&&c.defaultTesterIds.length)?c.defaultTesterIds:(c&&c.defaultTesterId?[c.defaultTesterId]:[]);
const testerNames = ids => (ids||[]).map(id=>{const t=tester(id);return t?t.name:null;}).filter(Boolean).join(", ");
const activeIter = () => S.iterations.find(i=>i.id===S.activeIterationId) || S.iterations[0];
const libById = id => S.library.find(c=>String(c.id)===String(id));
const naturalKey = s => String(s||"").toLowerCase().replace(/\d+/g, m=>m.padStart(10,"0"));
const iterExecs = (iterId) => S.executions.filter(e=>e.iterationId===(iterId||S.activeIterationId));
function badge(text,color){ return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}66">${esc(text)}</span>`; }

/* =========================================================================
   SEARCHABLE TESTER COMBOBOX — sorted by name + type-to-filter.
   Drop-in replacement for the old unsorted <select> tester dropdowns.
   tCombo(key,value,onpick,opts) returns HTML. onpick is a JS snippet run on
   pick with the chosen id available as `v`. opts: {allowEmpty,emptyLabel,
   placeholder,width,hidden}. When `hidden` is set, the picked id is mirrored
   into a hidden <input id=hidden> so existing $("#id").value reads keep working.
   ========================================================================= */
const _combos={};
const jsq = s => String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
function tCombo(key,value,onpick,o){
  o=o||{};
  const list=S.testers.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const items=[];
  if(o.allowEmpty!==false) items.push({v:"",l:o.emptyLabel||"—"});
  list.forEach(t=>items.push({v:t.id,l:t.name+(t.country?" ("+t.country+")":"")}));
  _combos[key]={items,onpick:onpick||"",value:String(value||"")};
  const sel=items.find(it=>String(it.v)===String(value||""));
  const w=o.width||"200px";
  const hid=o.hidden?`<input type="hidden" id="${o.hidden}" value="${esc(value||"")}"/>`:"";
  return `<span class="combo" style="width:${w}" data-key="${esc(key)}">${hid}`+
    `<input class="combo-in" autocomplete="off" placeholder="${esc(o.placeholder||"🔍 search tester…")}" value="${esc(sel?sel.l:"")}" `+
    `onfocus="comboOpen('${jsq(key)}',this)" oninput="comboFilter('${jsq(key)}',this)" onkeydown="comboKey('${jsq(key)}',this,event)" onblur="comboBlur('${jsq(key)}')"/>`+
    `<div class="combo-list" id="cl_${esc(key)}"></div></span>`;
}
function comboItems(key,q){ const c=_combos[key]; if(!c)return [];
  q=(q||"").toLowerCase().trim();
  return c.items.filter(it=> q ? (it.v!=="" && it.l.toLowerCase().includes(q)) : true); }
function comboPaint(key,q){ const c=_combos[key],box=document.getElementById("cl_"+key); if(!c||!box)return;
  const list=comboItems(key,q);
  box.innerHTML=list.map(it=>`<div class="combo-opt" onmousedown="comboPick('${jsq(key)}','${jsq(it.v)}')">${esc(it.l)}</div>`).join("")||'<div class="combo-opt muted">no match</div>';
  box.style.display="block"; }
function comboOpen(key,inp){ comboPaint(key,""); if(inp.select)inp.select(); }
function comboFilter(key,inp){ comboPaint(key,inp.value); }
function comboBlur(key){ setTimeout(()=>{
  const b=document.getElementById("cl_"+key); if(b)b.style.display="none";
  const c=_combos[key],wrap=document.querySelector('.combo[data-key="'+key+'"]');
  if(c&&wrap){ const it=c.items.find(x=>String(x.v)===String(c.value))||{l:""}; const inp=wrap.querySelector(".combo-in");
    if(inp&&document.activeElement!==inp) inp.value=it.l; }
},150); }
function comboKey(key,inp,ev){ if(ev.key==="Enter"){ ev.preventDefault(); const l=comboItems(key,inp.value); if(l.length)comboPick(key,l[0].v); }
  else if(ev.key==="Escape"){ const b=document.getElementById("cl_"+key); if(b)b.style.display="none"; } }
function comboPick(key,v){ const c=_combos[key]; if(!c)return; c.value=String(v||"");
  const it=c.items.find(x=>String(x.v)===String(v))||{v:"",l:""};
  const wrap=document.querySelector('.combo[data-key="'+key+'"]');
  if(wrap){ wrap.querySelector(".combo-in").value=it.l; const h=wrap.querySelector('input[type=hidden]'); if(h)h.value=v; }
  const box=document.getElementById("cl_"+key); if(box)box.style.display="none";
  if(c.onpick){ try{ new Function("v",c.onpick)(v); }catch(e){ console.error("combo onpick",e); } } }

/* =========================================================================
   NAVIGATION — 4 tabs
   ========================================================================= */
const TABS = [["dashboard","Dashboard"],["library","Library"],["campaign","Campaign"],["admin","Admin"]];
let currentTab = "dashboard";
function buildNav(){ $("#nav").innerHTML = TABS.map(([id,label])=>
  `<button class="${id===currentTab?'active':''}" onclick="go('${id}')">${label}</button>`).join(""); }
function go(tab){ currentTab=tab; document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("#view-"+tab).classList.add("active"); buildNav(); renderTab(tab); }
function renderAll(){ buildIterSelect(); buildNav(); renderTab(currentTab); }
function renderTab(tab){ buildIterSelect();
  ({dashboard:renderDashboard,library:renderLibrary,campaign:renderCampaign,admin:renderAdmin}[tab]||(()=>{}))(); }
function buildIterSelect(){ $("#iterSelect").innerHTML = S.iterations.map(i=>
  `<option value="${i.id}" ${i.id===S.activeIterationId?'selected':''}>${esc(i.name)}</option>`).join(""); }
function setActiveIteration(id){ S.activeIterationId=id; renderAll(); save(); }

/* modal */
function modal(html){ $("#modalBox").innerHTML=html; $("#modalBg").classList.add("open"); }
function closeModal(){ $("#modalBg").classList.remove("open"); }
$("#modalBg").addEventListener("click",e=>{ if(e.target.id==="modalBg") closeModal(); });

/* aggregation */
function aggregate(execs){
  const a={total:execs.length,byStatus:{},done:0,passed:0,failed:0,blocked:0,notrun:0};
  execs.forEach(e=>{ a.byStatus[e.status]=(a.byStatus[e.status]||0)+1;
    if(e.status==="Passed"){a.passed++;a.done++;} else if(e.status==="Failed"){a.failed++;a.done++;}
    else if(e.status==="Blocked"){a.blocked++;a.done++;} else if(e.status==="N/A"){a.done++;} else a.notrun++; });
  return a;
}
function progressBar(execs){ const a=aggregate(execs); if(!a.total) return '<div class="pbar"></div>';
  const seg=(n,c)=> n? `<span style="width:${n/a.total*100}%;background:${c}"></span>`:"";
  return `<div class="pbar">${seg(a.passed,'#22c55e')}${seg(a.failed,'#ef4444')}${seg(a.blocked,'#f59e0b')}${seg(a.byStatus['N/A']||0,'#475569')}${seg(a.byStatus['In progress']||0,'#a855f7')}</div>`; }

/* =========================================================================
   DASHBOARD
   ========================================================================= */
const DONE_STATUSES=["Passed","Failed","Blocked","N/A"];
function execMatch(e,key){
  if(key==="all") return true;
  if(key==="done") return DONE_STATUSES.includes(e.status);
  if(key==="todo") return !DONE_STATUSES.includes(e.status);
  return e.status===key;
}
function showExecModal(title,ex){
  ex=ex.slice().sort((a,b)=>naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario)));
  const rows=ex.map(e=>{const sm=statusMeta(e.status);return `<tr><td><b>${esc(e.process)}</b>${e.adhoc?' '+badge('ad-hoc','#a855f7'):''}</td><td>${esc(e.scenario)}</td><td>${badge(e.entity,entityMeta(e.entity).color)}</td><td>${esc(testerName(e.testerId))}</td><td>${badge(e.status,sm.color)}</td></tr>`;}).join("")||'<tr><td colspan="5" class="muted">No test case.</td></tr>';
  modal(`<h2>${title} <span class="muted" style="font-size:13px">(${ex.length})</span></h2>
    <div style="max-height:62vh;overflow:auto;margin-top:8px"><table><thead><tr><th>PRC</th><th>Scenario</th><th>Entity</th><th>Tester</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="toolbar" style="margin-top:12px"><div class="spacer"></div><button onclick="closeModal()">Close</button></div>`);
}
function openExecList(key){ const titleMap={all:"All assigned",done:"Executed",todo:"To do",Passed:"Passed",Failed:"Failed",Blocked:"Blocked"};
  showExecModal((titleMap[key]||key)+" — "+esc(activeIter().name), iterExecs().filter(e=>execMatch(e,key))); }
function openProcList(proc){ showExecModal(esc(proc)+" — "+esc(activeIter().name), iterExecs().filter(e=>(e.process||"(none)")===proc)); }
/* ---- SPOC assignment sheets: export a (blank) list, re-import their tester assignments ---- */
function trkFiltered(){ return iterExecs().filter(e=>
  (!trkFilter.entity||e.entity===trkFilter.entity)&&(!trkFilter.tester||e.testerId===trkFilter.tester)&&
  (!trkFilter.status||e.status===trkFilter.status)&&(!trkFilter.process||e.process===trkFilter.process)&&
  (!trkFilter.q||((e.process||"")+" "+(e.scenario||"")).toLowerCase().includes(trkFilter.q.toLowerCase()))); }
function exportAssignments(){
  const iter=activeIter();
  const ex=trkFiltered().sort((a,b)=>naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario)));
  if(!ex.length){ alert("No execution to export (check the tracking filters)."); return; }
  const data=ex.map(e=>({ExecId:e.id,Entity:e.entity,PRC:e.process||"",Scenario:e.scenario||"",Domain:e.domain||"",Tester:(tester(e.testerId)||{}).name||"",DueDate:e.testDate||""}));
  const ws=XLSX.utils.json_to_sheet(data); const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,ws,"Assignments");
  const scope=trkFilter.entity||"all";
  XLSX.writeFile(wb,`MCEU_assignments_${slug(iter.name)}_${scope}_${new Date().toISOString().slice(0,10)}.xlsx`);
}
function genSpocPage(){
  const iter=activeIter();
  const ex=trkFiltered().sort((a,b)=>naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario)));
  if(!ex.length){ alert("No execution to export (check the tracking filters)."); return; }
  const scope=trkFilter.entity||"all";
  const payload={campaign:S.config.campaignName,iteration:iter.name,iterationId:iter.id,scope,
    entities:S.config.entities.map(en=>en.code),
    testerNames:S.testers.map(t=>t.name).filter(Boolean).sort((a,b)=>a.localeCompare(b)),
    rows:ex.map(e=>({id:e.id,process:e.process||"",scenario:e.scenario||"",entity:e.entity||"",domain:e.domain||"",tester:(tester(e.testerId)||{}).name||"",due:e.testDate||"",
      steps:(e.steps&&e.steps.length?e.steps:((libById(e.libraryItemId)||{}).steps||[]))}))};
  download(`MCEU_SPOC_${slug(iter.name)}_${scope}.html`, buildSpocHTML(payload), "text/html");
}
function buildSpocHTML(payload){
  const dataJson=JSON.stringify(payload).replace(/</g,"\\u003c");
  return `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>SPOC — ${esc(payload.scope)} — ${esc(payload.iteration)}</title>
<style>
body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:#0f172a;color:#e2e8f0;font-size:14px}

<script>
const DATA=${dataJson};
const LSK="mceu_spoc_"+DATA.iterationId+"_"+DATA.scope;
let lang=(function(){try{return localStorage.getItem("mceu_spoc_lang")||"fr";}catch(e){return "fr";}})();
const I18N={fr:{title:"Feuille d'assignation SPOC",intro:"Identifie ton entité (en haut), puis affecte un ou plusieurs testeurs (séparés par ;) à chaque test. Déplie un test (▸ étapes) pour voir les étapes. Tu peux dupliquer un test (⧉) pour le rejouer/l'assigner à plusieurs, et retirer un scénario non pertinent (✕). Clique Enregistrer puis renvoie le .json au coordinateur.",hP:"PRC",hS:"Scénario",hE:"Entité",hT:"Testeur(s)",hD:"Date d'échéance",testerPh:"nom(s), séparés par ;",duePh:"ex. 2026-07-01",save:"⬇ Enregistrer (JSON)",saved:"enregistré ✓",assigned:"assignés",dup:"Dupliquer (rejouer / autre testeur)",delCopy:"Retirer cette copie",remove:"Marquer non pertinent (sera retiré)",restore:"Rétablir",copyTag:"copie",removedTag:"retiré",stepsN:"étapes ({n})",stepsFollow:"Étapes à suivre :",myEnt:"Mon entité :"},en:{title:"SPOC assignment sheet",intro:"Identify your entity (top), then assign one or more testers (separated by ;) to each test. Expand a test (▸ steps) to view the steps. You can duplicate a test (⧉) to replay/assign it to several people, and remove a non-relevant scenario (✕). Click Save and send the .json back to the coordinator.",hP:"PRC",hS:"Scenario",hE:"Entity",hT:"Tester(s)",hD:"Due date",testerPh:"name(s), separated by ;",duePh:"e.g. 2026-07-01",save:"⬇ Save (JSON)",saved:"saved ✓",assigned:"assigned",dup:"Duplicate (replay / another tester)",delCopy:"Remove this copy",remove:"Mark not relevant (will be removed)",restore:"Restore",copyTag:"copy",removedTag:"removed",stepsN:"steps ({n})",stepsFollow:"Steps to follow:",myEnt:"My entity:"}};
function T(k,n){var v=(I18N[lang]||I18N.fr)[k]||k;return n==null?v:v.replace("{n}",n);}
function setLang(l){lang=l;try{localStorage.setItem("mceu_spoc_lang",l);}catch(e){}applyLang();render();}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
let rows=[], expanded={}, myEnt="";
function setMyEnt(v){myEnt=v;try{localStorage.setItem("mceu_spoc_ent_"+DATA.iterationId,v);}catch(e){}}
function applyLang(){["ttl|title","intro|intro","hP|hP","hS|hS","hE|hE","hT|hT","hD|hD","btnSave|save","lblEnt|myEnt"].forEach(function(p){var a=p.split("|");document.getElementById(a[0]).textContent=T(a[1]);});document.getElementById("langSel").value=lang;}
function render(){
  var tb=document.getElementById("tb"); tb.innerHTML="";
  var q=(document.getElementById("q").value||"").toLowerCase().trim(); var shown=0;
  rows.forEach(function(r,i){ if(q&&!((r.process+" "+r.scenario+" "+r.entity).toLowerCase().indexOf(q)>=0)) return; shown++;
    var tr=document.createElement("tr"); if(r.removed) tr.className="removed";
    var nSteps=(r.steps&&r.steps.length)||0;
    var badges=(r.isDup?' <span class="badge" style="background:#a855f733;color:#c4b5fd">'+esc(T("copyTag"))+'</span>':'')+(r.removed?' <span class="badge" style="background:#ef444433;color:#fca5a5">'+esc(T("removedTag"))+'</span>':'');
    var stepTog=nSteps?' <span class="steptoggle">'+(expanded[r.id]?'▾':'▸')+' '+esc(T("stepsN",nSteps))+'</span>':'';
    var entOpts=DATA.entities.slice(); if(r.entity&&entOpts.indexOf(r.entity)<0)entOpts.push(r.entity);
    var entSel='<select class="ein">'+entOpts.map(function(c){return '<option'+(c===r.entity?' selected':'')+'>'+esc(c)+'</option>';}).join("")+'</select>';
    tr.innerHTML='<td class="pcell"><b>'+esc(r.process)+'</b>'+badges+stepTog+'</td><td class="pcell scen"'+(nSteps?' style="cursor:pointer" title="'+esc(T("stepsFollow"))+'"':'')+'>'+esc(r.scenario)+(nSteps?' <span class="steptoggle">'+(expanded[r.id]?'▾':'▸')+'</span>':'')+'</td><td>'+entSel+'</td>'+
      '<td><input class="tin" list="dl" value="'+esc(r.tester)+'" placeholder="'+esc(T("testerPh"))+'"'+(r.removed?' disabled':'')+'/></td>'+
      '<td><input class="din" value="'+esc(r.due)+'" placeholder="'+esc(T("duePh"))+'"'+(r.removed?' disabled':'')+'/></td>'+
      '<td style="white-space:nowrap"><button class="dupb" title="'+esc(T("dup"))+'" style="padding:4px 9px">⧉</button> <button class="remb" title="'+esc(r.isDup?T("delCopy"):(r.removed?T("restore"):T("remove")))+'" style="padding:4px 9px;background:'+(r.removed?'#22c55e':'#ef4444')+';color:#fff">'+(r.removed?'↺':'✕')+'</button></td>';
    var tin=tr.querySelector(".tin"); if(tin) tin.addEventListener("input",function(){rows[i].tester=this.value;autosave();updateProg();});
    var din=tr.querySelector(".din"); if(din) din.addEventListener("input",function(){rows[i].due=this.value;autosave();});
    tr.querySelector(".ein").addEventListener("change",function(){rows[i].entity=this.value;autosave();});
    if(nSteps){ var togFn=function(){expanded[r.id]=!expanded[r.id];render();};
      var st=tr.querySelector(".pcell .steptoggle"); if(st) st.addEventListener("click",togFn);
      var sc=tr.querySelector(".scen"); if(sc) sc.addEventListener("click",togFn); }
    tr.querySelector(".dupb").addEventListener("click",function(){dupRow(i);});
    tr.querySelector(".remb").addEventListener("click",function(){removeRow(i);});
    tb.appendChild(tr);
    if(nSteps&&expanded[r.id]){ var sr2=document.createElement("tr"); sr2.className="steprow";
      sr2.innerHTML='<td></td><td colspan="5"><div class="muted" style="font-size:12px;margin-bottom:2px">'+esc(T("stepsFollow"))+'</div><ol class="steps">'+r.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join("")+'</ol></td>';
      tb.appendChild(sr2); }
  });
  document.getElementById("cnt").textContent=q?(shown+" / "+rows.length):""; updateProg();
}
function updateProg(){var act=rows.filter(function(r){return !r.removed;});var done=act.filter(function(r){return (r.tester||"").trim();}).length;document.getElementById("prog").textContent=done+" / "+act.length+" "+T("assigned");}
function dupRow(i){ var r=rows[i]; var nr=Object.assign({},r,{id:"spoc"+Math.random().toString(36).slice(2,9),srcId:r.srcId||r.id,tester:"",isDup:true,removed:false,entity:myEnt||r.entity}); rows.splice(i+1,0,nr); autosave(); render(); }
function removeRow(i){ var r=rows[i]; if(!r)return; if(r.isDup){ rows.splice(i,1); } else { r.removed=!r.removed; } autosave(); render(); }
function exportPayload(){return {_type:"MCEU_SPOC_ASSIGNMENTS",iterationId:DATA.iterationId,scope:DATA.scope,rows:rows.map(function(r){return {ExecId:r.id,srcId:r.srcId||"",process:r.process,scenario:r.scenario,entity:r.entity,domain:r.domain,Tester:r.tester||"",DueDate:r.due||"",Remove:r.removed?true:false};})};}
function autosave(){try{localStorage.setItem(LSK,JSON.stringify({rows:rows}));var m=document.getElementById("savedMsg");m.textContent=T("saved");setTimeout(function(){m.textContent="";},1200);}catch(e){}}
function saveJSON(){var b=new Blob([JSON.stringify(exportPayload(),null,2)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="assignments_"+DATA.scope+"_"+DATA.iteration.replace(/\\W+/g,'_')+".json";a.click();}
function init(){
  var saved=(function(){try{return JSON.parse(localStorage.getItem(LSK)||"null");}catch(e){return null;}})();
  var sr=(saved&&saved.rows)||[];
  rows = sr.length ? sr.slice() : DATA.rows.map(function(r){return Object.assign({},r);});
  if(sr.length){ DATA.rows.forEach(function(r){ if(!rows.some(function(x){return x.id===r.id;})) rows.push(Object.assign({},r)); }); }
  var savedEnt=null; try{savedEnt=localStorage.getItem("mceu_spoc_ent_"+DATA.iterationId);}catch(e){}
  myEnt = savedEnt || (DATA.entities.indexOf(DATA.scope)>=0?DATA.scope:(DATA.entities[0]||""));
  document.getElementById("myEnt").innerHTML=DATA.entities.map(function(c){return '<option'+(c===myEnt?' selected':'')+'>'+esc(c)+'</option>';}).join("");
  document.getElementById("dl").innerHTML=DATA.testerNames.map(function(n){return '<option value="'+esc(n)+'"></option>';}).join("");
  document.getElementById("hdr").textContent=DATA.campaign+" · "+DATA.iteration+" · "+DATA.scope;
  applyLang(); render();
}
init();
<\/script></body></html>`;
}
function applyAssignments(rows){
  let upd=0,newT=0,miss=0,cloned=0,created=0,removedN=0;
  const findTester=nm=>{ let t=S.testers.find(x=>x.name===nm); if(!t){t={id:uid(),name:nm,email:"",country:"",dept:""};S.testers.push(t);newT++;} return t.id; };
  const isRem=r=>r.Remove===true||r.Remove==="true"||r.Remove==="yes";
  rows.slice().sort((a,b)=>(isRem(a)?1:0)-(isRem(b)?1:0)).forEach(r=>{
    const id=String(r.ExecId||"").trim();
    let e=id?S.executions.find(x=>x.id===id):null;
    if(r.Remove===true||r.Remove==="true"||r.Remove==="yes"){ if(e){ S.executions=S.executions.filter(x=>x.id!==e.id); removedN++; } return; }
    if(!e){
      // a SPOC-duplicated / new row → create an execution (cloned from its source when known)
      const proc=String(r.process||r.PRC||"").trim(), scen=String(r.scenario||r.Scenario||"").trim();
      let src=r.srcId?S.executions.find(x=>x.id===String(r.srcId)):null;
      if(!src&&(proc||scen)) src=S.executions.find(x=>x.process===proc&&x.scenario===scen);
      if(!proc&&!scen&&!src){ miss++; return; }
      const ent=String(r.entity||r.Entity||(src&&src.entity)||"").trim();
      const dom=String(r.domain||r.Domain||(src&&src.domain)||"").trim();
      e=src?Object.assign({},src,{id:id||uid(),testerId:"",status:"Not started",comment:"",txnRefValue:"",failedSteps:{},screens:[],testDate:"",updatedAt:new Date().toISOString()})
            :{id:id||uid(),iterationId:activeIter().id,libraryItemId:null,process:proc,scenario:scen,domain:dom,steps:[],txnRef:false,txnRefValue:"",entity:ent,testerId:"",status:"Not started",comment:"",recurrence:"",testDate:"",failedSteps:{},screens:[],adhoc:false,updatedAt:new Date().toISOString()};
      S.executions.push(e); created++;
    }
    const entv=String(r.entity||r.Entity||"").trim(); if(entv) e.entity=entv;
    const due=("DueDate" in r)?String(r.DueDate||"").trim():null;
    if("Tester" in r){
      const ids=String(r.Tester||"").split(/[;,]/).map(x=>x.trim()).filter(Boolean).map(findTester);
      if(!ids.length){ e.testerId=""; }
      else { e.testerId=ids[0];
        for(let i=1;i<ids.length;i++){ const tid2=ids[i];
          if(S.executions.some(x=>x.iterationId===e.iterationId&&x.entity===e.entity&&x.process===e.process&&x.scenario===e.scenario&&x.testerId===tid2)) continue;
          const c=Object.assign({},e,{id:uid(),testerId:tid2,status:"Not started",comment:"",txnRefValue:"",failedSteps:{},screens:[],updatedAt:new Date().toISOString()});
          if(due!=null) c.testDate=due; S.executions.push(c); cloned++;
        }
      }
    }
    if(due!=null) e.testDate=due; e.updatedAt=new Date().toISOString(); upd++;
  });
  return {upd,newT,miss,cloned,created,removedN};
}
function importAssignmentsAny(input){ const f=input.files[0]; if(!f)return; if(/\.json$/i.test(f.name)) importSpocJSON(input); else importAssignments(input); }
function importAssignments(input){
  const f=input.files[0]; if(!f)return; const reader=new FileReader();
  reader.onload=ev=>{ const wb=XLSX.read(ev.target.result,{type:"array"}); const rows=[];
    wb.SheetNames.forEach(sn=>{ XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:""}).forEach(r=>rows.push(r)); });
    const res=applyAssignments(rows); renderAll(); save();
    alert(`Assignments imported: ${res.upd} updated, ${res.created} new (duplicated), ${res.cloned} multi-tester, ${res.newT} new tester(s), ${res.removedN} removed`+(res.miss?`, ${res.miss} skipped`:``)+`.`);
  };
  reader.readAsArrayBuffer(f);
}
function importSpocJSON(input){
  const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=e=>{ try{ const p=JSON.parse(e.target.result); if(p._type!=="MCEU_SPOC_ASSIGNMENTS"){ alert("Not a SPOC assignment file."); return; }
    const res=applyAssignments(p.rows||[]); renderAll(); save();
    alert(`SPOC assignments imported: ${res.upd} updated, ${res.created} new (duplicated), ${res.cloned} multi-tester, ${res.newT} new tester(s), ${res.removedN} removed`+(res.miss?`, ${res.miss} skipped`:``)+`.`);
  }catch(err){ alert("Invalid file."); } };
  r.readAsText(f);
}
function renderDashboard(){
  const iter=activeIter(); const ex=iterExecs(); const a=aggregate(ex);
  const pct=n=>a.total?Math.round(n/a.total*100):0;
  const kpi=(n,l,c,key)=>`<div class="kpi" ${key?`style="cursor:pointer" title="Click to list these test cases" onclick="openExecList('${key}')"`:''}><div class="n" style="color:${c||'inherit'}">${n}</div><div class="l">${l}</div></div>`;
  const byEntity=S.config.entities.map(en=>({en,sub:ex.filter(e=>e.entity===en.code)}));
  const byTester={}; ex.forEach(e=>{(byTester[e.testerId]=byTester[e.testerId]||[]).push(e);});
  const byDomain={}; ex.forEach(e=>{const d=e.domain||"(none)";(byDomain[d]=byDomain[d]||[]).push(e);});
  const byProc={}; ex.forEach(e=>{const p=e.process||"(none)";(byProc[p]=byProc[p]||[]).push(e);});

  $("#view-dashboard").innerHTML=`
    <h2>Dashboard — ${esc(iter?iter.name:"—")}</h2>
    <p class="sub">${esc(S.config.campaignName)} · live progress for the active iteration.</p>
    <div class="cards">
      ${kpi(a.total,"Assigned",null,'all')}${kpi(a.done+" ("+pct(a.done)+"%)","Executed",'#38bdf8','done')}
      ${kpi(a.passed,"Passed",'#22c55e','Passed')}${kpi(a.failed,"Failed",'#ef4444','Failed')}
      ${kpi(a.blocked,"Blocked",'#f59e0b','Blocked')}${kpi(a.notrun,"To do",'#94a3b8','todo')}
    </div>
    <div class="card"><b>Overall progress</b>${progressBar(ex)}
      <div class="legend"><span><i style="background:#22c55e"></i>Passed</span><span><i style="background:#ef4444"></i>Failed</span><span><i style="background:#f59e0b"></i>Blocked</span><span><i style="background:#a855f7"></i>In progress</span><span><i style="background:#475569"></i>N/A</span></div>
    </div>
    <div class="split">
      <div class="card"><b>By entity</b>
        <table><thead><tr><th>Entity</th><th>Assigned</th><th>Progress</th><th>P/F/B</th></tr></thead><tbody>
        ${byEntity.map(({en,sub})=>{const sa=aggregate(sub);return `<tr><td>${badge(en.code,en.color)} ${esc(en.label)}</td><td>${sub.length}</td><td style="min-width:140px">${progressBar(sub)}</td><td><span style="color:#22c55e">${sa.passed}</span>/<span style="color:#ef4444">${sa.failed}</span>/<span style="color:#f59e0b">${sa.blocked}</span></td></tr>`;}).join("")}
        </tbody></table>
      </div>
      <div class="card"><b>By tester</b>
        <table><thead><tr><th>Tester</th><th>Country</th><th>Assigned</th><th>Progress</th></tr></thead><tbody>
        ${Object.keys(byTester).map(tid=>{const sub=byTester[tid];const t=tester(tid);return `<tr><td>${esc(testerName(tid))}</td><td>${t&&t.country?badge(t.country,entityMeta(t.country).color):'<span class="muted">—</span>'}</td><td>${sub.length}</td><td style="min-width:140px">${progressBar(sub)}</td></tr>`;}).join("")||'<tr><td colspan="4" class="muted">No assignment</td></tr>'}
        </tbody></table>
      </div>
    </div>
    <div class="card"><b>By business domain</b>
      <table><thead><tr><th>Domain</th><th>Assigned</th><th>Progress</th><th>Failed</th></tr></thead><tbody>
      ${Object.keys(byDomain).sort().map(d=>{const sub=byDomain[d];const sa=aggregate(sub);return `<tr><td>${esc(d)}</td><td>${sub.length}</td><td style="min-width:160px">${progressBar(sub)}</td><td>${sa.failed?badge(sa.failed+" failed",'#ef4444'):'<span class="muted">0</span>'}</td></tr>`;}).join("")||'<tr><td colspan="4" class="muted">Import the library and build a campaign to see numbers.</td></tr>'}
      </tbody></table>
    </div>
    <div class="card"><b>By process (PRC)</b> <span class="muted" style="font-size:12px">— click a row to list its test cases</span>
      <table><thead><tr><th>PRC</th><th>Assigned</th><th>Progress</th><th>P/F/B</th></tr></thead><tbody>
      ${Object.keys(byProc).sort((x,y)=>naturalKey(x).localeCompare(naturalKey(y))).map(p=>{const sub=byProc[p];const sa=aggregate(sub);return `<tr style="cursor:pointer" title="Click to list" onclick="openProcList('${jsq(p)}')"><td><b>${esc(p)}</b></td><td>${sub.length}</td><td style="min-width:160px">${progressBar(sub)}</td><td><span style="color:#22c55e">${sa.passed}</span>/<span style="color:#ef4444">${sa.failed}</span>/<span style="color:#f59e0b">${sa.blocked}</span></td></tr>`;}).join("")||'<tr><td colspan="4" class="muted">No execution yet.</td></tr>'}
      </tbody></table>
    </div>`;
}

/* =========================================================================
   LIBRARY — reusable PRC x Scenario definitions
   ========================================================================= */
let libFilter={q:"",domain:"",process:""};
let libExpanded=new Set();
function toggleLibSteps(id){ id=String(id); if(libExpanded.has(id))libExpanded.delete(id); else libExpanded.add(id); renderLibrary(); }
function sortedLib(list){ return list.slice().sort((a,b)=>(a.order||0)-(b.order||0)||naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario))); }
function renderLibrary(){
  const domains=[...new Set(S.library.map(c=>c.domain))].filter(Boolean).sort();
  const procs=[...new Set(S.library.filter(c=>!libFilter.domain||c.domain===libFilter.domain).map(c=>c.process))].sort();
  let rows=S.library.filter(c=>
    (!libFilter.domain||c.domain===libFilter.domain)&&(!libFilter.process||c.process===libFilter.process)&&
    (!libFilter.q||((c.process||"")+" "+(c.scenario||"")).toLowerCase().includes(libFilter.q.toLowerCase())));
  rows=sortedLib(rows);

  $("#view-library").innerHTML=`
    <h2>Library</h2>
    <p class="sub">${S.library.length} reusable test definitions — deduplicated from the DevOps export on the <b>(PRC × Scenario)</b> combo (col H × col I). Edit, clone and reorder freely. This is the source of truth, independent from campaigns.</p>
    ${S.library.length===0?`<div class="card empty">No library yet.<div style="margin-top:12px"><label class="pill" style="cursor:pointer">⬆ Import DevOps .xlsx<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importDevops(this)"/></label> &nbsp; <button onclick="newLibItem()">+ New definition</button></div><p class="hint" style="margin-top:8px">Default sheet: <code>LUX</code> · change mapping in Admin.</p></div>`:`
    <div class="toolbar stickyhead">
      <input placeholder="🔍 search PRC / scenario…" value="${esc(libFilter.q)}" oninput="libFilter.q=this.value;renderLibrary()" style="min-width:240px"/>
      <select onchange="libFilter.domain=this.value;libFilter.process='';renderLibrary()"><option value="">All domains</option>${domains.map(d=>`<option ${libFilter.domain===d?'selected':''}>${esc(d)}</option>`).join("")}</select>
      <select onchange="libFilter.process=this.value;renderLibrary()"><option value="">All PRC</option>${procs.map(p=>`<option ${libFilter.process===p?'selected':''}>${esc(p)}</option>`).join("")}</select>
      <div class="spacer"></div><span class="muted">${rows.length} shown</span>
      <button class="sm" onclick="resetLibOrder()">↕ Reset order</button>

/* import xlsx -> upsert library on (process,scenario); reads optional Steps / TxnRef columns */
function importDevops(input){
  const file=input.files[0]; if(!file)return;
  const sheetName=($("#impSheet")&&$("#impSheet").value)||"LUX";
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array"});
    const sn=wb.SheetNames.includes(sheetName)?sheetName:wb.SheetNames[0];
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:""});
    const m=S.config.columnMapping;
    const hasSteps=rows.length&&("Steps" in rows[0]);
    const hasTxn=rows.length&&("TxnRef" in rows[0]);
    const byKey=new Map(S.library.map(c=>[c.process+"||"+c.scenario,c]));
    let maxO=S.library.reduce((mm,c)=>Math.max(mm,c.order||0),0);
    let added=0,updated=0,newTesters=0,stepsSet=0; const seen=new Set();
    rows.forEach(r=>{
      const process=(r[m.process]||"").toString().trim();
      const scenario=(r[m.scenario]||"").toString().trim();
      if(!process&&!scenario) return;
      const key=process+"||"+scenario;
      const tnames=String(r[m.tester]||"").split(/[;,]/).map(x=>x.trim()).filter(Boolean);
      const tIds=tnames.map(nm=>{ let t=S.testers.find(x=>x.name===nm); if(!t){t={id:uid(),name:nm,email:"",country:"",dept:""};S.testers.push(t);newTesters++;} return t.id; });
      const steps=hasSteps?String(r.Steps||"").split(/\r?\n/).map(x=>x.trim()).filter(Boolean):null;
      const txn=hasTxn?/^(y|yes|true|1|x|oui)$/i.test(String(r.TxnRef||"").trim()):null;
      const domain=(r[m.domain]||"").toString().trim();
      let c=byKey.get(key);
      if(c){
        if(!seen.has(key)){ updated++; seen.add(key); }
        if(domain) c.domain=domain;
        c.defaultTesterIds=c.defaultTesterIds||[]; tIds.forEach(id=>{ if(!c.defaultTesterIds.includes(id)) c.defaultTesterIds.push(id); });
        if(steps!==null){ c.steps=steps; if(steps.length)stepsSet++; }
        if(txn!==null) c.txnRef=txn;
      } else {
        c={id:uid(),order:++maxO,domain,process,scenario,defaultTesterIds:tIds,notes:"",steps:steps||[],txnRef:txn||false};
        S.library.push(c); byKey.set(key,c); seen.add(key); added++; if(steps&&steps.length)stepsSet++;
      }
    });
    let n=0; sortedLib(S.library).forEach(c=>c.order=++n);
    save(); go("library");
    alert(`Import (sheet "${sn}"): ${added} new, ${updated} updated`+(hasSteps?`, steps set on ${stepsSet}`:``)+`, ${newTesters} tester(s) created. Library total: ${S.library.length}.`);
  };
  reader.readAsArrayBuffer(file);
}

function renderLoadPanel(){

  return `<p class="hint">Pick a full or partial set of the Library, choose target entities, then add to <b>${esc(activeIter().name)}</b>. By default each test case is dispatched to <b>its assigned testers × each entity</b>. Pick a single tester below to override and assign everything to that one tester. Duplicates are skipped.</p>

function loadIntoIteration(){
  const ents=[...document.querySelectorAll(".ldEnt:checked")].map(x=>x.value);
  if(!ents.length){ alert("Select at least one target entity."); return; }
  const formTester=$("#ldTester").value, rec=$("#ldRec").value, iterId=S.activeIterationId;
  const target=S.library.filter(c=>(!loadSel.domain||c.domain===loadSel.domain)&&(!loadSel.process||c.process===loadSel.process));
  let created=0;
  target.forEach(c=>ents.forEach(ent=>{
    const testerIds = formTester ? [formTester] : (libTesterIds(c).length?libTesterIds(c):[""]);
    testerIds.forEach(testerId=>{
      if(S.executions.some(e=>e.iterationId===iterId&&e.libraryItemId===c.id&&e.entity===ent&&(e.testerId||"")===(testerId||""))) return;
      S.executions.push({id:uid(),iterationId:iterId,libraryItemId:c.id,process:c.process,scenario:c.scenario,domain:c.domain,
        steps:(c.steps||[]).slice(),txnRef:!!c.txnRef,txnRefValue:"",entity:ent,testerId,status:"Not started",comment:"",recurrence:rec||"",testDate:"",adhoc:false,updatedAt:new Date().toISOString()});
      created++;
    });
  }));
  persist(); alert(created+" execution(s) added to "+activeIter().name+".");
}
function renderTrackingTable(){
  let ex=iterExecs().filter(e=>

    ${pageEx.map(e=>{const sm=statusMeta(e.status);const need=sm.requiresComment&&!e.comment;return `<tr>
      <td><input type="checkbox" class="trkchk" ${trkSel.has(e.id)?'checked':''} onchange="toggleTrkSel('${e.id}',this.checked)"></td>

      <td><textarea style="min-height:36px;${need?'border-color:#ef4444':''}" placeholder="${sm.requiresComment?'required…':'optional'}" oninput="setExec('${e.id}','comment',this.value)">${esc(e.comment)}</textarea>${need?'<div class="hint" style="color:#ef4444">required</div>':''}</td>

}
function openEvidence(id){ const e=S.executions.find(x=>x.id===id); if(!e)return;
  const steps=e.steps||[]; const fs=e.failedSteps||{};
  const flagged=Object.keys(fs).filter(k=>fs[k]).map(k=>steps[k]||("step "+(parseInt(k)+1))).filter(Boolean);
  const shots=(e.screens||[]).map(sc=>`<a href="${sc.data}" target="_blank" title="${esc(sc.name||'')}"><img src="${sc.data}" style="max-height:160px;border:1px solid var(--line);border-radius:8px"/></a>`).join(" ");
  modal(`<h2>Evidence — ${esc(e.process)}</h2>
    <p class="hint">${esc(e.scenario)} · ${badge(e.entity,entityMeta(e.entity).color)} · ${esc(testerName(e.testerId))} · ${badge(e.status,statusMeta(e.status).color)}</p>
    <div class="field"><label>Problematic step(s)</label>${flagged.length?`<ol class="steplist">${flagged.map(s=>`<li>${esc(s)}</li>`).join("")}</ol>`:'<span class="muted">none flagged</span>'}</div>
    <div class="field" style="margin-top:8px"><label>Screenshots (${(e.screens||[]).length})</label><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:4px">${shots||'<span class="muted">none</span>'}</div></div>
    <div class="toolbar" style="margin-top:12px"><div class="spacer"></div><button onclick="closeModal()">Close</button></div>`);
}
function setExec(id,field,val){ const e=S.executions.find(x=>x.id===id); if(!e)return;
  e[field]=val; e.updatedAt=new Date().toISOString();
  if(field==="comment"||field==="scenario"){ save(); return; }   // don't re-render on each keystroke
  persist(); }
function delExec(id){ S.executions=S.executions.filter(x=>x.id!==id); persist(); }
function delTester(i){ const t=S.testers[i];
  if((S.executions.some(e=>e.testerId===t.id)||S.library.some(c=>libTesterIds(c).includes(t.id)))&&!confirm("This tester is referenced. Remove anyway?"))return;
  S.testers.splice(i,1); persist(); }

/* iterations */
function newIter(){ const name=prompt("Iteration name:","UAT "+(S.iterations.length+1)); if(!name)return;
  const it={id:uid(),name,startDate:"",endDate:""}; S.iterations.push(it); S.activeIterationId=it.id; renderAll(); save(); }
function editIter(id){ const it=S.iterations.find(x=>x.id===id);
  modal(`<h2>Edit iteration</h2><div class="field"><label>Name</label><input id="it_name" value="${esc(it.name)}"/></div>
    <div class="row" style="margin-top:10px"><div class="field"><label>Start</label><input type="date" id="it_start" value="${esc(it.startDate)}"/></div><div class="field"><label>End</label><input type="date" id="it_end" value="${esc(it.endDate)}"/></div></div>
    <div class="toolbar" style="margin-top:14px"><div class="spacer"></div><button onclick="closeModal()">Cancel</button><button class="primary" onclick="saveIter('${id}')">Save</button></div>`); }
function saveIter(id){ const it=S.iterations.find(x=>x.id===id); it.name=$("#it_name").value;it.startDate=$("#it_start").value;it.endDate=$("#it_end").value; closeModal(); renderAll(); save(); }
function delIter(id){ if(!confirm("Delete this iteration and its executions?"))return; S.iterations=S.iterations.filter(x=>x.id!==id); S.executions=S.executions.filter(e=>e.iterationId!==id); if(S.activeIterationId===id)S.activeIterationId=S.iterations[0].id; renderAll(); save(); }
function carryOver(){ const from=activeIter(); const name=prompt("New iteration name:","UAT "+(S.iterations.length+1)); if(!name)return;
  const it={id:uid(),name,startDate:"",endDate:""}; S.iterations.push(it);
  const src=S.executions.filter(e=>e.iterationId===from.id&&["Failed","Blocked","Not started"].includes(e.status));
  src.forEach(e=>S.executions.push({...e,id:uid(),iterationId:it.id,status:"Not started",comment:"",testDate:"",txnRefValue:"",failedSteps:{},screens:[],updatedAt:new Date().toISOString()}));
  S.activeIterationId=it.id; renderAll(); save(); alert(src.length+" test(s) carried over to "+name+"."); }

/* extract the testers assigned in the current iteration, ready to paste into Outlook */
function openTesterList(){
  const ids=[...new Set(iterExecs().map(e=>e.testerId).filter(Boolean))];
  const ts=ids.map(id=>tester(id)).filter(Boolean).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  if(!ts.length){ alert("No tester assigned in this iteration yet."); return; }
  const names=ts.map(t=>t.name).join("; ");
  const emails=ts.map(t=>t.email).filter(Boolean).join("; ");
  const noMail=ts.filter(t=>!t.email).map(t=>t.name);
  modal(`<h2>Testers in ${esc(activeIter().name)}</h2>
    <p class="hint">${ts.length} tester(s) assigned in this iteration. Click a box to select all, or use the copy buttons, then paste into Outlook.</p>

    <div class="toolbar" style="margin-top:10px"><div class="spacer"></div><button onclick="closeModal()">Close</button></div>`);
}
function copyFrom(id){ const el=$("#"+id); if(!el)return; el.focus(); el.select();
  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(el.value); } else { document.execCommand("copy"); } }
  catch(e){ try{ document.execCommand("copy"); }catch(_){} } }
function openGenTester(){
  modal(`<h2>Generate tester sheet(s)</h2>
    <p class="hint">Standalone HTML for <b>${esc(activeIter().name)}</b>. The tester fills statuses / comments / evidence and sends back the JSON (only their own selection). Import it via "Import tester results".</p>
    <div class="row">
      <div class="field" style="flex:1"><label>Single tester</label>${tCombo('gtTester',(S.testers[0]||{}).id||'',"",{hidden:'gtTester',allowEmpty:false,width:'100%'})}</div>
      <div class="field"><label>Entity filter (optional)</label><select id="gtEntity"><option value="">— all —</option>${S.config.entities.map(en=>`<option>${esc(en.code)}</option>`).join("")}</select></div>
    </div>

}
function slug(s){ return String(s||"").replace(/\W+/g,'_'); }
function execToTest(e){ return {id:e.id,process:e.process,scenario:e.scenario,entity:e.entity,status:e.status,comment:e.comment||"",testDate:e.testDate||"",
  txnRef:(e.txnRef!=null?!!e.txnRef:!!((libById(e.libraryItemId)||{}).txnRef)),txnRefValue:e.txnRefValue||"",
  failedSteps:e.failedSteps||{},screens:e.screens||[],
  steps:(e.steps&&e.steps.length?e.steps:((libById(e.libraryItemId)||{}).steps||[])).slice()}; }
function basePayload(iter,testers){ return {campaign:S.config.campaignName,iteration:iter.name,iterationId:iter.id,
  entities:S.config.entities.map(x=>x.code),statuses:S.config.statuses,links:(S.config.links||[]).filter(l=>l&&(l.label||l.url)),testers}; }
function genTesterPage(){
  const testerId=$("#gtTester").value, entFilter=$("#gtEntity").value, iter=activeIter();
  const t=tester(testerId)||{name:"Tester"};
  const tests=S.executions.filter(e=>e.iterationId===iter.id&&e.testerId===testerId&&(!entFilter||e.entity===entFilter))
    .sort((a,b)=>naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario))).map(execToTest);
  if(!tests.length){ alert("No test assigned to this tester for this iteration/entity."); return; }
  download(`UAT_${slug(iter.name)}_${slug(t.name)}.html`, buildTesterHTML(basePayload(iter,[{id:testerId,name:t.name,tests}])), "text/html");
  closeModal();
}
function genAllTesterPages(){
  const iter=activeIter();
  const ids=[...new Set(S.executions.filter(e=>e.iterationId===iter.id&&e.testerId).map(e=>e.testerId))];
  const testers=ids.map(id=>({id,name:(tester(id)||{}).name||"(unknown)",
      tests:S.executions.filter(e=>e.iterationId===iter.id&&e.testerId===id).sort((a,b)=>naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario))).map(execToTest)}))
    .filter(x=>x.tests.length).sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  if(!testers.length){ alert("No assignment in this iteration yet."); return; }
  download(`UAT_${slug(iter.name)}_ALL_testers.html`, buildTesterHTML(basePayload(iter,testers)), "text/html");
  closeModal();
}

function buildProcFilter(){const procs=[...new Set(rows.map(t=>t.process).filter(Boolean))].sort();
  const fb=document.getElementById("filterBar"), pf=document.getElementById("procFilter");
  if(procs.length>1){ pf.innerHTML='<option value="">'+esc(T("allProc",procs.length))+'</option>'+procs.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join(""); fb.style.display="flex"; }
  else { pf.innerHTML='<option value="">'+esc(T("allShort"))+'</option>'; fb.style.display="none"; }}
function loadTester(id){ curId=id; const tt=DATA.testers.find(x=>x.id===id); const hdr=document.getElementById("hdr");
  if(!tt){ rows=[];adhoc=[]; hdr.textContent=DATA.campaign+" · "+DATA.iteration; buildProcFilter(); render(); return; }
  hdr.textContent=DATA.campaign+" · "+DATA.iteration+" · "+tt.name;
  const saved=JSON.parse(localStorage.getItem(lsk(id))||"null");
  rows=tt.tests.map(t=>{const s=saved&&saved.results&&saved.results.find(r=>r.id===t.id);
    return Object.assign({},t,{status:s?s.status:t.status,comment:s?s.comment:t.comment,txnRefValue:(s&&s.txnRefValue)||t.txnRefValue||"",failedSteps:(s&&s.failedSteps)||t.failedSteps||{},screens:(s&&s.screens)||t.screens||[]});});
  adhoc=(saved&&saved.adhoc)||[];
  buildProcFilter(); render(); }
function sk(t){ return sortField==="process"?nat((t.process||"")+" "+(t.scenario||"")):(t.testDate||""); }
function sortBy(f){ if(sortField===f){ sortDir=sortDir===1?-1:0; if(!sortDir)sortField=""; } else { sortField=f; sortDir=1; } render(); }
function toggleSteps(id){ if(expanded.has(id))expanded.delete(id); else expanded.add(id); render(); }
function render(){
  const tb=document.getElementById("tb"); tb.innerHTML="";
  const pf=document.getElementById("procFilter"); const f=pf?pf.value:"";
  let shown=0; const list=[];
  rows.forEach((t,i)=>{ if(!f||t.process===f){ list.push({t,i,isAd:false}); shown++; } });
  adhoc.forEach((t,i)=>list.push({t,i,isAd:true}));
  if(sortField){ const df=sortField==="testDate"; list.sort((a,b)=>{ let ka=sk(a.t),kb=sk(b.t);
    if(df){ if(!ka&&!kb)return 0; if(!ka)return 1; if(!kb)return -1; }
    return ka<kb?-sortDir:ka>kb?sortDir:0; }); }
  list.forEach(it=>{ tb.appendChild(rowEl(it.t,it.i,it.isAd));
    if(!it.isAd && it.t.steps && it.t.steps.length && expanded.has(it.t.id)) tb.appendChild(stepRowEl(it.t));
    if(reqComment(it.t.status)) tb.appendChild(issueRowEl(it.t,it.isAd)); });
  document.getElementById("arP").textContent=sortField==="process"?(sortDir===1?"▲":"▼"):"";
  document.getElementById("arD").textContent=sortField==="testDate"?(sortDir===1?"▲":"▼"):"";
  const sc=document.getElementById("shownCount"); if(sc) sc.textContent=f?(shown+" / "+rows.length+" "+T("shown")):"";
  updateProg();
}
function rowEl(t,i,isAd){
  const tr=document.createElement("tr");
  const opts=DATA.statuses.map(s=>'<option '+(s.value===t.status?'selected':'')+'>'+s.value+'</option>').join("");
  const entOpts=DATA.entities.map(e=>'<option '+(e===t.entity?'selected':'')+'>'+e+'</option>').join("");
  const nSteps=(!isAd && t.steps)?t.steps.length:0;
  const stepTog=nSteps?' <span class="stepToggle">'+(expanded.has(t.id)?'▾':'▸')+' '+T("stepsN",nSteps)+'</span>':'';
  const needTxn=(!isAd && t.txnRef && t.status && t.status!=="Not started" && !((t.txnRefValue||"").trim()));
  const txnBlock=(!isAd && t.txnRef)?'<div class="txnlbl">'+esc(T("txnRef"))+' <span class="reftag">'+esc(T("required"))+'</span></div><input data-k="txnRefValue" class="txnin'+(needTxn?' req':'')+'" value="'+esc(t.txnRefValue||"")+'" placeholder="'+esc(T("txnPh"))+'"/>':'';
  tr.innerHTML='<td>'+(isAd?'<input value="'+esc(t.process||"")+'" data-k="process" style="width:120px"/> <span class="badge">ad-hoc</span>':esc(t.process))+'</td>'+
    '<td>'+(isAd?'<input value="'+esc(t.scenario||"")+'" data-k="scenario" style="width:100%"/>':(esc(t.scenario)+stepTog+txnBlock))+'</td>'+
    '<td>'+(isAd?'<select data-k="entity">'+entOpts+'</select>':('<span class="badge">'+esc(t.entity||"")+'</span>'))+'</td>'+
    '<td><select data-k="status">'+opts+'</select></td>'+
    '<td class="duedate">'+(t.testDate?esc(t.testDate):'<span class="muted">—</span>')+'</td>'+
    '<td><textarea data-k="comment" placeholder="'+(reqComment(t.status)?esc(T("cReq")):esc(T("cOpt")))+'">'+esc(t.comment||"")+'</textarea></td>';
  const arr=isAd?adhoc:rows;
  const tgl=tr.querySelector(".stepToggle"); if(tgl) tgl.addEventListener("click",()=>toggleSteps(t.id));
  tr.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("input",()=>{ arr[i][el.dataset.k]=el.value;
    if(el.dataset.k==="status"){ autosave(); render(); return; }
    autosave(); updateProg(); }));
  return tr;
}
function stepRowEl(t){ const tr=document.createElement("tr"); tr.className="steprow";
  tr.innerHTML='<td></td><td colspan="5"><div class="muted" style="font-size:12px;margin-bottom:2px">'+esc(T("stepsFollow"))+'</div><ol class="steps">'+t.steps.map(s=>'<li>'+esc(s)+'</li>').join("")+'</ol></td>';
  return tr; }
function issueRowEl(t,isAd){ const tr=document.createElement("tr"); tr.className="steprow";
  t.failedSteps=t.failedSteps||{}; t.screens=t.screens||[];
  const steps=(!isAd && t.steps)?t.steps:[];
  const stepsHtml=steps.length?('<div class="muted" style="font-size:12px;margin:2px 0">'+esc(T("tickSteps"))+'</div>'+steps.map((s,si)=>'<label class="tpick2"><input type="checkbox" class="fchk" data-si="'+si+'" '+(t.failedSteps[si]?'checked':'')+'/> '+esc(s)+'</label>').join("")):'<div class="muted" style="font-size:12px">'+esc(T("noSteps"))+'</div>';
  const shots=t.screens.map((sc,si)=>'<span class="shot"><img src="'+sc.data+'" alt=""/><button class="rmshot" data-si="'+si+'" title="'+esc(T("remove"))+'">✕</button></span>').join("");
  tr.innerHTML='<td></td><td colspan="5"><div class="issuebox">'+stepsHtml+
    '<div class="muted" style="font-size:12px;margin:8px 0 2px">'+esc(T("evidence"))+'</div>'+
    '<div class="dropz">'+esc(T("dropHere"))+'</div>'+
    '<input type="file" accept="image/*" multiple class="shotin" style="display:none"/>'+
    '<div class="shots">'+shots+'</div></div></td>';
  tr.querySelectorAll(".fchk").forEach(el=>el.addEventListener("change",()=>{ if(el.checked)t.failedSteps[el.dataset.si]=true; else delete t.failedSteps[el.dataset.si]; autosave(); }));
  const dz=tr.querySelector(".dropz"), fin=tr.querySelector(".shotin");
  dz.addEventListener("click",()=>fin.click());
  dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
  dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
  dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");addShots(t,e.dataTransfer.files);});
  fin.addEventListener("change",()=>addShots(t,fin.files));
  tr.querySelectorAll(".rmshot").forEach(el=>el.addEventListener("click",()=>{ t.screens.splice(parseInt(el.dataset.si),1); autosave(); render(); }));
  return tr;
}
function addShots(t,files){ t.screens=t.screens||[];
  [].slice.call(files).filter(f=>f.type&&f.type.indexOf("image/")===0).forEach(f=>{ const r=new FileReader();
    r.onload=function(){ const img=new Image();
      img.onload=function(){ const max=1280; let w=img.width,h=img.height;
        if(w>max||h>max){ const k=Math.min(max/w,max/h); w=Math.round(w*k); h=Math.round(h*k); }
        let data; try{ const cv=document.createElement("canvas"); cv.width=w; cv.height=h; cv.getContext("2d").drawImage(img,0,0,w,h); data=cv.toDataURL("image/jpeg",0.7); }catch(e){ data=r.result; }
        t.screens.push({name:f.name,data:data}); autosave(); render(); };
      img.onerror=function(){ t.screens.push({name:f.name,data:r.result}); autosave(); render(); };
      img.src=r.result; };
    r.readAsDataURL(f); }); }
function addAdhoc(){ if(!curId){alert("Sélectionne d'abord ton nom.");return;} adhoc.push({process:"",scenario:"",entity:DATA.entities[0]||"",status:DATA.statuses[0].value,comment:"",testDate:""}); render(); }
function updateProg(){ const done=rows.filter(r=>r.status&&r.status!=="Not started").length; document.getElementById("prog").textContent=curId?(done+" / "+rows.length+" faits"):""; }
function payloadOut(){ const tt=DATA.testers.find(x=>x.id===curId)||{};
  return {_type:"MCEU_TESTER_RESULTS",iterationId:DATA.iterationId,testerId:curId,testerName:tt.name||"",
    results:rows.map(r=>({id:r.id,status:r.status,comment:r.comment,testDate:r.testDate,txnRefValue:r.txnRefValue||"",failedSteps:r.failedSteps||{},screens:r.screens||[]})),
    adhoc:adhoc.filter(a=>a.process||a.scenario).map(a=>({process:a.process,scenario:a.scenario,entity:a.entity,status:a.status,comment:a.comment,testDate:a.testDate||""}))};}
function autosave(){ if(!curId)return; try{ localStorage.setItem(lsk(curId),JSON.stringify(payloadOut())); const m=document.getElementById("savedMsg"); m.textContent=T("saved"); setTimeout(()=>{m.textContent="";},1500);}catch(e){ const m=document.getElementById("savedMsg"); m.textContent=T("full"); } }
function saveJSON(){ if(!curId){alert(T("pickFirst"));return;}
  const bad=rows.concat(adhoc).filter(r=>reqComment(r.status)&&!(r.comment||"").trim());
  if(bad.length && !confirm(T("cNoCom",bad.length)))return;
  const miss=rows.filter(r=>r.txnRef&&r.status&&r.status!=="Not started"&&!((r.txnRefValue||"").trim())).length;
  if(miss && !confirm(T("cNoTxn",miss)))return;
  const tt=DATA.testers.find(x=>x.id===curId)||{name:"tester"};
  const b=new Blob([JSON.stringify(payloadOut(),null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="results_"+(tt.name||"tester").replace(/\\W+/g,'_')+"_"+DATA.iteration.replace(/\\W+/g,'_')+".json";a.click();
}
function init(){ applyLang(); buildLinks(); buildWho();
  if(DATA.testers.length===1){ const inp=document.getElementById("whoami"); if(inp)inp.value=DATA.testers[0].name; loadTester(DATA.testers[0].id); }
  else { render(); }
}
init();
<\/script></body></html>`;

function importTesterResults(input){
  const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=e=>{ try{ const p=JSON.parse(e.target.result); if(p._type!=="MCEU_TESTER_RESULTS"){alert("Not a tester results file.");return;}
    let upd=0,add=0;
    (p.results||[]).forEach(res=>{ const ex=S.executions.find(x=>x.id===res.id);
      if(ex){ ex.status=res.status; ex.comment=res.comment||""; ex.testDate=res.testDate||ex.testDate; if(res.txnRefValue!=null)ex.txnRefValue=res.txnRefValue; if(res.failedSteps)ex.failedSteps=res.failedSteps; if(res.screens)ex.screens=res.screens; ex.updatedAt=new Date().toISOString(); upd++; } });
    (p.adhoc||[]).forEach(a=>{ S.executions.push({id:uid(),iterationId:p.iterationId,libraryItemId:null,process:a.process||"(ad-hoc)",scenario:a.scenario||"",domain:"",
      entity:a.entity||"",testerId:p.testerId,status:a.status||"Not started",comment:a.comment||"",recurrence:"",testDate:a.testDate||"",adhoc:true,updatedAt:new Date().toISOString()}); add++; });
    renderAll(); save(); alert(`Results merged for ${esc(p.testerName||"tester")}: ${upd} updated, ${add} ad-hoc added.`);
  }catch(err){ alert("Invalid file."); } };
  r.readAsText(f);
}

/* =========================================================================
   IMPORT / EXPORT
   ========================================================================= */
function download(name,content,type){ const b=new Blob([content],{type:type||"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportJSON(){ S.meta=S.meta||{}; S.meta.lastBackup=new Date().toISOString(); save();
  download(`MCEU_UAT_backup_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,2)); }
function importJSON(input){ const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=e=>{ try{ S=migrate(JSON.parse(e.target.result)); renderAll(); save(); alert("Backup restored."); }catch(err){ alert("Invalid file."); } }; r.readAsText(f); }
function exportReport(){
  const data=S.executions.map(e=>{const it=S.iterations.find(i=>i.id===e.iterationId)||{};const t=tester(e.testerId)||{};
    const fs=e.failedSteps||{};const steps=e.steps||[];
    const failed=Object.keys(fs).filter(k=>fs[k]).map(k=>steps[k]||("step "+(parseInt(k)+1))).join(" ; ");
    return {Iteration:it.name||"",PRC:e.process||"",Scenario:e.scenario||"",Domain:e.domain||"",Entity:e.entity,
      Tester:t.name||"",TesterCountry:t.country||"",Status:e.status,Recurrence:e.recurrence||"",TestDate:e.testDate||"",
      BusinessComment:e.comment||"",TransactionRef:e.txnRefValue||"",FailedSteps:failed,Screenshots:(e.screens||[]).length||"",AdHoc:e.adhoc?"yes":""};});
  const ws=XLSX.utils.json_to_sheet(data.length?data:[{Info:"No execution"}]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"UAT Report");
  XLSX.writeFile(wb,`MCEU_UAT_report_${new Date().toISOString().slice(0,10)}.xlsx`);
}
/* Export the Library (PRC × Scenario definitions) to .xlsx using the same
   column headers as the DevOps import — so added PRCs round-trip back in. */
function exportLibrary(){
  const m=S.config.columnMapping;
  const rows=S.library.slice().sort((a,b)=>(a.order||0)-(b.order||0)||naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario))).map(c=>{
    const r={};
    r[m.domain]=c.domain||""; r[m.process]=c.process||""; r[m.scenario]=c.scenario||"";
    r[m.tester]=libTesterIds(c).map(id=>{const t=tester(id);return t?t.name:null;}).filter(Boolean).join("; ");
    r.Steps=(c.steps||[]).join("\n"); r.TxnRef=c.txnRef?"yes":""; r.Order=c.order||0; r.Notes=c.notes||"";
    return r; });
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{[m.process]:"",[m.scenario]:""}]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"LUX");
  XLSX.writeFile(wb,`MCEU_UAT_library_${new Date().toISOString().slice(0,10)}.xlsx`);
}
