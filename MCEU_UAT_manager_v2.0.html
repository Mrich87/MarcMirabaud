<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MCEU — UAT Campaign Manager</title>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --ok:#22c55e; --fail:#ef4444; --block:#f59e0b; --na:#64748b; --prog:#a855f7;
    --chip:#0b1220;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  header{background:linear-gradient(90deg,#0b1220,#16233b);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .brand{color:var(--accent)}
  .iter-pill{margin-left:auto;display:flex;align-items:center;gap:8px}
  select,input,textarea{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
  textarea{width:100%;min-height:50px;resize:vertical}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:#06283b;font-weight:600}
  button.primary:hover{background:var(--accent)}
  button.danger{border-color:var(--fail);color:#fca5a5}
  button.sm{padding:3px 8px;font-size:12px}
  nav{display:flex;gap:4px;background:#0b1220;padding:6px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:9px 18px;color:var(--muted);font-size:14px}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
  main{padding:18px;max-width:1600px;margin:0 auto}
  .view{display:none}
  .view.active{display:block}
  h2{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  .grid{display:grid;gap:12px}
  .cards{display:flex;gap:12px;flex-wrap:wrap}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:120px;flex:1}
  .kpi .n{font-size:26px;font-weight:700}
  .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);z-index:1}
  tr:hover td{background:rgba(255,255,255,.02)}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar .spacer{flex:1}
  .pbar{height:10px;background:#0b1220;border-radius:6px;overflow:hidden;display:flex;min-width:120px}
  .pbar span{display:block;height:100%}
  .muted{color:var(--muted)}
  .tag{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;margin:1px}
  .row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .field{display:flex;flex-direction:column;gap:4px}
  .field label{font-size:12px;color:var(--muted)}
  .matrix td,.matrix th{text-align:center}
  .matrix td.proc{text-align:left}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:680px;width:92%;max-height:88vh;overflow:auto}
  .pill{background:var(--chip);border:1px solid var(--line);border-radius:20px;padding:3px 10px;font-size:12px}
  .hint{font-size:12px;color:var(--muted);margin-top:4px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .empty{padding:40px;text-align:center;color:var(--muted)}
  .chiprow{display:flex;gap:6px;flex-wrap:wrap}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{width:10px;height:10px;border-radius:2px;display:inline-block;margin-right:4px;vertical-align:middle}
  code{background:var(--chip);padding:1px 5px;border-radius:4px}
  .ord{display:flex;align-items:center;gap:3px}
  .ord button{padding:0 6px;line-height:1.5;font-size:11px}
  .ord input{width:52px;text-align:center;padding:3px}
  details.sec>summary{cursor:pointer;font-weight:600;font-size:15px;padding:6px 0;list-style:none}
  details.sec>summary::before{content:"▸ ";color:var(--accent)}
  details.sec[open]>summary::before{content:"▾ "}
  .stickyhead{position:sticky;top:88px;background:var(--bg);padding:6px 0;z-index:2}
  .combo{position:relative;display:inline-block;vertical-align:top}
  .combo .combo-in{width:100%}
  .combo-list{position:absolute;z-index:60;left:0;right:0;top:100%;margin-top:2px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;max-height:240px;overflow:auto;display:none;box-shadow:0 10px 26px rgba(0,0,0,.45);min-width:170px}
  .combo-opt{padding:6px 9px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .combo-opt:hover{background:var(--accent2);color:#06283b}
  .steptoggle{color:var(--accent);cursor:pointer;font-size:12px;user-select:none;white-space:nowrap}
  .steplist{margin:4px 0 2px;padding-left:20px}
  .steplist li{margin:2px 0}
  .steprow>td{background:var(--chip)}
  .reftag{display:inline-block;background:#a855f733;color:#c4b5fd;border:1px solid #a855f7;border-radius:10px;padding:0 6px;font-size:10px;font-weight:600;margin-left:6px;vertical-align:middle}
  .apptag{display:inline-block;background:#f59e0b22;color:#fbbf24;border:1px solid #f59e0b55;border-radius:10px;padding:0 6px;font-size:10px;font-weight:600;margin-left:6px;vertical-align:middle}
  .tpick{display:flex;align-items:center;gap:6px;padding:3px 4px;border-radius:4px;cursor:pointer}
  .tpick:hover{background:rgba(255,255,255,.04)}
  .tlist{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:6px;padding:6px;margin-top:4px}
</style>
</head>
<body>
<header>
  <h1><span class="brand">MCEU</span> · UAT Campaign Manager</h1>
  <div class="iter-pill">
    <span class="muted" style="font-size:12px">Active&nbsp;iteration</span>
    <select id="iterSelect" onchange="setActiveIteration(this.value)"></select>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <div id="view-dashboard" class="view"></div>
  <div id="view-library" class="view"></div>
  <div id="view-campaign" class="view"></div>
  <div id="view-admin" class="view"></div>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script>
/* =========================================================================
   MCEU UAT MANAGER v2 — local single-file web app · 4 screens
   Library (reusable PRC x Scenario definitions) -> Campaign (iterations,
   testers w/ country, dispatch on entities, execution tracking, per-tester
   standalone HTML) -> Dashboard + Admin (config + import/export).
   Persistence: localStorage + xlsx/JSON.
   ========================================================================= */

const LS_KEY = "mceu_uat_state_v2";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

function defaultState(){
  const it1 = {id:uid(), name:"UAT 1", startDate:"", endDate:""};
  return {
    version:3,
    config:{
      campaignName:"MCEU UAT Campaign",
      entities:[
        {code:"LU", label:"Luxembourg",     color:"#38bdf8"},
        {code:"FR", label:"France",         color:"#a855f7"},
        {code:"SP", label:"Spain",          color:"#f59e0b"},
        {code:"UK", label:"United Kingdom",  color:"#22c55e"},
      ],
      departments:["Wealth Management","Operations","Compliance","Finance","Investment","Risk"],
      streams:["Wealth Management","Operations","Compliance","Finance","Investment","Risk"],
      applications:["CLMi","TAP"],
      statuses:[
        {value:"Not started", color:"#64748b", requiresComment:false},
        {value:"In progress", color:"#a855f7", requiresComment:false},
        {value:"Passed",      color:"#22c55e", requiresComment:false},
        {value:"Failed",      color:"#ef4444", requiresComment:true},
        {value:"Blocked",     color:"#f59e0b", requiresComment:true},
        {value:"N/A",         color:"#475569", requiresComment:false},
      ],
      recurrences:["Often","Rarely","Exceptionally"],
      links:[],
      columnMapping:{ process:"TitleLevel3", scenario:"TitleLevel4", domain:"TitleLevel2", tester:"TesterName" }
    },
    testers:[],
    library:[],
    iterations:[it1],
    activeIterationId:it1.id,
    executions:[]
  };
}

let S = load();
function load(){ try{ const r=localStorage.getItem(LS_KEY); if(r) return migrate(JSON.parse(r)); }catch(e){} return defaultState(); }
function migrate(s){ const d=defaultState();
  const cfg=Object.assign(d.config,s.config||{});
  cfg.columnMapping=Object.assign(d.config.columnMapping,(s.config||{}).columnMapping||{});
  if(!(s.config&&s.config.streams)) cfg.streams=((s.config&&s.config.departments)||d.config.streams).slice();
  if(!(s.config&&s.config.applications)) cfg.applications=d.config.applications.slice();
  return Object.assign(d,s,{config:cfg}); }
function save(){ localStorage.setItem(LS_KEY, JSON.stringify(S)); }
function persist(){ save(); renderTab(currentTab); }

/* helpers */
const $ = sel => document.querySelector(sel);
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const statusMeta = v => S.config.statuses.find(x=>x.value===v) || {value:v,color:"#64748b",requiresComment:false};
const entityMeta = c => S.config.entities.find(x=>x.code===c) || {code:c,label:c,color:"#64748b"};
const tester = id => S.testers.find(x=>x.id===id);
const testerName = id => { const t=tester(id); return t?t.name:"—"; };
/* country a test counts toward: its own entity, else the tester's entity/country, else Other */
const execCountry = e => e.entity || ((tester(e.testerId)||{}).country) || "Other";
/* dates: stored ISO (sortable), displayed European JJ/MM/AAAA */
function fmtDate(s){ s=String(s==null?"":s).trim(); const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/); return m?(m[3]+"/"+m[2]+"/"+m[1]):s; }
function toISO(s){ s=String(s==null?"":s).trim(); const m=s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); return m?(m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")):s; }
const libTesterIds = c => (c&&c.defaultTesterIds&&c.defaultTesterIds.length)?c.defaultTesterIds:(c&&c.defaultTesterId?[c.defaultTesterId]:[]);
const testerNames = ids => (ids||[]).map(id=>{const t=tester(id);return t?t.name:null;}).filter(Boolean).join(", ");
const activeIter = () => S.iterations.find(i=>i.id===S.activeIterationId) || S.iterations[0];
const libById = id => S.library.find(c=>String(c.id)===String(id));
const naturalKey = s => String(s||"").toLowerCase().replace(/\d+/g, m=>m.padStart(10,"0"));
const iterExecs = (iterId) => S.executions.filter(e=>e.iterationId===(iterId||S.activeIterationId));
function badge(text,color){ return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}66">${esc(text)}</span>`; }

/* =========================================================================
   SEARCHABLE TESTER COMBOBOX — sorted by name + type-to-filter.
   Drop-in replacement for the old unsorted <select> tester dropdowns.
   tCombo(key,value,onpick,opts) returns HTML. onpick is a JS snippet run on
   pick with the chosen id available as `v`. opts: {allowEmpty,emptyLabel,
   placeholder,width,hidden}. When `hidden` is set, the picked id is mirrored
   into a hidden <input id=hidden> so existing $("#id").value reads keep working.
   ========================================================================= */
const _combos={};
const jsq = s => String(s==null?"":s).replace(/\\/g,"\\\\").replace(/'/g,"\\'");
function tCombo(key,value,onpick,o){
  o=o||{};
  const list=S.testers.slice().sort((a,b)=>(a.name||"").localeCompare(b.name||""));
  const items=[];
  if(o.allowEmpty!==false) items.push({v:"",l:o.emptyLabel||"—"});
  list.forEach(t=>items.push({v:t.id,l:t.name+(t.country?" ("+t.country+")":"")}));
  _combos[key]={items,onpick:onpick||"",value:String(value||"")};
  const sel=items.find(it=>String(it.v)===String(value||""));
  const w=o.width||"200px";
  const hid=o.hidden?`<input type="hidden" id="${o.hidden}" value="${esc(value||"")}"/>`:"";
  return `<span class="combo" style="width:${w}" data-key="${esc(key)}">${hid}`+
    `<input class="combo-in" autocomplete="off" placeholder="${esc(o.placeholder||"🔍 search tester…")}" value="${esc(sel?sel.l:"")}" `+
    `onfocus="comboOpen('${jsq(key)}',this)" oninput="comboFilter('${jsq(key)}',this)" onkeydown="comboKey('${jsq(key)}',this,event)" onblur="comboBlur('${jsq(key)}')"/>`+
    `<div class="combo-list" id="cl_${esc(key)}"></div></span>`;
}
function comboItems(key,q){ const c=_combos[key]; if(!c)return [];
  q=(q||"").toLowerCase().trim();
  return c.items.filter(it=> q ? (it.v!=="" && it.l.toLowerCase().includes(q)) : true); }
function comboPaint(key,q){ const c=_combos[key],box=document.getElementById("cl_"+key); if(!c||!box)return;
  const list=comboItems(key,q);
  box.innerHTML=list.map(it=>`<div class="combo-opt" onmousedown="comboPick('${jsq(key)}','${jsq(it.v)}')">${esc(it.l)}</div>`).join("")||'<div class="combo-opt muted">no match</div>';
  box.style.display="block"; }
function comboOpen(key,inp){ comboPaint(key,""); if(inp.select)inp.select(); }
function comboFilter(key,inp){ comboPaint(key,inp.value); }
function comboBlur(key){ setTimeout(()=>{
  const b=document.getElementById("cl_"+key); if(b)b.style.display="none";
  const c=_combos[key],wrap=document.querySelector('.combo[data-key="'+key+'"]');
  if(c&&wrap){ const it=c.items.find(x=>String(x.v)===String(c.value))||{l:""}; const inp=wrap.querySelector(".combo-in");
    if(inp&&document.activeElement!==inp) inp.value=it.l; }
},150); }
function comboKey(key,inp,ev){ if(ev.key==="Enter"){ ev.preventDefault(); const l=comboItems(key,inp.value); if(l.length)comboPick(key,l[0].v); }
  else if(ev.key==="Escape"){ const b=document.getElementById("cl_"+key); if(b)b.style.display="none"; } }
function comboPick(key,v){ const c=_combos[key]; if(!c)return; c.value=String(v||"");
  const it=c.items.find(x=>String(x.v)===String(v))||{v:"",l:""};
  const wrap=document.querySelector('.combo[data-key="'+key+'"]');
  if(wrap){ wrap.querySelector(".combo-in").value=it.l; const h=wrap.querySelector('input[type=hidden]'); if(h)h.value=v; }
  const box=document.getElementById("cl_"+key); if(box)box.style.display="none";
  if(c.onpick){ try{ new Function("v",c.onpick)(v); }catch(e){ console.error("combo onpick",e); } } }

/* =========================================================================
   NAVIGATION — 4 tabs
   ========================================================================= */
const TABS = [["dashboard","Dashboard"],["library","Library"],["campaign","Campaign"],["admin","Admin"]];
let currentTab = "dashboard";
function buildNav(){ $("#nav").innerHTML = TABS.map(([id,label])=>
  `<button class="${id===currentTab?'active':''}" onclick="go('${id}')">${label}</button>`).join(""); }
function go(tab){ currentTab=tab; document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  $("#view-"+tab).classList.add("active"); buildNav(); renderTab(tab); }
function renderAll(){ buildIterSelect(); buildNav(); renderTab(currentTab); }
function renderTab(tab){ buildIterSelect();
  ({dashboard:renderDashboard,library:renderLibrary,campaign:renderCampaign,admin:renderAdmin}[tab]||(()=>{}))(); }
function buildIterSelect(){ $("#iterSelect").innerHTML = S.iterations.map(i=>
  `<option value="${i.id}" ${i.id===S.activeIterationId?'selected':''}>${esc(i.name)}</option>`).join(""); }
function setActiveIteration(id){ S.activeIterationId=id; renderAll(); save(); }

/* modal */
function modal(html){ $("#modalBox").innerHTML=html; $("#modalBg").classList.add("open"); }
function closeModal(){ $("#modalBg").classList.remove("open"); }
$("#modalBg").addEventListener("click",e=>{ if(e.target.id==="modalBg") closeModal(); });

/* aggregation */
function aggregate(execs){
  const a={total:execs.length,byStatus:{},done:0,passed:0,failed:0,blocked:0,notrun:0};
  execs.forEach(e=>{ a.byStatus[e.status]=(a.byStatus[e.status]||0)+1;
    if(e.status==="Passed"){a.passed++;a.done++;} else if(e.status==="Failed"){a.failed++;a.done++;}
    else if(e.status==="Blocked"){a.blocked++;a.done++;} else if(e.status==="N/A"){a.done++;} else a.notrun++; });
  return a;
}
function progressBar(execs){ const a=aggregate(execs); if(!a.total) return '<div class="pbar"></div>';
  const seg=(n,c)=> n? `<span style="width:${n/a.total*100}%;background:${c}"></span>`:"";
  return `<div class="pbar">${seg(a.passed,'#22c55e')}${seg(a.failed,'#ef4444')}${seg(a.blocked,'#f59e0b')}${seg(a.byStatus['N/A']||0,'#475569')}${seg(a.byStatus['In progress']||0,'#a855f7')}</div>`; }

/* =========================================================================
   DASHBOARD
   ========================================================================= */
const DONE_STATUSES=["Passed","Failed","Blocked","N/A"];
function execMatch(e,key){
  if(key==="all") return true;
  if(key==="done") return DONE_STATUSES.includes(e.status);
  if(key==="todo") return !DONE_STATUSES.includes(e.status);
  return e.status===key;
}
function openExecList(key){
  const titleMap={all:"All assigned",done:"Executed",todo:"To do",Passed:"Passed",Failed:"Failed",Blocked:"Blocked"};
  const ex=dashExecs().filter(e=>execMatch(e,key)).sort((a,b)=>naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario)));
  const rows=ex.map(e=>{const sm=statusMeta(e.status);const cc=execCountry(e);return `<tr><td><b>${esc(e.process)}</b>${e.adhoc?' '+badge('ad-hoc','#a855f7'):''}</td><td>${esc(e.scenario)}</td><td>${badge(cc,entityMeta(cc).color)}</td><td>${esc(testerName(e.testerId))}</td><td>${badge(e.status,sm.color)}</td></tr>`;}).join("")||'<tr><td colspan="5" class="muted">No test case in this category.</td></tr>';
  modal(`<h2>${titleMap[key]||key} — ${dashAll?'All phases':esc(activeIter().name)} <span class="muted" style="font-size:13px">(${ex.length})</span></h2>
    <div style="max-height:62vh;overflow:auto;margin-top:8px"><table><thead><tr><th>PRC</th><th>Scenario</th><th>Entity</th><th>Tester</th><th>Status</th></tr></thead><tbody>${rows}</tbody></table></div>
    <div class="toolbar" style="margin-top:12px"><div class="spacer"></div><button onclick="closeModal()">Close</button></div>`);
}
let dashAll=false;
function dashExecs(){ return dashAll?S.executions.slice():iterExecs(); }
function renderDashboard(){
  const iter=activeIter(); const ex=dashExecs(); const a=aggregate(ex);
  const pct=n=>a.total?Math.round(n/a.total*100):0;
  const kpi=(n,l,c,key)=>`<div class="kpi" ${key?`style="cursor:pointer" title="Click to list these test cases" onclick="openExecList('${key}')"`:''}><div class="n" style="color:${c||'inherit'}">${n}</div><div class="l">${l}</div></div>`;
  const byEntity=S.config.entities.map(en=>({en,sub:ex.filter(e=>execCountry(e)===en.code)}));
  const otherSub=ex.filter(e=>!S.config.entities.some(en=>en.code===execCountry(e)));
  const byTester={}; ex.forEach(e=>{(byTester[e.testerId]=byTester[e.testerId]||[]).push(e);});
  const byDomain={}; ex.forEach(e=>{const d=e.domain||"(none)";(byDomain[d]=byDomain[d]||[]).push(e);});

  $("#view-dashboard").innerHTML=`
    <h2>Dashboard — ${dashAll?'All phases (consolidated)':esc(iter?iter.name:"—")}</h2>
    <p class="sub">${esc(S.config.campaignName)} · ${dashAll?'live progress across <b>all phases</b> end to end.':'live progress for the active iteration.'}</p>
    <div class="toolbar"><span class="muted" style="align-self:center">Scope:</span>
      <button class="sm ${!dashAll?'primary':''}" onclick="dashAll=false;renderDashboard()">Active iteration</button>
      <button class="sm ${dashAll?'primary':''}" onclick="dashAll=true;renderDashboard()">All phases (consolidated)</button>
    </div>
    <div class="cards">
      ${kpi(a.total,"Assigned",null,'all')}${kpi(a.done+" ("+pct(a.done)+"%)","Executed",'#38bdf8','done')}
      ${kpi(a.passed,"Passed",'#22c55e','Passed')}${kpi(a.failed,"Failed",'#ef4444','Failed')}
      ${kpi(a.blocked,"Blocked",'#f59e0b','Blocked')}${kpi(a.notrun,"To do",'#94a3b8','todo')}
    </div>
    <div class="card"><b>Overall progress</b>${progressBar(ex)}
      <div class="legend"><span><i style="background:#22c55e"></i>Passed</span><span><i style="background:#ef4444"></i>Failed</span><span><i style="background:#f59e0b"></i>Blocked</span><span><i style="background:#a855f7"></i>In progress</span><span><i style="background:#475569"></i>N/A</span></div>
    </div>
    <div class="split">
      <div class="card"><b>By entity</b>

/* import DevOps xlsx -> dedup (process,scenario) */
function importDevops(input){
  const file=input.files[0]; if(!file)return;
  const sheetName=($("#impSheet")&&$("#impSheet").value)||"LUX";
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:"array"});
    const sn=wb.SheetNames.includes(sheetName)?sheetName:wb.SheetNames[0];
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{defval:""});
    const m=S.config.columnMapping;
    const existing=new Set(S.library.map(c=>(c.process+"||"+c.scenario)));
    let maxO=S.library.reduce((mm,c)=>Math.max(mm,c.order||0),0);
    let added=0,newTesters=0; const seen=new Set();
    rows.forEach(r=>{
      const process=(r[m.process]||"").toString().trim();
      const scenario=(r[m.scenario]||"").toString().trim();
      if(!process&&!scenario) return;
      const key=process+"||"+scenario;
      if(seen.has(key)) return; seen.add(key);
      // tester from col E
      let testerId=""; const tname=(r[m.tester]||"").toString().trim();
      if(tname){ let t=S.testers.find(x=>x.name===tname); if(!t){t={id:uid(),name:tname,email:"",country:"",dept:""};S.testers.push(t);newTesters++;} testerId=t.id; }
      if(existing.has(key)) return;          // already in library
      existing.add(key);
      S.library.push({id:uid(),order:++maxO,domain:(r[m.domain]||"").toString().trim(),process,scenario,defaultTesterIds:testerId?[testerId]:[],notes:"",steps:[],txnRef:false});
      added++;
    });
    // natural order for freshly added (and any without order)
    let n=0; sortedLib(S.library).forEach(c=>c.order=++n);
    save(); go("library");
    alert(`Import done (sheet "${sn}"): ${added} new definitions, ${newTesters} tester(s) created. Library total: ${S.library.length}.`);
  };
  reader.readAsArrayBuffer(file);
}

/* Create/sync executions for a set of definitions into an iteration.
   Existing rows are re-synced from the Library (tester results kept). */
function dispatchDefs(target,iterId,ents,selTesters,rec,date){ let created=0,synced=0;
  target.forEach(c=>ents.forEach(ent=>{
    const testerIds = selTesters.length ? selTesters : (libTesterIds(c).length?libTesterIds(c):[""]);
    testerIds.forEach(testerId=>{
      const ex=S.executions.find(e=>e.iterationId===iterId&&e.libraryItemId===c.id&&(e.entity||"")===(ent||"")&&(e.testerId||"")===(testerId||""));
      if(ex){ ex.process=c.process; ex.scenario=c.scenario; ex.domain=c.domain; ex.steps=(c.steps||[]).slice(); ex.txnRef=!!c.txnRef;
        if(date) ex.testDate=date; if(rec) ex.recurrence=rec; ex.updatedAt=new Date().toISOString(); synced++; return; }
      S.executions.push({id:uid(),iterationId:iterId,libraryItemId:c.id,process:c.process,scenario:c.scenario,domain:c.domain,
        steps:(c.steps||[]).slice(),txnRef:!!c.txnRef,txnRefValue:"",entity:ent,testerId,status:"Not started",comment:"",recurrence:rec||"",testDate:date,adhoc:false,updatedAt:new Date().toISOString()});
      created++;
    });
  }));
  return {created,synced}; }

</style></head><body>
<header><h1>UAT Test Sheet</h1><span class="muted" id="hdr"></span><button onclick="saveJSON()" style="margin-left:auto">⬇ Save results (JSON)</button></header>
<main>
  <div class="whoami" id="whoamiBar"><label class="muted" for="whoami" id="whoamiLbl">Select your name:</label><select id="whoami"></select></div>

  <div id="filterBar" style="display:none;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">

</main>
<div class="bar"><button onclick="saveJSON()">⬇ Save results (JSON)</button><span class="saved" id="savedMsg"></span><span class="muted" style="margin-left:auto" id="prog"></span></div>
<script>
const DATA=${dataJson};
let curId="", rows=[], adhoc=[], expanded=new Set(), sortField="testDate", sortDir=1;
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function stepText(s){return (s&&typeof s==="object")?(s.text||""):String(s||"");}
function stepStream(s){return (s&&typeof s==="object")?(s.stream||""):"";}
function stepApp(s){return (s&&typeof s==="object")?(s.app||""):"";}
function fmtDate(s){s=String(s==null?"":s).trim();const m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?(m[3]+"/"+m[2]+"/"+m[1]):s;}
function nat(s){return String(s||"").toLowerCase().replace(/\\d+/g,m=>m.padStart(10,"0"));}
function lsk(id){return "mceu_tester_"+DATA.iterationId+"_"+id;}
function reqComment(st){const m=DATA.statuses.find(s=>s.value===st);return m&&m.requiresComment;}
function buildLinks(){const L=(DATA.links||[]).filter(x=>x&&(x.label||x.url));const el=document.getElementById("links");
  if(!L.length){el.style.display="none";return;}
  el.innerHTML="<b>Useful links:</b> "+L.map(x=>x.url?('<a href="'+esc(x.url)+'" target="_blank" rel="noopener">'+esc(x.label||x.url)+'</a>'):esc(x.label||"")).filter(Boolean).join(" &nbsp;·&nbsp; ");}
function buildWho(){const sel=document.getElementById("whoami");
  sel.innerHTML=(DATA.testers.length>1?'<option value="">— select your name —</option>':"")+DATA.testers.map(t=>'<option value="'+esc(t.id)+'">'+esc(t.name)+' ('+t.tests.length+')</option>').join("");
  sel.addEventListener("change",()=>loadTester(sel.value));
  if(DATA.testers.length<=1) document.getElementById("whoamiBar").style.display="none";}
function buildProcFilter(){const procs=[...new Set(rows.map(t=>t.process).filter(Boolean))].sort();
  const fb=document.getElementById("filterBar"), pf=document.getElementById("procFilter");
  if(procs.length>1){ pf.innerHTML='<option value="">— All processes ('+procs.length+') —</option>'+procs.map(p=>'<option value="'+esc(p)+'">'+esc(p)+'</option>').join(""); fb.style.display="flex"; }
  else { pf.innerHTML='<option value="">— All —</option>'; fb.style.display="none"; }}
function loadTester(id){ curId=id; const tt=DATA.testers.find(x=>x.id===id); const hdr=document.getElementById("hdr");
  if(!tt){ rows=[];adhoc=[]; hdr.textContent=DATA.campaign+" · "+DATA.iteration; buildProcFilter(); render(); return; }
  hdr.textContent=DATA.campaign+" · "+DATA.iteration+" · "+tt.name;
  const saved=JSON.parse(localStorage.getItem(lsk(id))||"null");
  rows=tt.tests.map(t=>{const s=saved&&saved.results&&saved.results.find(r=>r.id===t.id);
    return Object.assign({},t,{status:s?s.status:t.status,comment:s?s.comment:t.comment,txnRefValue:(s&&s.txnRefValue)||t.txnRefValue||"",failedSteps:(s&&s.failedSteps)||t.failedSteps||{},screens:(s&&s.screens)||t.screens||[]});});
  adhoc=(saved&&saved.adhoc)||[];
  buildProcFilter(); render(); }
function sk(t){ return sortField==="process"?nat((t.process||"")+" "+(t.scenario||"")):(t.testDate||""); }
function sortBy(f){ if(sortField===f){ sortDir=sortDir===1?-1:0; if(!sortDir)sortField=""; } else { sortField=f; sortDir=1; } render(); }
function toggleSteps(id){ if(expanded.has(id))expanded.delete(id); else expanded.add(id); render(); }
function render(){
  const tb=document.getElementById("tb"); tb.innerHTML="";
  const pf=document.getElementById("procFilter"); const f=pf?pf.value:"";
  let shown=0; const list=[];
  rows.forEach((t,i)=>{ if(!f||t.process===f){ list.push({t,i,isAd:false}); shown++; } });
  adhoc.forEach((t,i)=>list.push({t,i,isAd:true}));
  if(sortField){ const df=sortField==="testDate"; list.sort((a,b)=>{ let ka=sk(a.t),kb=sk(b.t);
    if(df){ if(!ka&&!kb)return 0; if(!ka)return 1; if(!kb)return -1; }
    return ka<kb?-sortDir:ka>kb?sortDir:0; }); }
  list.forEach(it=>{ tb.appendChild(rowEl(it.t,it.i,it.isAd));
    if(!it.isAd && it.t.steps && it.t.steps.length && expanded.has(it.t.id)) tb.appendChild(stepRowEl(it.t));
    if(reqComment(it.t.status)) tb.appendChild(issueRowEl(it.t,it.isAd)); });
  document.getElementById("arP").textContent=sortField==="process"?(sortDir===1?"▲":"▼"):"";
  document.getElementById("arD").textContent=sortField==="testDate"?(sortDir===1?"▲":"▼"):"";
  const sc=document.getElementById("shownCount"); if(sc) sc.textContent=f?(shown+" / "+rows.length+" shown"):"";
  updateProg();
}
function rowEl(t,i,isAd){
  const tr=document.createElement("tr");
  const opts=DATA.statuses.map(s=>'<option '+(s.value===t.status?'selected':'')+'>'+s.value+'</option>').join("");
  const entOpts=DATA.entities.map(e=>'<option '+(e===t.entity?'selected':'')+'>'+e+'</option>').join("");
  const nSteps=(!isAd && t.steps)?t.steps.length:0;
  const stepTog=nSteps?' <span class="stepToggle">'+(expanded.has(t.id)?'▾':'▸')+' steps ('+nSteps+')</span>':'';
  const needTxn=(!isAd && t.txnRef && t.status && t.status!=="Not started" && !((t.txnRefValue||"").trim()));
  const txnCell=(!isAd && t.txnRef)?('<span class="reftag" style="margin:0 0 4px 0">required</span><br><input data-k="txnRefValue" class="txnin'+(needTxn?' req':'')+'" value="'+esc(t.txnRefValue||"")+'" placeholder="CLMi ID / Temenos ID / Transaction ID…"/>'):'<span class="muted">—</span>';
  tr.innerHTML='<td class="prc">'+(isAd?'<input value="'+esc(t.process||"")+'" data-k="process" style="width:120px"/> <span class="badge">ad-hoc</span>':esc(t.process))+'</td>'+
    '<td class="scen">'+(isAd?'<input value="'+esc(t.scenario||"")+'" data-k="scenario" style="width:100%"/>':(esc(t.scenario)+stepTog))+'</td>'+
    '<td>'+(isAd?'<select data-k="entity">'+entOpts+'</select>':('<span class="badge">'+esc(t.entity||"")+'</span>'))+'</td>'+
    '<td><select data-k="status">'+opts+'</select></td>'+
    '<td class="duedate">'+(t.testDate?esc(fmtDate(t.testDate)):'<span class="muted">—</span>')+'</td>'+
    '<td>'+txnCell+'</td>'+
    '<td><textarea data-k="comment" class="cmtin" placeholder="'+(reqComment(t.status)?'required…':'optional')+'">'+esc(t.comment||"")+'</textarea></td>';
  const arr=isAd?adhoc:rows;
  const tgl=tr.querySelector(".stepToggle"); if(tgl) tgl.addEventListener("click",()=>toggleSteps(t.id));
  tr.querySelectorAll("[data-k]").forEach(el=>el.addEventListener("input",()=>{ arr[i][el.dataset.k]=el.value;
    if(el.dataset.k==="status"){ autosave(); render(); return; }
    autosave(); updateProg(); }));
  return tr;
}
function stepRowEl(t){ const tr=document.createElement("tr"); tr.className="steprow"; const mine=t.domain||"";
  const items=t.steps.map(s=>{const st=stepStream(s),ap=stepApp(s),hl=st&&mine&&st===mine;return '<li class="'+(hl?'hl':'')+'">'+esc(stepText(s))+(st?' <span class="streamtag'+(hl?' on':'')+'">'+esc(st)+'</span>':'')+(ap?' <span class="apptag">'+esc(ap)+'</span>':'')+'</li>';}).join("");
  const note=mine?('Workflow — steps for <b>'+esc(mine)+'</b> are highlighted'):'Steps to follow';
  tr.innerHTML='<td></td><td colspan="6"><div class="muted" style="font-size:12px;margin-bottom:2px">'+note+':</div><ol class="steps">'+items+'</ol></td>';
  return tr; }
function issueRowEl(t,isAd){ const tr=document.createElement("tr"); tr.className="steprow";
  t.failedSteps=t.failedSteps||{}; t.screens=t.screens||[];
  const steps=(!isAd && t.steps)?t.steps:[];
  const stepsHtml=steps.length?('<div class="muted" style="font-size:12px;margin:2px 0">Tick the problematic step(s):</div>'+steps.map((s,si)=>{const st=stepStream(s),ap=stepApp(s),hl=st&&t.domain&&st===t.domain;return '<label class="tpick2'+(hl?' hl':'')+'"><input type="checkbox" class="fchk" data-si="'+si+'" '+(t.failedSteps[si]?'checked':'')+'/> '+esc(stepText(s))+(st?' <span class="streamtag'+(hl?' on':'')+'">'+esc(st)+'</span>':'')+(ap?' <span class="apptag">'+esc(ap)+'</span>':'')+'</label>';}).join("")):'<div class="muted" style="font-size:12px">No predefined steps to flag.</div>';
  const shots=t.screens.map((sc,si)=>'<span class="shot"><img src="'+sc.data+'" alt=""/><button class="rmshot" data-si="'+si+'" title="remove">✕</button></span>').join("");
  tr.innerHTML='<td></td><td colspan="6"><div class="issuebox">'+stepsHtml+
    '<div class="muted" style="font-size:12px;margin:8px 0 2px">Evidence — drag &amp; drop screenshot(s) here, or click to browse:</div>'+
    '<div class="dropz">Drop screenshot here / click to browse</div>'+
    '<input type="file" accept="image/*" multiple class="shotin" style="display:none"/>'+
    '<div class="shots">'+shots+'</div></div></td>';
  tr.querySelectorAll(".fchk").forEach(el=>el.addEventListener("change",()=>{ if(el.checked)t.failedSteps[el.dataset.si]=true; else delete t.failedSteps[el.dataset.si]; autosave(); }));
  const dz=tr.querySelector(".dropz"), fin=tr.querySelector(".shotin");
  dz.addEventListener("click",()=>fin.click());
  dz.addEventListener("dragover",e=>{e.preventDefault();dz.classList.add("over");});
  dz.addEventListener("dragleave",()=>dz.classList.remove("over"));
  dz.addEventListener("drop",e=>{e.preventDefault();dz.classList.remove("over");addShots(t,e.dataTransfer.files);});
  fin.addEventListener("change",()=>addShots(t,fin.files));
  tr.querySelectorAll(".rmshot").forEach(el=>el.addEventListener("click",()=>{ t.screens.splice(parseInt(el.dataset.si),1); autosave(); render(); }));
  return tr;
}
function addShots(t,files){ t.screens=t.screens||[];
  [].slice.call(files).filter(f=>f.type&&f.type.indexOf("image/")===0).forEach(f=>{ const r=new FileReader(); r.onload=function(){ t.screens.push({name:f.name,data:r.result}); autosave(); render(); }; r.readAsDataURL(f); }); }
function addAdhoc(){ if(!curId){alert("Select your name first.");return;} adhoc.push({process:"",scenario:"",entity:DATA.entities[0]||"",status:DATA.statuses[0].value,comment:"",testDate:""}); render(); }
function updateProg(){ const done=rows.filter(r=>r.status&&r.status!=="Not started").length; document.getElementById("prog").textContent=curId?(done+" / "+rows.length+" done"):""; }
function payloadOut(){ const tt=DATA.testers.find(x=>x.id===curId)||{};
  return {_type:"MCEU_TESTER_RESULTS",iterationId:DATA.iterationId,testerId:curId,testerName:tt.name||"",
    results:rows.map(r=>({id:r.id,status:r.status,comment:r.comment,testDate:r.testDate,txnRefValue:r.txnRefValue||"",failedSteps:r.failedSteps||{},screens:r.screens||[]})),
    adhoc:adhoc.filter(a=>a.process||a.scenario).map(a=>({process:a.process,scenario:a.scenario,entity:a.entity,status:a.status,comment:a.comment,testDate:a.testDate||""}))};}
function autosave(){ if(!curId)return; try{ localStorage.setItem(lsk(curId),JSON.stringify(payloadOut())); const m=document.getElementById("savedMsg"); m.textContent="auto-saved ✓"; setTimeout(()=>{m.textContent="";},1500);}catch(e){ const m=document.getElementById("savedMsg"); m.textContent="⚠ storage full (screenshots too large)"; } }
function saveJSON(){ if(!curId){alert("Select your name first.");return;}
  const bad=rows.concat(adhoc).filter(r=>reqComment(r.status)&&!(r.comment||"").trim());
  if(bad.length && !confirm(bad.length+" test(s) are Failed/Blocked without a comment. Save anyway?"))return;
  const miss=rows.filter(r=>r.txnRef&&r.status&&r.status!=="Not started"&&!((r.txnRefValue||"").trim())).length;
  if(miss && !confirm(miss+" executed test(s) require a transaction reference that is still empty. Save anyway?"))return;
  const tt=DATA.testers.find(x=>x.id===curId)||{name:"tester"};
  const b=new Blob([JSON.stringify(payloadOut(),null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="results_"+(tt.name||"tester").replace(/\\W+/g,'_')+"_"+DATA.iteration.replace(/\\W+/g,'_')+".json";a.click();
}
function init(){ buildLinks(); buildWho();
  if(DATA.reviewMode){
    document.querySelector("header h1").textContent="UAT — Business review";
    const wl=document.getElementById("whoamiLbl"); if(wl) wl.textContent="Select your business stream:";
    const intro=document.getElementById("introText");
    if(intro) intro.innerHTML="<b>Business review</b> — select your <b>stream</b> to see all its test cases. Review the scenarios (expand ▸ steps to see the full workflow, your stream highlighted) and add any missing scenario via <b>+ Add ad-hoc test</b>. Click <b>Save results (JSON)</b> and send it back; your proposed scenarios will be added to the Library.";
  }
  if(DATA.testers.length===1){ document.getElementById("whoami").value=DATA.testers[0].id; loadTester(DATA.testers[0].id); }
  else { render(); }
}
init();
<\/script></body></html>`;
}
function importTesterResults(input){
  const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=e=>{ try{ const p=JSON.parse(e.target.result); if(p._type!=="MCEU_TESTER_RESULTS"){alert("Not a tester results file.");return;}
    // Business review file: proposed ad-hoc scenarios go to the Library under the reviewed stream.
    if((p.testerId||"").indexOf("stream::")===0){
      const dom=p.testerId.slice(8); let added=0; let maxO=S.library.reduce((mm,c)=>Math.max(mm,c.order||0),0);
      (p.adhoc||[]).forEach(a=>{ if(!a.process&&!a.scenario)return;
        S.library.push({id:uid(),order:++maxO,domain:a.domain||dom,process:a.process||"(proposed)",scenario:a.scenario||"",defaultTesterIds:[],notes:"Proposed by business review",steps:[],txnRef:false}); added++; });
      renderAll(); save(); alert(`Business review merged for stream "${esc(dom)}": ${added} proposed scenario(s) added to the Library.`); return;
    }
    let upd=0,add=0;
    (p.results||[]).forEach(res=>{ const ex=S.executions.find(x=>x.id===res.id);
      if(ex){ ex.status=res.status; ex.comment=res.comment||""; ex.testDate=res.testDate||ex.testDate; if(res.txnRefValue!=null)ex.txnRefValue=res.txnRefValue; if(res.failedSteps)ex.failedSteps=res.failedSteps; if(res.screens)ex.screens=res.screens; ex.updatedAt=new Date().toISOString(); upd++; } });
    (p.adhoc||[]).forEach(a=>{ S.executions.push({id:uid(),iterationId:p.iterationId,libraryItemId:null,process:a.process||"(ad-hoc)",scenario:a.scenario||"",domain:"",
      entity:a.entity||"",testerId:p.testerId,status:a.status||"Not started",comment:a.comment||"",recurrence:"",testDate:a.testDate||"",adhoc:true,updatedAt:new Date().toISOString()}); add++; });
    renderAll(); save(); alert(`Results merged for ${esc(p.testerName||"tester")}: ${upd} updated, ${add} ad-hoc added.`);
  }catch(err){ alert("Invalid file."); } };
  r.readAsText(f);
}

    </div>

    <div class="split">
      <div class="card"><b>Entities (countries)</b>
        <table><thead><tr><th>Code</th><th>Label</th><th>Color</th><th></th></tr></thead><tbody>
        ${S.config.entities.map((en,i)=>`<tr><td><input value="${esc(en.code)}" style="width:60px" onchange="S.config.entities[${i}].code=this.value;persist()"/></td><td><input value="${esc(en.label)}" onchange="S.config.entities[${i}].label=this.value;persist()"/></td><td><input type="color" value="${en.color}" onchange="S.config.entities[${i}].color=this.value;persist()"/></td><td><button class="sm danger" onclick="S.config.entities.splice(${i},1);persist()">✕</button></td></tr>`).join("")}
        </tbody></table><button class="sm" onclick="S.config.entities.push({code:'XX',label:'New',color:'#38bdf8'});persist()">+ Entity</button>
      </div>
      <div class="card"><b>Statuses</b>
        <table><thead><tr><th>Value</th><th>Color</th><th>Comment req.</th><th></th></tr></thead><tbody>
        ${S.config.statuses.map((s,i)=>`<tr><td><input value="${esc(s.value)}" onchange="S.config.statuses[${i}].value=this.value;persist()"/></td><td><input type="color" value="${s.color}" onchange="S.config.statuses[${i}].color=this.value;persist()"/></td><td style="text-align:center"><input type="checkbox" ${s.requiresComment?'checked':''} onchange="S.config.statuses[${i}].requiresComment=this.checked;persist()"/></td><td><button class="sm danger" onclick="S.config.statuses.splice(${i},1);persist()">✕</button></td></tr>`).join("")}
        </tbody></table><button class="sm" onclick="S.config.statuses.push({value:'New',color:'#64748b',requiresComment:false});persist()">+ Status</button>
      </div>
    </div>

    <div class="split">
      <div class="card"><b>Business streams (domains)</b><div class="field" style="margin-top:8px"><textarea onchange="S.config.streams=this.value.split('\\n').map(x=>x.trim()).filter(Boolean);persist()">${esc((S.config.streams||[]).join("\n"))}</textarea><div class="hint">One per line. Feeds the <b>Domain</b> dropdown in the Library and the <b>stream</b> picker when tagging workflow steps. (You can also add one on the fly from the Library editor.)</div></div></div>
      <div class="card"><b>Applications</b><div class="field" style="margin-top:8px"><textarea onchange="S.config.applications=this.value.split('\\n').map(x=>x.trim()).filter(Boolean);persist()">${esc((S.config.applications||[]).join("\n"))}</textarea><div class="hint">One per line (e.g. CLMi, TAP). Feeds the <b>application</b> picker on each workflow step. (You can also add one on the fly from the Library editor.)</div></div></div>
    </div>

    <div class="split">
      <div class="card"><b>Departments</b><div class="field" style="margin-top:8px"><textarea onchange="S.config.departments=this.value.split('\\n').map(x=>x.trim()).filter(Boolean);persist()">${esc(S.config.departments.join("\n"))}</textarea><div class="hint">One per line. Used for the tester's department field.</div></div></div>
      <div class="card"><b>Recurrences</b><div class="field" style="margin-top:8px"><textarea onchange="S.config.recurrences=this.value.split('\\n').map(x=>x.trim()).filter(Boolean);persist()">${esc(S.config.recurrences.join("\n"))}</textarea><div class="hint">One per line.</div></div></div>
    </div>

    <div class="card"><b>Useful links</b>
      <p class="hint">Shown at the top of every generated tester sheet (application under test, documentation, contacts…).</p>
      <table><thead><tr><th style="width:30%">Label</th><th>URL</th><th></th></tr></thead><tbody>
      ${(S.config.links||[]).map((lk,i)=>`<tr><td><input value="${esc(lk.label||'')}" onchange="S.config.links[${i}].label=this.value;persist()"/></td><td><input value="${esc(lk.url||'')}" placeholder="https://…" onchange="S.config.links[${i}].url=this.value;persist()"/></td><td><button class="sm danger" onclick="S.config.links.splice(${i},1);persist()">✕</button></td></tr>`).join("")||'<tr><td colspan="3" class="muted">No link yet.</td></tr>'}
      </tbody></table>
      <button class="sm" onclick="(S.config.links=S.config.links||[]).push({label:'',url:''});persist()">+ Link</button>
    </div>

    <div class="card"><b>DevOps import column mapping</b>
      <p class="hint">Library dedup is based on <code>process</code> (col H) × <code>scenario</code> (col I); <code>tester</code> reads col E.</p>
      <div class="grid" style="grid-template-columns:repeat(4,1fr)">
      ${Object.keys(m).map(k=>`<div class="field"><label>${esc(k)}</label><input value="${esc(m[k])}" onchange="S.config.columnMapping['${k}']=this.value;persist()"/></div>`).join("")}
      </div>
    </div>

    <div class="card"><b>Import / Export</b>
      <div class="cards" style="margin-top:8px">
        <label class="pill" style="cursor:pointer">⬆ Import DevOps .xlsx (Library)<input type="file" accept=".xlsx,.xls" style="display:none" onchange="importDevops(this)"/></label>
        <input id="impSheet" value="LUX" title="sheet name" style="width:70px"/>
        <button class="primary" onclick="exportJSON()">⬇ Full backup (JSON)</button>
        <label class="pill" style="cursor:pointer">⬆ Restore backup<input type="file" accept=".json" style="display:none" onchange="importJSON(this)"/></label>
        <button class="primary" onclick="exportLibrary()">⬇ Library (.xlsx)</button>
        <button class="primary" onclick="exportReport()">⬇ Excel report</button>
      </div>
    </div>

    <div class="card"><b>Reset</b>
      <button class="danger" onclick="if(confirm('Erase everything and start over?')){localStorage.removeItem(LS_KEY);location.reload();}">Reset application</button>
    </div>`;
}

/* =========================================================================
   IMPORT / EXPORT
   ========================================================================= */
function download(name,content,type){ const b=new Blob([content],{type:type||"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(b); a.download=name; a.click(); URL.revokeObjectURL(a.href); }
function exportJSON(){ download(`MCEU_UAT_backup_${new Date().toISOString().slice(0,10)}.json`, JSON.stringify(S,null,2)); }
function importJSON(input){ const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=e=>{ try{ S=migrate(JSON.parse(e.target.result)); renderAll(); save(); alert("Backup restored."); }catch(err){ alert("Invalid file."); } }; r.readAsText(f); }
function exportReport(){
  const data=S.executions.map(e=>{const it=S.iterations.find(i=>i.id===e.iterationId)||{};const t=tester(e.testerId)||{};
    const fs=e.failedSteps||{};const steps=e.steps||[];
    const failed=Object.keys(fs).filter(k=>fs[k]).map(k=>stepText(steps[k])||("step "+(parseInt(k)+1))).join(" ; ");
    return {Iteration:it.name||"",PRC:e.process||"",Scenario:e.scenario||"",Domain:e.domain||"",Entity:e.entity,
      Tester:t.name||"",TesterCountry:t.country||"",Status:e.status,Recurrence:e.recurrence||"",TestDate:fmtDate(e.testDate||""),
      BusinessComment:e.comment||"",TransactionRef:e.txnRefValue||"",FailedSteps:failed,Screenshots:(e.screens||[]).length||"",AdHoc:e.adhoc?"yes":""};});
  const ws=XLSX.utils.json_to_sheet(data.length?data:[{Info:"No execution"}]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"UAT Report");
  XLSX.writeFile(wb,`MCEU_UAT_report_${new Date().toISOString().slice(0,10)}.xlsx`);
}
/* Export the Library (PRC × Scenario definitions) to .xlsx using the same
   column headers as the DevOps import — so added PRCs round-trip back in. */
function exportLibrary(){
  const m=S.config.columnMapping;
  const rows=S.library.slice().sort((a,b)=>(a.order||0)-(b.order||0)||naturalKey(a.process+a.scenario).localeCompare(naturalKey(b.process+b.scenario))).map(c=>{
    const r={};
    r[m.domain]=c.domain||""; r[m.process]=c.process||""; r[m.scenario]=c.scenario||"";
    r[m.tester]=testerNames(libTesterIds(c)); r.Order=c.order||0; r.Notes=c.notes||"";
    return r; });
  const ws=XLSX.utils.json_to_sheet(rows.length?rows:[{[m.process]:"",[m.scenario]:""}]);
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"LUX");
  XLSX.writeFile(wb,`MCEU_UAT_library_${new Date().toISOString().slice(0,10)}.xlsx`);
}

/* startup */
renderAll(); go("dashboard");
</script>
