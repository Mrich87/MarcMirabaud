<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Change Management — Suivi des activités</title>
<style>
  :root{
    --bg:#0f172a; --panel:#1e293b; --panel2:#273449; --line:#334155;
    --txt:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --accent2:#0ea5e9;
    --ok:#22c55e; --fail:#ef4444; --block:#f59e0b; --na:#64748b; --prog:#a855f7;
    --chip:#0b1220;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,Arial,sans-serif;background:var(--bg);color:var(--txt);font-size:14px}
  header{background:linear-gradient(90deg,#0b1220,#16233b);border-bottom:1px solid var(--line);padding:10px 18px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:50}
  header h1{font-size:16px;margin:0;font-weight:600;letter-spacing:.3px}
  header .brand{color:var(--accent)}
  header .right{margin-left:auto;display:flex;align-items:center;gap:10px}
  select,input,textarea{background:var(--chip);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13px;font-family:inherit}
  textarea{width:100%;min-height:70px;resize:vertical}
  label.fld{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
  label.fld input,label.fld select,label.fld textarea{font-size:13px}
  button{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:7px 12px;cursor:pointer;font-size:13px}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent2);border-color:var(--accent2);color:#06283b;font-weight:600}
  button.primary:hover{background:var(--accent)}
  button.danger{border-color:var(--fail);color:#fca5a5}
  button.sm{padding:3px 8px;font-size:12px}
  nav{display:flex;gap:4px;background:#0b1220;padding:6px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  nav button{background:transparent;border:none;border-bottom:2px solid transparent;border-radius:0;padding:9px 18px;color:var(--muted);font-size:14px}
  nav button.active{color:var(--accent);border-bottom-color:var(--accent)}
  main{padding:18px;max-width:1600px;margin:0 auto}
  .view{display:none}
  .view.active{display:block}
  h2{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 16px;font-size:13px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
  .cards{display:flex;gap:12px;flex-wrap:wrap}
  .kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:130px;flex:1}
  .kpi .n{font-size:26px;font-weight:700}
  .kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .kpi.alert .n{color:var(--fail)}
  .kpi.warn .n{color:var(--block)}
  .kpi.good .n{color:var(--ok)}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:8px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);z-index:1;cursor:pointer;white-space:nowrap}
  th .arr{color:var(--accent)}
  tr:hover td{background:rgba(255,255,255,.02)}
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
  .toolbar .spacer{flex:1}
  .muted{color:var(--muted)}
  .pbar{height:9px;background:#0b1220;border-radius:6px;overflow:hidden;display:flex;min-width:90px;flex:1}
  .pbar span{display:block;height:100%;background:var(--accent2)}
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:100}
  .modal-bg.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;max-width:720px;width:94%;max-height:90vh;overflow:auto}
  .modal h3{margin:0 0 14px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .empty{padding:48px;text-align:center;color:var(--muted)}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
  .legend i{width:10px;height:10px;border-radius:3px;display:inline-block;margin-right:4px;vertical-align:middle}
  .kanban{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;align-items:start}
  .kcol{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px;min-height:120px}
  .kcol h4{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
  .kcol h4 .cnt{background:var(--panel2);border-radius:20px;padding:1px 8px;font-size:11px;color:var(--muted)}
  .kcard{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:8px;padding:9px 10px;margin-bottom:8px;cursor:pointer}
  .kcard:hover{border-color:var(--accent)}
  .kcard .t{font-weight:600;font-size:13px;margin-bottom:5px}
  .kcard .m{font-size:11px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block}
  .overdue{color:var(--fail);font-weight:600}
  .soon{color:var(--block)}
  .tag{display:inline-block;background:var(--chip);border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;margin:1px}
  .bar-row{display:flex;align-items:center;gap:10px;margin:6px 0;font-size:13px}
  .bar-row .lab{width:140px;color:var(--muted)}
  .bar-row .track{flex:1;height:18px;background:var(--chip);border-radius:5px;overflow:hidden}
  .bar-row .fill{height:100%;display:flex;align-items:center;padding-left:6px;font-size:11px;font-weight:600;color:#06283b;white-space:nowrap}
  .req{color:var(--fail)}
  .hist{font-size:12px;color:var(--muted);border-left:2px solid var(--line);padding-left:10px;margin:6px 0}
  a.link{color:var(--accent);cursor:pointer;text-decoration:none}
  a.link:hover{text-decoration:underline}
  /* ---- Timeline / Gantt ---- */
  .gantt{min-width:760px}
  .g-head{display:flex;align-items:stretch;border-bottom:1px solid var(--line);margin-bottom:6px}
  .g-lab{width:230px;min-width:230px;padding:4px 10px 4px 0}
  .g-track{position:relative;flex:1;height:22px}
  .g-axis{position:relative;flex:1;display:flex;height:26px}
  .g-month{border-left:1px solid var(--line);font-size:11px;color:var(--muted);padding:4px 0 0 5px;overflow:hidden;white-space:nowrap}
  .g-group{display:flex;align-items:center;gap:8px;margin:14px 0 4px;font-weight:600;font-size:13px}
  .g-group .meta{font-weight:400;font-size:11px;color:var(--muted)}
  .g-row{display:flex;align-items:center;min-height:30px;border-bottom:1px solid #1e293b}
  .g-row:hover{background:rgba(255,255,255,.02)}
  .g-row .g-lab{font-size:12px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .g-row .g-lab .who{color:var(--muted);font-size:11px}
  .g-bar{position:absolute;top:5px;height:14px;border-radius:5px;cursor:pointer;min-width:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);display:flex;align-items:center}
  .g-bar .pct{position:absolute;right:-30px;font-size:10px;color:var(--muted)}
  .g-bar.point{width:14px;border-radius:50%}
  .tl-today{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);z-index:3;pointer-events:none}
  .tl-today.lbl::after{content:"aujourd'hui";position:absolute;top:-2px;left:4px;font-size:10px;color:var(--accent);white-space:nowrap}
  /* ---- Calendrier ---- */
  .cal{width:100%;border-collapse:collapse;table-layout:fixed}
  .cal th{text-align:center;color:var(--muted);font-weight:600;font-size:12px;padding:6px;background:transparent;position:static;cursor:default}
  .cal td{height:96px;border:1px solid var(--line);vertical-align:top;padding:4px;background:var(--chip)}
  .cal td.out{background:var(--bg);opacity:.45}
  .cal td.today{outline:2px solid var(--accent);outline-offset:-2px}
  .cal .dn{font-size:12px;color:var(--muted);margin-bottom:3px}
  .cal td.today .dn{color:var(--accent);font-weight:700}
  .cal .ev{font-size:11px;border-radius:4px;padding:2px 5px;margin:2px 0;cursor:pointer;border-left:3px solid;background:var(--panel);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cal .ev.start{opacity:.7;font-style:italic}
</style>
</head>
<body>
<header>
  <h1><span class="brand">Change Management</span> · Suivi des activités</h1>
  <div class="right">
    <span class="muted" style="font-size:12px" id="lastSaved"></span>
  </div>
</header>
<nav id="nav"></nav>
<main>
  <div id="view-dashboard" class="view"></div>
  <div id="view-activities" class="view"></div>
  <div id="view-board" class="view"></div>
  <div id="view-admin" class="view"></div>
</main>

<div class="modal-bg" id="modalBg"><div class="modal" id="modalBox"></div></div>

<script>
/* =========================================================================
   CHANGE MANAGEMENT — Suivi des activités · web app mono-fichier · 4 écrans
   Tableau de bord · Activités (liste filtrable) · Board (kanban par statut)
   · Admin (paramètres + import/export). Persistance : localStorage + JSON/CSV.
   ========================================================================= */

const LS_KEY = "cm_activity_state_v1";
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const todayISO = () => new Date().toISOString().slice(0,10);

/* ---- Référentiels (paramétrables dans Admin) -------------------------- */
const DEFAULT_CONFIG = {
  statuses: [
    {id:"todo",     label:"À planifier", color:"#64748b"},
    {id:"planned",  label:"Planifié",    color:"#38bdf8"},
    {id:"progress", label:"En cours",    color:"#a855f7"},
    {id:"blocked",  label:"Bloqué",      color:"#f59e0b"},
    {id:"done",     label:"Terminé",     color:"#22c55e"},
  ],
  priorities: [
    {id:"high",   label:"Haute",   color:"#ef4444"},
    {id:"medium", label:"Moyenne", color:"#f59e0b"},
    {id:"low",    label:"Basse",   color:"#22c55e"},
  ],
  types: ["Communication","Formation","Engagement parties prenantes","Analyse d'impact","Sponsorship","Résistance / Adoption","Reporting","Autre"],
  owners: ["Marc","Sarah","Thomas","Julie"],
  workstreams: ["Déploiement SI","Réorganisation","Nouveau process","Réglementaire","Transverse"],
};

const STARTER_ACTIVITIES = [
  {title:"Plan de communication global", type:"Communication", ws:"Transverse", owner:"Marc", status:"progress", priority:"high", progress:60, start:"", due:addDays(7), stakeholders:"COMEX, Managers", notes:"Diffusion newsletter semaine prochaine."},
  {title:"Sessions de formation key users", type:"Formation", ws:"Déploiement SI", owner:"Sarah", status:"planned", priority:"medium", progress:10, start:"", due:addDays(21), stakeholders:"Key users", notes:""},
  {title:"Analyse d'impact organisationnel", type:"Analyse d'impact", ws:"Réorganisation", owner:"Thomas", status:"blocked", priority:"high", progress:30, start:"", due:addDays(-2), stakeholders:"RH, Direction", notes:"En attente validation périmètre."},
  {title:"Cartographie des parties prenantes", type:"Engagement parties prenantes", ws:"Transverse", owner:"Julie", status:"done", priority:"medium", progress:100, start:"", due:addDays(-5), stakeholders:"Tous", notes:"Validée."},
];

function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10);}

/* ---- State ------------------------------------------------------------ */
let state = load();
function load(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if(raw){const s=JSON.parse(raw); s.config=Object.assign({},DEFAULT_CONFIG,s.config||{}); return s;}
  }catch(e){console.warn("load failed",e);}
  return {
    config: structuredClone(DEFAULT_CONFIG),
    activities: STARTER_ACTIVITIES.map(a=>({id:uid(),created:todayISO(),history:[{ts:nowTs(),txt:"Activité créée"}],...a})),
  };
}
function save(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state));
    document.getElementById("lastSaved").textContent = "Sauvegardé "+new Date().toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"});
  }catch(e){alert("Échec de la sauvegarde locale : "+e.message);}
}
function nowTs(){return new Date().toLocaleString("fr-FR",{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"});}

/* ---- Helpers de référentiel ------------------------------------------ */
const statusOf  = id => state.config.statuses.find(s=>s.id===id) || {label:id,color:"#64748b"};
const prioOf    = id => state.config.priorities.find(p=>p.id===id) || {label:id,color:"#64748b"};
function statusBadge(id){const s=statusOf(id);return `<span class="badge" style="background:${s.color}22;color:${s.color};border:1px solid ${s.color}">${s.label}</span>`;}
function prioBadge(id){const p=prioOf(id);return `<span class="badge" style="background:${p.color}22;color:${p.color};border:1px solid ${p.color}">${p.label}</span>`;}
function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function dueInfo(a){
  if(a.status==="done"||!a.due) return {cls:"",txt:a.due?fmtDate(a.due):"—"};
  const days = Math.round((new Date(a.due)-new Date(todayISO()))/86400000);
  if(days<0) return {cls:"overdue",txt:fmtDate(a.due)+" ("+Math.abs(days)+"j de retard)"};
  if(days<=3) return {cls:"soon",txt:fmtDate(a.due)+" (J-"+days+")"};
  return {cls:"",txt:fmtDate(a.due)};
}
function fmtDate(iso){if(!iso)return "—";const d=new Date(iso);return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"2-digit"});}

/* ---- Navigation ------------------------------------------------------- */
const VIEWS = [
  {id:"dashboard",  label:"Tableau de bord", render:renderDashboard},
  {id:"subjects",   label:"Sujets",          render:renderSubjects},
  {id:"activities", label:"Activités",       render:renderActivities},
  {id:"timeline",   label:"Timeline",        render:renderTimeline},
  {id:"calendar",   label:"Calendrier",      render:renderCalendar},
  {id:"board",      label:"Board",           render:renderBoard},
  {id:"admin",      label:"Admin",           render:renderAdmin},
];
let activeView = "dashboard";
function buildNav(){
  document.getElementById("nav").innerHTML = VIEWS.map(v=>
    `<button class="${v.id===activeView?"active":""}" onclick="go('${v.id}')">${v.label}</button>`).join("");
}
function go(id){
  activeView=id; buildNav();
  document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));
  const el=document.getElementById("view-"+id); el.classList.add("active");
  VIEWS.find(v=>v.id===id).render(el);
}

/* ---- Filtres (vue Activités) ------------------------------------------ */
let filters = {q:"", status:"", priority:"", owner:"", ws:""};
let sortKey="due", sortDir=1;

/* =======================================================================
   DASHBOARD
   ===================================================================== */
function renderDashboard(el){
  const A = state.activities;
  const open = A.filter(a=>a.status!=="done");
  const done = A.filter(a=>a.status==="done");
  const overdue = open.filter(a=>a.due && new Date(a.due)<new Date(todayISO()));
  const blocked = A.filter(a=>a.status==="blocked");
  const soon = open.filter(a=>{if(!a.due)return false;const d=Math.round((new Date(a.due)-new Date(todayISO()))/86400000);return d>=0&&d<=7;});
  const pct = A.length? Math.round(done.length/A.length*100):0;

  el.innerHTML = `
    <h2>Tableau de bord</h2>
    <p class="sub">Vue d'ensemble du portefeuille d'activités de conduite du changement.</p>
    <div class="cards">
      <div class="kpi"><div class="n">${A.length}</div><div class="l">Activités</div></div>
      <div class="kpi"><div class="n">${open.length}</div><div class="l">En cours / ouvertes</div></div>
      <div class="kpi good"><div class="n">${pct}%</div><div class="l">Taux d'achèvement</div></div>
      <div class="kpi warn"><div class="n">${soon.length}</div><div class="l">Échéance ≤ 7j</div></div>
      <div class="kpi alert"><div class="n">${overdue.length}</div><div class="l">En retard</div></div>
      <div class="kpi warn"><div class="n">${blocked.length}</div><div class="l">Bloquées</div></div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 12px">Répartition par statut</h3>
      ${barChart(state.config.statuses.map(s=>({label:s.label,color:s.color,n:A.filter(a=>a.status===s.id).length})), A.length)}
    </div>

    <div class="grid2">
      <div class="card">
        <h3 style="margin:0 0 12px">Par sujet</h3>
        ${barChart(groupCount(A,"ws").map(g=>({label:g.k||"(non défini)",color:"#0ea5e9",n:g.n})), A.length)}
      </div>
      <div class="card">
        <h3 style="margin:0 0 12px">Charge par responsable</h3>
        ${barChart(groupCount(open,"owner").map(g=>({label:g.k||"(non assigné)",color:"#a855f7",n:g.n})), Math.max(1,open.length))}
      </div>
    </div>

    <div class="card">
      <h3 style="margin:0 0 4px">Prochaines échéances & alertes</h3>
      <p class="sub" style="margin:0 0 10px">Activités en retard ou à échéance proche.</p>
      ${attentionTable([...overdue, ...soon.filter(a=>!overdue.includes(a))])}
    </div>`;
}

function barChart(rows, total){
  total = total||1;
  if(!rows.some(r=>r.n>0)) return `<p class="muted">Aucune donnée.</p>`;
  return rows.filter(r=>r.n>0).map(r=>{
    const w = Math.round(r.n/total*100);
    return `<div class="bar-row"><div class="lab">${esc(r.label)}</div>
      <div class="track"><div class="fill" style="width:${Math.max(w,6)}%;background:${r.color}">${r.n}</div></div>
      <div class="muted" style="width:42px;text-align:right">${w}%</div></div>`;
  }).join("");
}
function groupCount(arr,key){
  const m={}; arr.forEach(a=>{const k=a[key]||"";m[k]=(m[k]||0)+1;});
  return Object.entries(m).map(([k,n])=>({k,n})).sort((a,b)=>b.n-a.n);
}
function attentionTable(list){
  if(!list.length) return `<p class="muted">✅ Rien à signaler. Aucune activité en retard ou à échéance imminente.</p>`;
  list = list.slice().sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999"));
  return `<table><thead><tr><th>Activité</th><th>Responsable</th><th>Statut</th><th>Priorité</th><th>Échéance</th></tr></thead><tbody>
    ${list.map(a=>{const d=dueInfo(a);return `<tr>
      <td><a class="link" onclick="openActivity('${a.id}')">${esc(a.title)}</a></td>
      <td>${esc(a.owner||"—")}</td><td>${statusBadge(a.status)}</td><td>${prioBadge(a.priority)}</td>
      <td class="${d.cls}">${d.txt}</td></tr>`;}).join("")}
  </tbody></table>`;
}

/* =======================================================================
   ACTIVITÉS (liste filtrable)
   ===================================================================== */
function renderActivities(el){
  const cfg=state.config;
  el.innerHTML = `
    <h2>Activités</h2>
    <p class="sub">Liste complète. Cliquez sur une activité pour la modifier, ou ajoutez-en une nouvelle.</p>
    <div class="toolbar">
      <input id="fq" placeholder="🔎 Rechercher…" value="${esc(filters.q)}" oninput="filters.q=this.value;refreshList()" style="min-width:200px">
      <select id="fstatus" onchange="filters.status=this.value;refreshList()">${optList("Tous statuts",cfg.statuses.map(s=>[s.id,s.label]),filters.status)}</select>
      <select id="fprio" onchange="filters.priority=this.value;refreshList()">${optList("Toutes priorités",cfg.priorities.map(p=>[p.id,p.label]),filters.priority)}</select>
      <select id="fowner" onchange="filters.owner=this.value;refreshList()">${optList("Tous responsables",cfg.owners.map(o=>[o,o]),filters.owner)}</select>
      <select id="fws" onchange="filters.ws=this.value;refreshList()">${optList("Tous sujets",cfg.workstreams.map(w=>[w,w]),filters.ws)}</select>
      <span class="spacer"></span>
      <button class="primary" onclick="openActivity()">+ Nouvelle activité</button>
    </div>
    <div class="card" style="padding:0;overflow:auto" id="listWrap"></div>`;
  refreshList();
}
function optList(placeholder, pairs, sel){
  return `<option value="">${placeholder}</option>`+pairs.map(([v,l])=>`<option value="${esc(v)}" ${v===sel?"selected":""}>${esc(l)}</option>`).join("");
}
function filteredActivities(){
  const f=filters, q=f.q.toLowerCase();
  let list = state.activities.filter(a=>
    (!q || (a.title+ " "+(a.notes||"")+" "+(a.stakeholders||"")).toLowerCase().includes(q)) &&
    (!f.status || a.status===f.status) &&
    (!f.priority || a.priority===f.priority) &&
    (!f.owner || a.owner===f.owner) &&
    (!f.ws || a.ws===f.ws));
  const prioRank={high:0,medium:1,low:2};
  list.sort((a,b)=>{
    let x,y;
    if(sortKey==="priority"){x=prioRank[a.priority]??9;y=prioRank[b.priority]??9;}
    else if(sortKey==="due"){x=a.due||"9999";y=b.due||"9999";}
    else if(sortKey==="progress"){x=a.progress||0;y=b.progress||0;}
    else {x=(a[sortKey]||"").toString().toLowerCase();y=(b[sortKey]||"").toString().toLowerCase();}
    return x<y?-sortDir:x>y?sortDir:0;
  });
  return list;
}
function setSort(k){if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=1;}refreshList();}
function arr(k){return sortKey===k?`<span class="arr">${sortDir>0?"▲":"▼"}</span>`:"";}
function refreshList(){

function renderBoard(el){

    <div class="kanban" id="kanban"></div>`;

function refreshBoard(){
  const k=document.getElementById("kanban"); if(!k)return;
  k.innerHTML = state.config.statuses.map(s=>{
    const items=state.activities.filter(a=>a.status===s.id);
    return `<div class="kcol">
      <h4><span style="color:${s.color}">${esc(s.label)}</span><span class="cnt">${items.length}</span></h4>
      ${items.map(a=>kCard(a)).join("")||'<p class="muted" style="font-size:12px;text-align:center;padding:10px 0">—</p>'}
    </div>`;
  }).join("");
}
function kCard(a){
  const d=dueInfo(a), p=prioOf(a.priority);
  const idx=state.config.statuses.findIndex(s=>s.id===a.status);
  const canPrev=idx>0, canNext=idx<state.config.statuses.length-1;
  return `<div class="kcard" style="border-left-color:${p.color}">
    <div class="t" onclick="openActivity('${a.id}')">${esc(a.title)}</div>
    <div class="m">
      <span><span class="dot" style="background:${p.color}"></span> ${esc(a.owner||"—")}</span>
      ${a.due?`<span class="${d.cls}">📅 ${fmtDate(a.due)}</span>`:""}
      <span>${a.progress||0}%</span>
    </div>
    <div class="m" style="margin-top:7px">
      <button class="sm" ${canPrev?"":"disabled style=opacity:.3"} onclick="moveStatus('${a.id}',-1)">←</button>
      <button class="sm" ${canNext?"":"disabled style=opacity:.3"} onclick="moveStatus('${a.id}',1)">→</button>
    </div>
  </div>`;
}
function moveStatus(id,dir){
  const a=state.activities.find(x=>x.id===id); if(!a)return;
  const ss=state.config.statuses, i=ss.findIndex(s=>s.id===a.status);
  const ni=i+dir; if(ni<0||ni>=ss.length)return;
  a.status=ss[ni].id;
  if(a.status==="done") a.progress=100;
  a.history=a.history||[]; a.history.unshift({ts:nowTs(),txt:"Statut → "+ss[ni].label});
  save(); refreshBoard();
}

function renderSubjects(el){
  // Regroupe les activités par sujet (champ ws). Lecture seule : un sujet
  // n'a pas de fiche propre, c'est une synthèse calculée.
  const groups = {};
  state.activities.forEach(a=>{const k=a.ws||"(sans sujet)";(groups[k]=groups[k]||[]).push(a);});
  const keys = Object.keys(groups).sort((a,b)=>a.localeCompare(b));
  el.innerHTML = `
    <h2>Sujets</h2>
    <p class="sub">Synthèse par sujet : avancement global, responsables impliqués, période et alertes.</p>
    ${keys.length? keys.map(k=>{
      const items=groups[k];
      const done=items.filter(a=>a.status==="done").length;
      const avg=Math.round(items.reduce((s,a)=>s+(a.progress||0),0)/items.length);
      const overdue=items.filter(a=>a.status!=="done"&&a.due&&new Date(a.due)<new Date(todayISO())).length;
      const owners=[...new Set(items.map(a=>a.owner).filter(Boolean))];
      const dates=items.flatMap(a=>[a.start,a.due]).filter(Boolean).sort();
      const range=dates.length?`${fmtDate(dates[0])} → ${fmtDate(dates[dates.length-1])}`:"—";
      return `<div class="card">
        <div class="toolbar" style="margin-bottom:8px">
          <h3 style="margin:0">${esc(k)}</h3>
          <span class="spacer"></span>
          ${overdue?`<span class="badge" style="background:#ef444422;color:#ef4444;border:1px solid #ef4444">${overdue} en retard</span>`:""}
          <span class="tag">${done}/${items.length} terminées</span>
          <span class="tag">📅 ${range}</span>
        </div>
        <div class="bar-row"><div class="lab">Avancement global</div>
          <div class="track"><div class="fill" style="width:${Math.max(avg,6)}%;background:${avg>=100?'#22c55e':'#0ea5e9'}">${avg}%</div></div></div>
        <div style="margin:6px 0 12px"><span class="muted" style="font-size:12px">Responsables : </span>${owners.length?owners.map(o=>`<span class="tag">${esc(o)}</span>`).join(""):'<span class="muted">—</span>'}</div>
        <table><thead><tr><th>Activité</th><th>Responsable</th><th>Statut</th><th>Avancement</th><th>Échéance</th></tr></thead><tbody>
          ${items.slice().sort((a,b)=>(a.due||"9999").localeCompare(b.due||"9999")).map(a=>{const d=dueInfo(a);return `<tr style="cursor:pointer" onclick="openActivity('${a.id}')">
            <td>${esc(a.title)}</td><td>${esc(a.owner||"—")}</td><td>${statusBadge(a.status)}</td>
            <td><div style="display:flex;align-items:center;gap:6px"><div class="pbar"><span style="width:${a.progress||0}%"></span></div><span class="muted" style="font-size:11px">${a.progress||0}%</span></div></td>
            <td class="${d.cls}">${d.txt}</td></tr>`;}).join("")}
        </tbody></table>
      </div>`;
    }).join("") : `<div class="empty">Aucune activité. Ajoutez-en depuis l'onglet « Activités ».</div>`}`;
}

/* =======================================================================
   TIMELINE / GANTT (concomitance des activités dans le temps)
   ===================================================================== */
const MS_DAY=86400000;
function effDates(a){
  // Dates effectives pour positionner une barre. start→due ; si une seule
  // date est connue on retombe sur un point ; sinon l'activité est "non planifiée".
  const s=a.start||a.due, e=a.due||a.start;
  if(!s&&!e) return null;
  let ds=new Date(s), de=new Date(e);
  if(ds>de){const t=ds;ds=de;de=t;}
  return {s:ds,e:de,point:!a.start||!a.due};
}
function renderTimeline(el){
  const planned=[], unplanned=[];
  state.activities.forEach(a=>{const d=effDates(a); d?planned.push({a,d}):unplanned.push(a);});
  if(!planned.length){
    el.innerHTML=`<h2>Timeline</h2><p class="sub">Frise chronologique des activités, regroupées par sujet.</p>
      <div class="empty">Aucune activité datée. Renseignez une date de début et/ou une échéance pour la voir sur la frise.</div>`;
    return;
  }
  // Étendue : du 1er jour du mois min au dernier jour du mois max.
  let min=planned[0].d.s, max=planned[0].d.e;
  planned.forEach(p=>{if(p.d.s<min)min=p.d.s;if(p.d.e>max)max=p.d.e;});
  const rs=new Date(min.getFullYear(),min.getMonth(),1);
  const re=new Date(max.getFullYear(),max.getMonth()+1,0);
  const span=(re-rs)+MS_DAY;
  const pct=date=>((date-rs)/span)*100;
  const todayP=pct(new Date(todayISO()));
  const showToday=todayP>=0&&todayP<=100;

  // Colonnes mensuelles (largeur proportionnelle au nb de jours).
  const months=[]; let cur=new Date(rs);
  while(cur<=re){const days=new Date(cur.getFullYear(),cur.getMonth()+1,0).getDate();
    months.push({lab:cur.toLocaleDateString("fr-FR",{month:"short",year:"2-digit"}),w:days/(span/MS_DAY)*100});
    cur=new Date(cur.getFullYear(),cur.getMonth()+1,1);}

  // Groupes par sujet.
  const groups={}; planned.forEach(p=>{const k=p.a.ws||"(sans sujet)";(groups[k]=groups[k]||[]).push(p);});
  const keys=Object.keys(groups).sort((a,b)=>a.localeCompare(b));
  const todayLine=showToday?`<div class="tl-today" style="left:${todayP}%"></div>`:"";

  el.innerHTML=`
    <h2>Timeline</h2>
    <p class="sub">Frise chronologique par sujet — les barres qui se chevauchent verticalement sont des activités <strong>concomitantes</strong>. Cliquez une barre pour ouvrir l'activité.</p>
    ${ganttLegend()}
    <div class="card" style="overflow-x:auto">
      <div class="gantt">
        <div class="g-head">
          <div class="g-lab muted" style="font-size:12px">Activité</div>
          <div class="g-axis">${months.map(m=>`<div class="g-month" style="width:${m.w}%">${m.lab}</div>`).join("")}${showToday?`<div class="tl-today lbl" style="left:${todayP}%"></div>`:""}</div>
        </div>
        ${keys.map(k=>{
          const rows=groups[k].sort((a,b)=>a.d.s-b.d.s);
          const owners=[...new Set(rows.map(r=>r.a.owner).filter(Boolean))];
          return `<div class="g-group">📂 ${esc(k)} <span class="meta">· ${rows.length} activité(s)${owners.length?" · "+owners.map(esc).join(", "):""}</span></div>
            ${rows.map(({a,d})=>{
              const left=pct(d.s), width=Math.max(pct(d.e)+ (100/(span/MS_DAY)) - left, 0.8);
              const col=statusOf(a.status).color;
              const tip=`${a.title} — ${fmtDate(a.start||a.due)}${a.start&&a.due?" → "+fmtDate(a.due):""} (${statusOf(a.status).label})`;
              return `<div class="g-row">
                <div class="g-lab" onclick="openActivity('${a.id}')" title="${esc(a.title)}">${esc(a.title)} <span class="who">· ${esc(a.owner||"—")}</span></div>
                <div class="g-track">${todayLine}
                  <div class="g-bar ${d.point?'point':''}" onclick="openActivity('${a.id}')" title="${esc(tip)}"
                       style="left:${left}%;${d.point?'':'width:'+width+'%;'}background:${col}"></div>
                </div></div>`;
            }).join("")}`;
        }).join("")}
      </div>
    </div>
    ${unplanned.length?`<div class="card"><h3 style="margin:0 0 8px">Non planifiées <span class="muted">(sans date)</span></h3>
      ${unplanned.map(a=>`<span class="tag" style="cursor:pointer;padding:4px 8px" onclick="openActivity('${a.id}')">${esc(a.title)} · ${esc(a.owner||"—")}</span>`).join(" ")}</div>`:""}`;
}
function ganttLegend(){
  return `<div class="legend">${state.config.statuses.map(s=>`<span><i style="background:${s.color}"></i>${esc(s.label)}</span>`).join("")}
    <span style="margin-left:6px"><i style="background:var(--accent);width:2px;height:12px;border-radius:0"></i>aujourd'hui</span></div>`;
}

/* =======================================================================
   CALENDRIER (vue mensuelle des échéances)
   ===================================================================== */
let calRef=new Date(todayISO().slice(0,8)+"01");
function renderCalendar(el){
  const y=calRef.getFullYear(), m=calRef.getMonth();
  const first=new Date(y,m,1), last=new Date(y,m+1,0);
  const startOffset=(first.getDay()+6)%7; // lundi = 0
  const days=last.getDate();
  const today=todayISO();

  // Index des activités par jour (échéances + débuts) pour le mois affiché.
  const byDay={};
  state.activities.forEach(a=>{
    [["due",a.due],["start",a.start]].forEach(([kind,iso])=>{
      if(iso&&iso.slice(0,7)===`${y}-${String(m+1).padStart(2,"0")}`){
        const day=parseInt(iso.slice(8,10));
        (byDay[day]=byDay[day]||[]).push({a,kind});
      }
    });
  });

  const cells=[]; for(let i=0;i<startOffset;i++)cells.push(null);
  for(let d=1;d<=days;d++)cells.push(d);
  while(cells.length%7)cells.push(null);

  const wd=["Lun","Mar","Mer","Jeu","Ven","Sam","Dim"];
  let rows="";
  for(let i=0;i<cells.length;i+=7){
    rows+="<tr>"+cells.slice(i,i+7).map(d=>{
      if(d===null) return `<td class="out"></td>`;
      const iso=`${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
      const evs=(byDay[d]||[]).sort((a,b)=>a.kind.localeCompare(b.kind));
      return `<td class="${iso===today?"today":""}">
        <div class="dn">${d}</div>
        ${evs.map(({a,kind})=>{const c=statusOf(a.status).color;
          return `<div class="ev ${kind==="start"?"start":""}" style="border-left-color:${c}" title="${esc(a.title)} — ${kind==="due"?"échéance":"début"}" onclick="openActivity('${a.id}')">${kind==="start"?"▶ ":"⚑ "}${esc(a.title)}</div>`;}).join("")}
      </td>`;
    }).join("")+"</tr>";
  }

  el.innerHTML=`
    <h2>Calendrier</h2>
    <p class="sub">Échéances (⚑) et démarrages (▶ en italique) du mois. Cliquez un élément pour ouvrir l'activité.</p>
    <div class="toolbar">
      <button onclick="calMove(-1)">← Mois précédent</button>
      <button onclick="calToday()">Aujourd'hui</button>
      <button onclick="calMove(1)">Mois suivant →</button>
      <span class="spacer"></span>
      <strong style="font-size:16px;text-transform:capitalize">${calRef.toLocaleDateString("fr-FR",{month:"long",year:"numeric"})}</strong>
    </div>
    <div class="card">
      <table class="cal"><thead><tr>${wd.map(w=>`<th>${w}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table>
      ${ganttLegend()}
    </div>`;
}
function calMove(n){calRef=new Date(calRef.getFullYear(),calRef.getMonth()+n,1);renderCalendar(document.getElementById("view-calendar"));}
function calToday(){calRef=new Date(todayISO().slice(0,8)+"01");renderCalendar(document.getElementById("view-calendar"));}

      <label class="fld">Statut
        <select id="m_status">${cfg.statuses.map(s=>`<option value="${s.id}" ${s.id===a.status?"selected":""}>${esc(s.label)}</option>`).join("")}</select></label>
      <label class="fld">Avancement (%)
        <input id="m_progress" type="number" min="0" max="100" value="${a.progress||0}"></label>
      <label class="fld">Date de début
        <input id="m_start" type="date" value="${a.start||""}"></label>
      <label class="fld">Échéance
        <input id="m_due" type="date" value="${a.due||""}"></label>
      <label class="fld" style="grid-column:1/3">Parties prenantes
        <input id="m_stake" value="${esc(a.stakeholders)}" placeholder="Ex : COMEX, Managers de proximité"></label>
      <label class="fld" style="grid-column:1/3">Notes / commentaires
        <textarea id="m_notes">${esc(a.notes)}</textarea></label>
    </div>
    ${a.history&&a.history.length?`<div style="margin-top:14px"><strong style="font-size:13px">Historique</strong>
      ${a.history.slice(0,6).map(h=>`<div class="hist">${esc(h.ts)} — ${esc(h.txt)}</div>`).join("")}</div>`:""}
    <div class="toolbar" style="margin:18px 0 0">
      ${id?`<button class="danger" onclick="deleteActivity('${id}')">Supprimer</button>`:""}
      <span class="spacer"></span>
      <button onclick="closeModal()">Annuler</button>
      <button class="primary" onclick="saveActivity('${id}')">Enregistrer</button>
    </div>`;
  document.getElementById("modalBg").classList.add("open");
  setTimeout(()=>document.getElementById("m_title").focus(),50);
}
function saveActivity(id){
  const g=k=>document.getElementById("m_"+k);
  const title=g("title").value.trim();
  if(!title){alert("Le titre est obligatoire.");return;}
  const data={
    title, type:g("type").value, ws:g("ws").value, owner:g("owner").value,
    status:g("status").value, priority:g("priority").value,
    progress:Math.max(0,Math.min(100,parseInt(g("progress").value)||0)),
    start:g("start").value, due:g("due").value,
    stakeholders:g("stake").value.trim(), notes:g("notes").value.trim(),
  };
  if(data.status==="done"&&data.progress<100) data.progress=100;
  if(id){
    const a=state.activities.find(x=>x.id===id);
    const changes=[];
    if(a.status!==data.status)changes.push("statut → "+statusOf(data.status).label);
    if(a.progress!==data.progress)changes.push("avancement → "+data.progress+"%");
    Object.assign(a,data);
    a.history=a.history||[]; a.history.unshift({ts:nowTs(),txt:changes.length?"Modifiée ("+changes.join(", ")+")":"Modifiée"});
  }else{
    state.activities.push({id:uid(),created:todayISO(),history:[{ts:nowTs(),txt:"Activité créée"}],...data});
  }
  save(); closeModal(); go(activeView);
}
function deleteActivity(id){
  if(!confirm("Supprimer définitivement cette activité ?"))return;
  state.activities=state.activities.filter(a=>a.id!==id);
  save(); closeModal(); go(activeView);
}
function closeModal(){document.getElementById("modalBg").classList.remove("open");}
document.getElementById("modalBg").addEventListener("click",e=>{if(e.target.id==="modalBg")closeModal();});

/* ---- Export / Import -------------------------------------------------- */
function download(name, content, type){
  const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=name; a.click(); URL.revokeObjectURL(url);
}
function exportJSON(){
  download("cm_activites_"+todayISO()+".json", JSON.stringify(state,null,2), "application/json");
}
function exportCSV(){
  const cols=["title","type","ws","owner","status","priority","progress","start","due","stakeholders","notes"];
  const head=["Titre","Type","Axe","Responsable","Statut","Priorité","Avancement","Début","Échéance","Parties prenantes","Notes"];
  const lines=[head.join(";")];
  state.activities.forEach(a=>{
    lines.push(cols.map(c=>{
      let v=a[c]; if(c==="status")v=statusOf(v).label; if(c==="priority")v=prioOf(v).label;
      v=(v==null?"":String(v)).replace(/"/g,'""').replace(/\r?\n/g," ");
      return /[";]/.test(v)?`"${v}"`:v;
    }).join(";"));
  });
  download("cm_activites_"+todayISO()+".csv", "﻿"+lines.join("\r\n"), "text/csv");
}
function importJSON(input){
  const file=input.files[0]; if(!file)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      if(!data.activities||!Array.isArray(data.activities)) throw new Error("Format invalide : 'activities' manquant.");
      if(!confirm(`Importer ${data.activities.length} activité(s) ? Cela remplace les données actuelles.`))return;
      state=data; state.config=Object.assign({},DEFAULT_CONFIG,state.config||{});
      save(); go("dashboard");
    }catch(e){alert("Import impossible : "+e.message);}
  };
  r.readAsText(file); input.value="";
}
function resetAll(){
  if(!confirm("Réinitialiser TOUTES les données (config + activités) ? Cette action est irréversible."))return;
  localStorage.removeItem(LS_KEY); state=load(); save(); go("dashboard");
}

/* ---- Boot ------------------------------------------------------------- */
buildNav(); go("dashboard"); save();
